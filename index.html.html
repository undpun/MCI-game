async function reserveResourceItem(item){
  if(!fbReady) return {ok:false, reason:'ไม่สามารถเชื่อมต่อฐานข้อมูลได้'};
  try{
    const ref=fbDb.ref(DB_ROOT+'/'+KEYS.resources);
    // Same caching issue as kvRootTransaction (see comment there): Firebase's
    // transaction() runs its update function against whatever is *locally
    // cached* for this exact path, which can be null if this client has never
    // read it directly. When that happens the function below aborts on a
    // false "โหลดข้อมูลทรัพยากรไม่สำเร็จ" without ever contacting the server.
    // Force a fresh read first so the transaction always starts from real data.
    await ref.once('value');
    let durationSec=5;
    let fail='';
    const result=await ref.transaction(function(raw){
      let list;
      try{ list=typeof raw==='string'?JSON.parse(raw):raw; }
      catch(e){ list=null; }
      // A previously seeded game can still have a missing `resources` child
      // (for example after importing/resetting an older save).  The UI uses
      // DEFAULT_RESOURCES as its fallback, so initialise the Firebase child
      // from the same defaults instead of aborting with a misleading load
      // error. If the server already has data, Firebase will rerun this
      // transaction with that current value before committing.
      if(list==null){
        list=DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
      }
      if(!Array.isArray(list)){ fail='รูปแบบข้อมูลทรัพยากรไม่ถูกต้อง กรุณาให้ GM Reset game'; return; }
      const ri=list.findIndex(function(r){return r.item===item;});
      if(ri<0){ fail='ไม่พบทรัพยากร '+item; return; }
      if(Number(list[ri].stock)<=0){ fail=item+' หมด กรุณาขอ GM เพิ่ม'; return; }
      durationSec=Number(list[ri].durationSec)||5;
      const next=list.slice();
      next[ri]=Object.assign({},list[ri],{stock:Number(list[ri].stock)-1});
      return JSON.stringify(next);
    });
    if(!result.committed) return {ok:false,reason:fail||'ไม่สามารถจองทรัพยากรได้'};
    const raw=result.snapshot.val();
    const list=typeof raw==='string'?JSON.parse(raw):raw;
    const resource=(list||[]).find(function(r){return r.item===item;});
    return {ok:true,durationSec:durationSec,stock:resource?Number(resource.stock):null};
  }catch(e){
    console.error('reserveResourceItem failed',e);
    return {ok:false,reason:(e&&e.message)||'เกิดข้อผิดพลาดในการจองทรัพยากร'};
  }
}

async function refundResourceItem(item){
  if(!fbReady) return;
  try{
    const ref=fbDb.ref(DB_ROOT+'/'+KEYS.resources);
    await ref.once('value'); // see note in reserveResourceItem
    await ref.transaction(function(raw){
      let list;
      try{ list=typeof raw==='string'?JSON.parse(raw):raw; }
      catch(e){ return; }
      if(!Array.isArray(list)) return;
      const ri=list.findIndex(function(r){return r.item===item;});
      if(ri<0) return;
      const next=list.slice();
      next[ri]=Object.assign({},list[ri],{stock:Number(list[ri].stock||0)+1});
      return JSON.stringify(next);
    });
  }catch(e){ console.error('refundResourceItem failed',e); }
}

async function txStartItem(id, slotIndex, item, location){
  if(!item) return;
  id=normU(id);
  if(!canEditLockedPatient(id))return;
  if(pendingTxTextSaves[id])await pendingTxTextSaves[id].catch(function(){});
  slotIndex=Number(slotIndex);
  location=location||'TX';
  const elapsed=elapsedMinutes(STATE.gc);

  // ตรวจสอบผู้ป่วยและกำลังคนก่อน แล้วจอง stock ด้วย Firebase transaction
  // เพื่อป้องกันผู้เล่นหลายคนใช้ทรัพยากรชิ้นสุดท้ายพร้อมกัน
  const patients=await kvGet(KEYS.patients,[]);
  const idx=patients.findIndex(function(p){return normU(p.id)===id;});
  if(idx<0){toast('ไม่พบผู้ป่วย #'+id,'err');return;}

  const p=patients[idx];
  const caseObj=findCase(STATE.cases,id);
  const inTriage=location==='PRIMARY'||location==='SECONDARY';
  if(inTriage&&p.stage!==location){toast('ผู้ป่วยไม่ได้อยู่ใน '+location+' Triage','err');return;}
  if(!inTriage&&p.stage!=='TX'){toast('ผู้ป่วยไม่ได้อยู่ใน Treatment zone','err');return;}
  if(computeTxStatus(p,caseObj,elapsed)==='DEAD'){
    toast('ผู้ป่วยเสียชีวิตแล้วและต้องค้างใน Treatment','err');return;
  }
  if(!canStartSequential(p,slotIndex,elapsed)){
    toast('ต้องทำ Treatment ลำดับก่อนหน้าให้สำเร็จก่อน','err');return;
  }
  if(hasAnyTxInProgress(p,elapsed)){
    toast('มี Treatment กำลังดำเนินการอยู่','err');return;
  }

  const selectedResource=STATE.resources.find(function(r){return r.item===item;});
  if(inTriage&&!resourceTriageAllowed(selectedResource)){
    toast(item+' ไม่ได้รับอนุญาตให้ทำใน Triage','err');return;
  }
  const capacity=inTriage?triageStaffCount(location):treatmentStaffCount(p.txZone);
  const inProgress=inTriage?countTriageTreatmentInProgress(patients,location,elapsed):countZoneInProgress(patients,p.txZone,elapsed);
  if(capacity<=0||inProgress>=capacity){
    toast('ไม่มี Staff ว่างในโซน '+(inTriage?location+' Triage':p.txZone)+' ('+inProgress+'/'+capacity+')','err');return;
  }

  // Commit the patient timer and stock deduction together. This prevents a
  // partial save and also prevents two players taking the final item.
  let fail='';
  let committedPatients=null;
  let committedResources=null;
  const result=await kvRootTransaction(function(root){
    const livePatients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
    const liveResources=Array.isArray(root[KEYS.resources])
      ? root[KEYS.resources]
      : DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
    const liveRoster=root[KEYS.roster]||STATE.roster||{};
    const liveGc=root[KEYS.gc]||STATE.gc||DEFAULT_GC;
    const pi=livePatients.findIndex(function(x){return normU(x.id)===id;});
    if(pi<0){fail='ไม่พบผู้ป่วย #'+id;return null;}
    const liveP=livePatients[pi];
    if(inTriage&&liveP.stage!==location){fail='ผู้ป่วยไม่ได้อยู่ใน '+location+' Triage';return null;}
    if(!inTriage&&liveP.stage!=='TX'){fail='ผู้ป่วยไม่ได้อยู่ใน Treatment zone';return null;}
    if(computeTxStatus(liveP,caseObj,elapsed)==='DEAD'){fail='ผู้ป่วยเสียชีวิตแล้วและต้องค้างใน Treatment';return null;}
    if(!canStartSequential(liveP,slotIndex,elapsed)){fail='ต้องทำ Treatment ลำดับก่อนหน้าให้สำเร็จก่อน';return null;}
    if(hasAnyTxInProgress(liveP,elapsed)){fail='มี Treatment กำลังดำเนินการอยู่';return null;}
    const ri=liveResources.findIndex(function(r){return r.item===item;});
    if(ri<0){fail='ไม่พบทรัพยากร '+item;return null;}
    if(inTriage&&!resourceTriageAllowed(liveResources[ri])){fail=item+' ไม่ได้รับอนุญาตให้ทำใน Triage';return null;}
    if(Number(liveResources[ri].stock)<=0){fail=item+' หมด กรุณาขอ GM เพิ่ม';return null;}

    const liveCapacity=inTriage?triageStaffCount(location,liveRoster):treatmentStaffCount(liveP.txZone,liveRoster);
    const liveInProgress=inTriage?countTriageTreatmentInProgress(livePatients,location,elapsed):countZoneInProgress(livePatients,liveP.txZone,elapsed);
    if(liveCapacity<=0||liveInProgress>=liveCapacity){fail='ไม่มี Staff ว่างในโซน '+(inTriage?location+' Triage':liveP.txZone)+' ('+liveInProgress+'/'+liveCapacity+')';return null;}

    const durationSec=effectiveTreatmentDurationSec(liveResources[ri],liveGc);
    const tx=(liveP.tx||Array(TX_SLOT_COUNT).fill(null)).slice();
    tx[slotIndex]={item:item,startedAt:elapsed,durationSec:durationSec,location:location,staffName:STATE.me.name||null};
    const nextPatients=livePatients.slice();
    nextPatients[pi]=Object.assign({},liveP,{
      tx:tx,
      firstTreatmentTime:liveP.firstTreatmentTime==null?elapsed:liveP.firstTreatmentTime,
      txStartTime:location==='TX'&&liveP.txStartTime==null?elapsed:liveP.txStartTime,
      events:(liveP.events||[]).concat([{t:elapsed,type:(inTriage?'TRIAGE_TX_START '+location+' ':'TX_START ')+item,by:STATE.me.name||''}])
    });
    const nextResources=liveResources.slice();
    nextResources[ri]=Object.assign({},liveResources[ri],{stock:Number(liveResources[ri].stock)-1});
    root[KEYS.patients]=nextPatients;
    root[KEYS.resources]=nextResources;
    committedPatients=nextPatients;
    committedResources=nextResources;
    return root;
  });
  if(!result.committed){
    toast(fail||'เริ่ม Treatment ไม่สำเร็จ กรุณาลองอีกครั้ง','err');
    await refreshAll();
    return;
  }

  STATE.patients=committedPatients;
  STATE.resources=committedResources;
  render();
}

async function txCancelItem(id,slotIndex){
  id=normU(id); slotIndex=Number(slotIndex);
  if(!canEditLockedPatient(id))return;
  const elapsed=elapsedMinutes(STATE.gc);
  let fail='',cancelledItem='',committedPatients=null,committedResources=null;
  const result=await kvRootTransaction(function(root){
    const patients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
    const resources=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
    const roster=root[KEYS.roster]||STATE.roster||{};
    const pi=patients.findIndex(function(p){return normU(p.id)===id;});
    if(pi<0){fail='ไม่พบผู้ป่วย #'+id;return null;}
    const p=patients[pi];
    if(['PRIMARY','SECONDARY','TX'].indexOf(p.stage)<0){fail='ยกเลิกได้เฉพาะขณะผู้ป่วยยังอยู่ใน Triage หรือ Treatment';return null;}
    const tx=(p.tx||[]).slice();
    const slot=tx[slotIndex];
    if(!slot){fail='ไม่พบ Treatment ที่ต้องการยกเลิก';return null;}
    const requiredStation=treatmentStationForSlot(p,slot);
    const actingStation=roster[STATE.me.name]&&roster[STATE.me.name].station;
    if(actingStation!=='GM'&&actingStation!==requiredStation){fail='ต้องอยู่ใน Zone ที่ทำ Treatment นี้จึงจะยกเลิกได้';return null;}
    const ri=resources.findIndex(function(r){return r.item===slot.item;});
    if(ri<0){fail='ไม่พบทรัพยากร '+slot.item;return null;}
    cancelledItem=slot.item;
    tx.splice(slotIndex,1);
    const nextPatients=patients.slice();
    nextPatients[pi]=Object.assign({},p,{tx:compactTreatmentSlots(tx),events:(p.events||[]).concat([{t:elapsed,type:'TX_CANCEL '+slot.item,by:STATE.me.name||''}])});
    const nextResources=resources.slice();
    nextResources[ri]=Object.assign({},resources[ri],{stock:Number(resources[ri].stock||0)+1});
    root[KEYS.patients]=nextPatients; root[KEYS.resources]=nextResources;
    committedPatients=nextPatients; committedResources=nextResources;
    return root;
  });
  if(!result.committed){toast(fail||'ยกเลิก Treatment ไม่สำเร็จ','err');return;}
  STATE.patients=committedPatients; STATE.resources=committedResources;
  render();
}

async function txSetDispo(id, dispo){
  if(!canEditLockedPatient(id))return;
  const elapsed=elapsedMinutes(STATE.gc);
  const saved=await mutatePatients(function(patients){
    const idx=patients.findIndex(function(p){return normU(p.id)===normU(id);});if(idx<0)return null;
    const p=patients[idx], status=computeTxStatus(p,findCase(STATE.cases,id),elapsed);
    if(status==='DEAD'){toast('ผู้ป่วยเสียชีวิตแล้วและต้องค้างใน Treatment','err');return null;}
    if(hasAnyTxInProgress(p,elapsed)){toast('Treatment ยังไม่เสร็จ','err');return null;}
    // Deliberately NOT blocking on whether required tx were completed correctly/in
    // time — that must stay hidden from players. Missing required treatments may
    // still be completed by the virtual hospital after travel time has elapsed.
    let next;
    if(dispo==='TRANSFER') next=Object.assign({},p,{dispo:'TRANSFER',transferOrder:maxOrder(patients,'transferOrder')+1,transferArrivalTime:elapsed,stage:'TRANSFER',events:(p.events||[]).concat([{t:elapsed,type:'TO_TRANSFER',by:STATE.me.name||''}])});
    else next=Object.assign({},p,{dispo:'DISCHARGE',stage:'CLOSED',dischargeTime:elapsed,events:(p.events||[]).concat([{t:elapsed,type:'DISCHARGE_TX',by:STATE.me.name||''}])},dischargeOutcomeFields(p,findCase(STATE.cases,p.id),elapsed,'DISCHARGE_TX'));
    const copy=patients.slice();copy[idx]=next;return copy;
  });
  if(saved&&STATE.me.station&&STATE.me.station.indexOf('TX_')===0){await releasePatientLocks([id]);setFocusedPatient(STATE.me.station,null);render(true);}
}

/* ============================================================
   13) DISPATCH ACTION
============================================================ */
async function dispatchSend(vehicleName,selectedIds,selectedHospital,suppressRender){
  vehicleName=norm(vehicleName);
  const explicitSelection=Array.isArray(selectedIds);
  const wantedIds=explicitSelection?uniq(selectedIds.map(normU).filter(Boolean)):[];
  if(!vehicleName){toast('เลือกรถก่อน','err');return false;}
  if(explicitSelection&&!wantedIds.length){toast('เลือกผู้ป่วยอย่างน้อย 1 คน','err');return false;}
  const elapsed=elapsedMinutes(STATE.gc);
  const lockNow=Date.now();
  let fail='';
  let summary=null;
  const result=await kvRootTransaction(function(root){
    fail='';summary=null;
    const vehicles=Array.isArray(root[KEYS.vehicles])?root[KEYS.vehicles]:DEFAULT_VEHICLES.slice();
    const patients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
    const hospitals=Array.isArray(root[KEYS.hospitals])?root[KEYS.hospitals]:DEFAULT_HOSPITALS.slice();
    const casesNow=Array.isArray(root[KEYS.cases])?root[KEYS.cases]:STATE.cases;
    const resourcesNow=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:STATE.resources;
    const gcNow=root[KEYS.gc]||STATE.gc;
    const locksNow=root[KEYS.locks]||{};
    const vehicle=vehicles.find(function(v){return v.name===vehicleName;});
    if(!vehicle){fail='ไม่พบรถ '+vehicleName;return null;}
    if(vehicleEffectiveStatus(vehicle,elapsed)!=='AVAILABLE'){fail='รถยังไม่ว่าง';return null;}
    if(vehicleDeploymentState(vehicle,elapsed)!=='LOADING'){fail='รถไม่ได้อยู่ที่ Loading';return null;}
    if(explicitSelection){
      const selectedVehicleLock=locksNow[vehicleLockKey(vehicleName)];
      if(!patientLockIsActive(selectedVehicleLock,lockNow)||!patientLockOwnedByMe(selectedVehicleLock)){fail='รถ '+vehicleName+' ถูกเลือกจากหน้าจออื่นหรือสิทธิ์หมดอายุ กรุณาเลือกรถใหม่';return null;}
    }

    let assigned;
    if(explicitSelection){
      const unavailable=wantedIds.find(function(id){
        const lock=locksNow[id];
        return !patientLockIsActive(lock,lockNow)||!patientLockOwnedByMe(lock);
      });
      if(unavailable){fail='สิทธิ์จัดผู้ป่วย No. '+unavailable+' หมดอายุหรือถูกใช้งานจากหน้าจออื่น กรุณาเลือกใหม่';return null;}
      assigned=patients.filter(function(p){return p.stage==='TRANSFER'&&wantedIds.indexOf(normU(p.id))>-1;});
      if(assigned.length!==wantedIds.length){fail='ผู้ป่วยบางคนถูกย้ายออกจาก Transfer แล้ว กรุณาเลือกใหม่';return null;}
    }else{
      assigned=patients.filter(function(p){return p.stage==='TRANSFER'&&p.vehicle===vehicleName;});
    }
    if(!assigned.length){fail='ไม่มีผู้ป่วยที่เลือกสำหรับรถคันนี้';return null;}
    if(assigned.some(function(p){return patientIsDead(p,elapsed);})){fail='มีผู้ป่วยที่ไม่สามารถส่งต่อได้ กรุณาเลือกใหม่';return null;}

    const hospitalsList=explicitSelection?[selectedHospital].filter(Boolean):uniq(assigned.map(function(p){return p.hospital;}).filter(Boolean));
    if(hospitalsList.length===0){fail='ยังไม่ได้กำหนดโรงพยาบาลปลายทาง';return null;}
    if(hospitalsList.length>1){fail='ผู้ป่วยบนรถปลายทางไม่ตรงกัน (Mixed hospital)';return null;}
    const hospital=hospitalsList[0];
    const hCapacity=hospitals.find(function(h){return h.name===hospital;});
    if(!hCapacity){fail='ไม่พบโรงพยาบาลปลายทาง';return null;}
    const type=normU(vehicle.type||vehicleType(vehicleName));
    const sitting=assigned.filter(function(p){return effectiveCanWalk(p)==='yes';}).length;
    const lying=assigned.length-sitting;
    const load=calcVehicleLoad(type,assigned.length,sitting,lying,1);
    if(!load.ok){fail='โหลดเกินกำหนด: '+load.label;return null;}

    const ms=Object.assign({},DEFAULT_GC.mapSettings,gcNow.mapSettings||{});
    const manualOutbound=Number(hCapacity.outboundMin!=null?hCapacity.outboundMin:hCapacity.distanceMin)||5;
    const manualReturn=Number(hCapacity.returnMin!=null?hCapacity.returnMin:hCapacity.distanceMin)||manualOutbound;
    const sceneTimes=(ms.useMap&&ms.distTransfer)?sceneRouteTravelTimes(hospital):null;
    const outboundMin=!ms.useMap?manualOutbound:(!ms.distTransfer?0:(sceneTimes?sceneTimes.outboundMin:manualOutbound));
    let returnMin=!ms.useMap?manualReturn:(!ms.distTransfer?0:(sceneTimes?sceneTimes.returnMin:manualReturn));
    const outboundPath=(sceneTimes&&sceneTimes.outboundPath)||[];
    let returnPath=(sceneTimes&&sceneTimes.returnPath)||[];
    if(ms.useMap&&ms.distTransfer){
      const returnTent=sceneTent(((gcNow.transportMode||'SPLIT')==='COMBINED')?'loading':'parking'),hospitalTent=(STATE.scene&&STATE.scene.data&&STATE.scene.data.tents||[]).find(function(t){return t.typeId==='hospital'&&(t.name===hospital||t.linkedHospitalName===hospital);});
      if(returnPath.length>1&&returnTent)returnPath=appendRouteEndpoint(returnPath,returnTent);
      else if(returnTent&&hospitalTent){returnMin=(haversineKm(hospitalTent.lat,hospitalTent.lng,returnTent.lat,returnTent.lng)/AMBULANCE_FALLBACK_KMH)*60;returnPath=[{lat:hospitalTent.lat,lng:hospitalTent.lng},{lat:returnTent.lat,lng:returnTent.lng}];}
    }
    const arrivalAt=elapsed+outboundMin;
    const transportHarmAt=elapsed+outboundMin/2;
    const allowHospitalTreatment=hospitalTreatmentEnabled(gcNow);
    const assignedKeys={};assigned.forEach(function(p){assignedKeys[normU(p.id)]=true;});
    const capacityKeys={};
    const projected={RED:Number(hCapacity.redUsed||0),YELLOW:Number(hCapacity.yellowUsed||0),GREEN:Number(hCapacity.greenUsed||0)};
    let sentCount=0,mismatchCount=0,acceptedCount=0,deadCount=0;

    const nextPatients=patients.map(function(p){
      if(p.stage!=='TRANSFER'||!assignedKeys[normU(p.id)])return p;
      const base=Object.assign({},p,{vehicle:vehicleName,hospital:hospital});
      const caseObj=findCase(casesNow,p.id);
      const requiredVehicle=requiredVehicleFor(caseObj);
      const wrongVehicle=requiredVehicle&&type!==normU(requiredVehicle);
      sentCount++;
      if(wrongVehicle){
        mismatchCount++;
        return Object.assign({},base,{
          stage:'HOSPITAL',transferStatus:'IN_TRANSIT_TO_HOSPITAL',closedReason:null,transferTime:elapsed,
          hospitalPlannedArrivalTime:arrivalAt,hospitalArrivalTime:null,hospitalTx:[],
          hospitalCare:{dispatchedAt:elapsed,arrivalAt:arrivalAt,treatmentCompleteAt:arrivalAt,outcomeAt:transportHarmAt,willSurvive:false,transportHarm:true},
          hospitalOutcome:null,transportMismatch:true,requiredVehicle:requiredVehicle||null,overCapacity:false,
          events:(p.events||[]).concat([{t:elapsed,type:'DISPATCH '+vehicleName+' → '+hospital+' (DO HARM: WRONG VEHICLE)',by:STATE.me.name||''}])
        });
      }
      if(!allowHospitalTreatment){
        const txComplete=requiredTxComplete(p,caseObj,elapsed);
        let transferStatus,closedReason;
        if(!txComplete){transferStatus='DEAD_TX_INCOMPLETE';closedReason='DEAD_TX_INCOMPLETE';deadCount++;}
        else{transferStatus='ACCEPTED';closedReason='TRANSFER_ACCEPTED';acceptedCount++;capacityKeys[normU(p.id)]=true;}
        const color=p.secondary||'';
        let overCapacity=false;
        if(closedReason==='TRANSFER_ACCEPTED'&&projected[color]!=null){
          projected[color]++;
          const cap=color==='RED'?hCapacity.redCap:color==='YELLOW'?hCapacity.yellowCap:hCapacity.greenCap;
          overCapacity=projected[color]>Number(cap||0);
        }
        return Object.assign({},base,{
          stage:'CLOSED',transferStatus:transferStatus,closedReason:closedReason,transferTime:elapsed,
          hospitalTx:[],hospitalCare:null,hospitalOutcome:null,hospitalArrivalTime:null,hospitalPlannedArrivalTime:null,
          transportMismatch:false,requiredVehicle:requiredVehicle||null,overCapacity:overCapacity,
          events:(p.events||[]).concat([{t:elapsed,type:'DISPATCH '+vehicleName+' → '+hospital+' (LEGACY)',by:STATE.me.name||''}])
        });
      }
      const hospitalTx=buildHospitalTreatmentPlan(p,caseObj,arrivalAt,resourcesNow,gcNow,elapsed);
      const treatmentCompleteAt=hospitalTx.length?hospitalTx[hospitalTx.length-1].startedAt+hospitalTx[hospitalTx.length-1].durationSec/60:arrivalAt;
      const willSurvive=hospitalPlanWillSucceed(p,caseObj,hospitalTx);
      const limit=Number(caseObj&&caseObj.timeLimit)||999;
      const outcomeAt=willSurvive?treatmentCompleteAt:Math.max(elapsed,Math.min(treatmentCompleteAt,limit));
      capacityKeys[normU(p.id)]=true;
      const color=p.secondary||'';
      let overCapacity=false;
      if(projected[color]!=null){
        projected[color]++;
        const cap=color==='RED'?hCapacity.redCap:color==='YELLOW'?hCapacity.yellowCap:hCapacity.greenCap;
        overCapacity=projected[color]>Number(cap||0);
      }
      return Object.assign({},base,{
        stage:'HOSPITAL',transferStatus:'IN_TRANSIT_TO_HOSPITAL',closedReason:null,transferTime:elapsed,
        hospitalPlannedArrivalTime:arrivalAt,hospitalArrivalTime:null,hospitalTx:hospitalTx,
        hospitalCare:{dispatchedAt:elapsed,arrivalAt:arrivalAt,treatmentCompleteAt:treatmentCompleteAt,outcomeAt:outcomeAt,willSurvive:willSurvive,transportHarm:false},
        transportMismatch:false,requiredVehicle:requiredVehicle||null,overCapacity:overCapacity,
        events:(p.events||[]).concat([{t:elapsed,type:'DISPATCH '+vehicleName+' → '+hospital,by:STATE.me.name||''}])
      });
    });

    const nextHospitals=hospitals.map(function(h){
      if(h.name!==hospital)return h;
      let addRed=0,addYellow=0,addGreen=0;
      nextPatients.forEach(function(p){
        if(!capacityKeys[normU(p.id)])return;
        if(p.secondary==='RED')addRed++;else if(p.secondary==='YELLOW')addYellow++;else if(p.secondary==='GREEN')addGreen++;
      });
      return Object.assign({},h,{redUsed:Number(h.redUsed||0)+addRed,yellowUsed:Number(h.yellowUsed||0)+addYellow,greenUsed:Number(h.greenUsed||0)+addGreen});
    });
    const nextVehicles=vehicles.map(function(v){return v.name===vehicleName?Object.assign({},v,{
      deploymentState:'HOSPITAL_TRIP',busyStartElapsed:elapsed,outboundMin:outboundMin,returnMin:returnMin,outboundPath:outboundPath,returnPath:returnPath,
      busyUntilElapsed:elapsed+outboundMin+returnMin,busyHospital:hospital
    }):v;});
    root[KEYS.patients]=nextPatients;
    root[KEYS.hospitals]=nextHospitals;
    root[KEYS.vehicles]=nextVehicles;
    if(explicitSelection){
      const nextLocks=Object.assign({},locksNow);
      wantedIds.forEach(function(id){delete nextLocks[id];});
      delete nextLocks[vehicleLockKey(vehicleName)];
      root[KEYS.locks]=nextLocks;
    }
    summary={allowHospitalTreatment:allowHospitalTreatment,hospital:hospital,sentCount:sentCount,mismatchCount:mismatchCount,acceptedCount:acceptedCount,deadCount:deadCount};
    return root;
  });
  if(!result.committed){toast(fail||'ส่งรถไม่สำเร็จ กรุณาลองใหม่','err');return false;}
  if(result.root){
    if(result.root[KEYS.patients])STATE.patients=result.root[KEYS.patients];
    if(result.root[KEYS.hospitals])STATE.hospitals=result.root[KEYS.hospitals];
    if(result.root[KEYS.vehicles])STATE.vehicles=result.root[KEYS.vehicles];
    if(result.root[KEYS.locks])STATE.locks=result.root[KEYS.locks];
  }
  if(!suppressRender)render();
  return true;
}

async function gmUpdateResource(item, patch){

  if(result.committed){STATE.resources=result.root[KEYS.resources];STATE.gc=result.root[KEYS.gc];toast('บันทึกทรัพยากร '+item+' เป็นค่าตั้งต้นล่าสุดแล้ว','ok');render();}else toast('บันทึกทรัพยากรไม่สำเร็จ','err');
}
async function gmAddResource(item, stock, durationSec){
  item=norm(item);
  if(!item){toast('กรุณากรอกชื่อทรัพยากร','err');return;}
  if(STATE.resources.some(function(r){return String(r.item).toLowerCase()===item.toLowerCase();})){
    toast('มีทรัพยากรชื่อนี้แล้ว','err');return;
  }
  const rec={item:item,stock:Math.max(0,Number(stock)||0),durationSec:Math.max(1,Number(durationSec)||5),triageAllowed:false,addedTotal:Math.max(0,Number(stock)||0)};
  const result=await kvRootTransaction(function(root){const list=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);}),gc=Object.assign({},root[KEYS.gc]||STATE.gc),baseline=(Array.isArray(gc.resourceBaseline)?gc.resourceBaseline:resourceBaselineFromCurrent(list)).map(function(r){return Object.assign({},r);});if(list.some(function(r){return String(r.item).toLowerCase()===item.toLowerCase();}))return null;root[KEYS.resources]=list.concat([rec]);gc.resourceBaseline=baseline.concat([Object.assign({},rec)]);root[KEYS.gc]=gc;return root;});
  if(result.committed){STATE.resources=result.root[KEYS.resources];STATE.gc=result.root[KEYS.gc];toast('เพิ่มทรัพยากร '+item+' และบันทึกเป็นค่าตั้งต้นแล้ว','ok');render();}else toast('มีทรัพยากรชื่อนี้แล้ว','err');
}
async function gmUpdateHospital(name, patch){

  STATE.hospitals=await kvGet(KEYS.hospitals,DEFAULT_HOSPITALS);toast('อัปเดตโรงพยาบาล '+name,'ok');render();
}
async function gmRenameHospital(oldName,newName,patch){
  newName=norm(newName); if(!newName){toast('กรุณากรอกชื่อโรงพยาบาล','err');return;}
  await kvRootTransaction(function(root){
    root[KEYS.hospitals]=(root[KEYS.hospitals]||DEFAULT_HOSPITALS).map(function(h){return h.name===oldName?Object.assign({},h,patch,{name:newName}):h;});

async function gmDeleteHospital(name){
  if(STATE.gc.mapSettings && STATE.gc.mapSettings.useMap){toast('กรุณาปิด “ใช้ Map” ก่อนลบโรงพยาบาลที่กรอกเอง','err');return;}

/* ============================================================
   15) RENDER CORE (shell, join, waiting, topbar, toasts)
============================================================ */
/* The embedded Scene Setup module owns a live Leaflet map instance that must
   NOT be destroyed by innerHTML replacement while GM is actively working in
   it (dragging pins etc. isn't caught by the [data-preserve] focus-guard
   below, since map drags don't focus a form control). So once mounted, we
   skip full re-renders entirely while GM stays on that tab; we only rebuild
   when the tab actually changes (which calls render(true) and, in the else
   branch below, tears the map down cleanly first). */
let sceneMounted = false;
/* Stations that get the read-only live Scene Map panel. GM also gets it
   (optional, per spec) whenever GM isn't already on the Scene Setup editor
   tab, since that tab has its own live map. */
const SCENE_VIEWER_STATIONS = ['COMMANDER','LOADING','PARKING'];
let sceneViewerMounted = false;
let renderGuardsBound=false;
function rosterStationSnapshot(){
  const compact={};
  Object.keys(STATE.roster||{}).forEach(function(name){compact[name]=(STATE.roster[name]&&STATE.roster[name].station)||null;});
  return compact;
}
function renderSnapshotForCurrentView(){
  const st=STATE.me.station;
  const base={gc:STATE.gc,me:STATE.me,ready:STATE.ready,fbConnected:STATE.fbConnected,toasts:STATE.toasts,ui:STATE.ui,locks:compactActiveLocks(),communicationHeads:communicationHeadsSignature(STATE.communications)};
  const rosterStations=rosterStationSnapshot();
  if(!STATE.me.name||!STATE.ready||!st)return JSON.stringify(Object.assign(base,{roster:rosterStations}));
  if(st==='GM')return JSON.stringify(Object.assign(base,{cases:STATE.cases,resources:STATE.resources,hospitals:STATE.hospitals,vehicles:STATE.vehicles,patients:STATE.patients,roster:rosterStations,scene:STATE.scene,gmTab:STATE.gmTab}));
  if(st==='COMMANDER')return JSON.stringify(Object.assign(base,{roster:rosterStations,hospitals:STATE.hospitals,vehicles:STATE.vehicles,scene:STATE.scene}));
  let relevant=[];
  if(st==='PRIMARY')relevant=STATE.patients.filter(function(p){return p.stage==='PRIMARY'||(p.stage==='TRANSIT'&&p.transit&&p.transit.fromStage==='PRIMARY');});
  else if(st==='SECONDARY')relevant=STATE.patients.filter(function(p){return p.stage==='SECONDARY'||(p.stage==='TRANSIT'&&p.transit&&p.transit.fromStage==='SECONDARY');});
  else if(st.indexOf('TX_')===0){const zone=st.slice(3);relevant=STATE.patients.filter(function(p){return p.stage==='TX'&&p.txZone===zone;}).map(function(p){const copy=Object.assign({},p);delete copy.dx;delete copy.txNote;return copy;});}
  else if(st==='LOADING'||st==='PARKING')relevant=STATE.patients.filter(function(p){return p.stage==='TRANSFER';});
  else if(st==='DISCHARGE')relevant=STATE.patients.filter(function(p){return p.stage==='CLOSED';});
  const scoped={patients:relevant,roster:rosterStations};
  if(st==='PRIMARY'||st==='SECONDARY'||st.indexOf('TX_')===0)scoped.resources=STATE.resources;
  if(st==='LOADING'||st==='PARKING')Object.assign(scoped,{hospitals:STATE.hospitals,vehicles:STATE.vehicles,scene:STATE.scene});
  return JSON.stringify(Object.assign(base,scoped));
}
function render(force){
  const onSceneTab = STATE.ready && STATE.me.station==='GM' && STATE.gmTab==='scene';
  if(onSceneTab && sceneMounted){ updateSceneViewerPanel(); renderCommunicationUI(); refreshHowToAfterRender(); return; }

  const snap=renderSnapshotForCurrentView();
  if(!force && snap===STATE._snapshot){updateLiveTimersOnly();updateSceneViewerPanel();renderCommunicationUI();refreshHowToAfterRender();return;}
  STATE._snapshot = snap;

  const active = document.activeElement;
  let preserved = null;
  if(active && active.id && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName||'')){
    preserved = {id:active.id, value:active.value, selStart:active.selectionStart, selEnd:active.selectionEnd};
  }

  const app = document.getElementById('app');
  if(!renderGuardsBound){
    renderGuardsBound=true;
    app.addEventListener('pointerdown',function(e){if(e.target.closest('[data-act]'))actionPointerBusy=true;if(e.target.closest('select'))selectMenuBusy=true;},true);
    app.addEventListener('focusin',function(e){if(e.target.tagName==='SELECT')selectMenuBusy=true;},true);
    app.addEventListener('focusin',function(e){if(e.target.closest('[data-case-field]'))caseFormBusy=true;},true);
    app.addEventListener('change',function(e){if(e.target.closest('select')){selectMenuBusy=false;if(backgroundRenderPending)scheduleBackgroundRender();}},true);
    app.addEventListener('focusout',function(e){if(e.target.tagName==='SELECT'){selectMenuBusy=false;if(backgroundRenderPending)scheduleBackgroundRender();}},true);
    app.addEventListener('focusout',function(e){if(!e.target.closest('[data-case-field]'))return;setTimeout(function(){caseFormBusy=!!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('[data-case-field]'));if(!caseFormBusy&&backgroundRenderPending)scheduleBackgroundRender();},0);},true);
    window.addEventListener('pointerup',function(){if(!actionPointerBusy)return;actionPointerBusy=false;if(backgroundRenderPending&&!selectMenuBusy&&!caseFormBusy)scheduleBackgroundRender();},true);
    window.addEventListener('pointercancel',function(){actionPointerBusy=false;selectMenuBusy=false;if(backgroundRenderPending)scheduleBackgroundRender();},true);
  }
  app.innerHTML = buildView();

  if(preserved){
    const el = document.getElementById(preserved.id);
    if(el){
      el.value = preserved.value;
      el.focus();
      if(el.tagName==='SELECT')selectMenuBusy=false;
      try{ el.setSelectionRange(preserved.selStart, preserved.selEnd); }catch(e){}
    }
  }

  if(onSceneTab){
    sceneMounted = true;
    window.SceneApp && window.SceneApp.mount({
      container: document.getElementById('scRoot'),
      data: STATE.scene && STATE.scene.data,
      hospitals: STATE.hospitals
    });
  }else if(sceneMounted){
    sceneMounted = false;
    window.SceneApp && window.SceneApp.destroy();
  }

  updateSceneViewerPanel();
  renderCommunicationUI();
  refreshHowToAfterRender();
}

/* Shows/hides + mounts/destroys/updates the persistent #sceneViewerHost
   panel. The panel's DOM node lives outside #app (untouched by the
   app.innerHTML rebuild above), so mount() only runs once when a relevant
   station first becomes active; every other call here is a cheap
   setData()/setVehicles() update — this is what lets vehicle markers
   animate smoothly on every ~1s render tick without the map flickering
   or re-initializing. */
function updateSceneViewerPanel(){
  const host = document.getElementById('sceneViewerHost');
  if(!host) return;
  const st = STATE.me && STATE.me.station;
  const wantsIt = STATE.ready && st && sceneReady() && STATE.scene && STATE.scene.data && (
    SCENE_VIEWER_STATIONS.indexOf(st)>-1 || (st==='GM' && STATE.gmTab!=='scene')
  );
  if(!wantsIt){
    if(sceneViewerMounted){ sceneViewerMounted=false; window.SceneViewer && window.SceneViewer.destroy(); }
    host.classList.add('hidden');
    return;
  }
  host.classList.remove('hidden');
  if(!sceneViewerMounted){
    sceneViewerMounted = true;
    window.SceneViewer && window.SceneViewer.mount({container: document.getElementById('sceneViewerMap'), data: STATE.scene.data});
  }else{
    window.SceneViewer && window.SceneViewer.setData(STATE.scene.data);
  }
  window.SceneViewer && window.SceneViewer.setVehicles(STATE.vehicles, elapsedMinutes(STATE.gc));
}

function buildView(){
  if(!fbReady){
    return viewSetupNeeded();
  }
  const banner = STATE.fbConnected===false ? viewConnErrorBanner() : '';
  if(!STATE.me.name){
    return banner + viewJoin();
  }
  if(!STATE.ready){
    return banner + '<div class="waitwrap"><div class="spinner"></div><p>กำลังโหลด...</p></div>';
  }
  if(!STATE.me.station){
    return banner + viewWaiting();
  }
  return banner + viewShell(viewStationBody());
}

const HOWTO_STATE={open:false,key:null,index:0,positionFrame:null};
function currentHowToKey(){
  if(!STATE.me||!STATE.me.station)return null;
  const station=STATE.me.station;
  if(station==='GM')return 'GM';
  if(STATE.gc&&STATE.gc.status==='ENDED'&&STATE.gc.debriefActive)return 'DEBRIEF';
  if(station.indexOf('TX_')===0)return 'TX';
  if(station==='LOADING'&&transportCombined())return 'LOADING_PARKING';
  return station;
}

function howToTargetForStep(step){
  if(!step||!step.selector)return null;
  const selectors=Array.isArray(step.selector)?step.selector:[step.selector];
  for(let i=0;i<selectors.length;i++){const el=document.querySelector(selectors[i]);if(el)return el;}
  return null;
}
function openHowTo(){
  const key=currentHowToKey();if(!key)return;

  HOWTO_STATE.open=true;HOWTO_STATE.key=key;HOWTO_STATE.index=0;renderHowTo();
}
function closeHowTo(){
  HOWTO_STATE.open=false;HOWTO_STATE.key=null;HOWTO_STATE.index=0;
  const host=document.getElementById('howToPlayHost');if(host){host.classList.add('hidden');host.innerHTML='';}
}
function moveHowTo(delta){
  if(!HOWTO_STATE.open)return;
  const steps=howToStepsForKey(HOWTO_STATE.key),next=HOWTO_STATE.index+delta;
  if(next>=steps.length){try{localStorage.setItem('mciHowToCompleted:'+HOWTO_STATE.key,'1');}catch(e){}closeHowTo();return;}
  HOWTO_STATE.index=Math.max(0,next);renderHowTo();
}
function renderHowTo(){
  const host=document.getElementById('howToPlayHost');if(!host||!HOWTO_STATE.open)return;
  if(HOWTO_STATE.key!==currentHowToKey()){closeHowTo();return;}
  const steps=howToStepsForKey(HOWTO_STATE.key);HOWTO_STATE.index=Math.min(HOWTO_STATE.index,steps.length-1);
  const step=steps[HOWTO_STATE.index],target=howToTargetForStep(step),last=HOWTO_STATE.index===steps.length-1;
  const dots=steps.map(function(_,i){return '<span class="howto-dot '+(i===HOWTO_STATE.index?'active':i<HOWTO_STATE.index?'done':'')+'"></span>';}).join('');
  host.classList.remove('hidden');
  host.innerHTML='<div class="howto-spotlight '+(target?'':'no-target')+'" id="howToSpotlight"></div><section class="howto-card" id="howToCard" data-placement="center" role="dialog" aria-modal="true" aria-label="วิธีเล่น '+esc(howToZoneTitle(HOWTO_STATE.key))+'"><div class="howto-top"><span class="howto-brand">HOW TO PLAY · '+esc(howToZoneTitle(HOWTO_STATE.key))+'</span><button class="howto-skip" data-howto-act="skip">ข้าม ✕</button></div><div class="howto-content">'+howToVisualHtml(HOWTO_STATE.key)+'<div class="howto-kicker">STEP '+(HOWTO_STATE.index+1)+'</div><h2 class="howto-title">'+esc(step.title)+'</h2><div class="howto-body">'+step.body+'</div>'+(step.callout?'<div class="howto-callout"><span>💡</span><span>'+step.callout+'</span></div>':'')+'</div><div class="howto-bottom"><div class="howto-progress"><div class="howto-dots">'+dots+'</div><span class="howto-count">'+(HOWTO_STATE.index+1)+' / '+steps.length+'</span></div><div class="howto-actions"><span class="howto-keyhint">← → ใช้ลูกศรได้</span>'+(HOWTO_STATE.index?'<button class="btn sm" data-howto-act="prev">ย้อนกลับ</button>':'')+'<button class="btn sm primary howto-next" data-howto-act="next">'+(last?'เข้าใจแล้ว ✓':'ถัดไป →')+'</button></div></div></section>';
  if(target){
    const rect=target.getBoundingClientRect();
    if(rect.bottom<70||rect.top>window.innerHeight-70)target.scrollIntoView({block:'center',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }
  requestAnimationFrame(positionHowTo);
  setTimeout(function(){if(HOWTO_STATE.open)positionHowTo();},220);
}
function positionHowTo(){
  if(!HOWTO_STATE.open)return;
  const steps=howToStepsForKey(HOWTO_STATE.key),step=steps[HOWTO_STATE.index],target=howToTargetForStep(step),spot=document.getElementById('howToSpotlight'),card=document.getElementById('howToCard');if(!spot||!card)return;
  if(!target){spot.className='howto-spotlight no-target';card.dataset.placement='center';card.style.left=Math.max(12,(window.innerWidth-card.offsetWidth)/2)+'px';card.style.top=Math.max(12,(window.innerHeight-card.offsetHeight)/2)+'px';return;}
  const r=target.getBoundingClientRect(),pad=7,top=Math.max(5,r.top-pad),left=Math.max(5,r.left-pad),right=Math.min(window.innerWidth-5,r.right+pad),bottom=Math.min(window.innerHeight-5,r.bottom+pad);
  spot.className='howto-spotlight';spot.style.top=top+'px';spot.style.left=left+'px';spot.style.width=Math.max(12,right-left)+'px';spot.style.height=Math.max(12,bottom-top)+'px';
  if(window.innerWidth<=760)return;
  const cw=card.offsetWidth,ch=card.offsetHeight,gap=16,margin=12;let placement='center',x=Math.max(margin,(window.innerWidth-cw)/2),y=Math.max(margin,(window.innerHeight-ch)/2);
  if(window.innerHeight-bottom>=ch+gap){placement='below';y=bottom+gap;x=Math.min(window.innerWidth-cw-margin,Math.max(margin,(left+right-cw)/2));card.style.setProperty('--arrow-x',Math.max(18,Math.min(cw-30,(left+right)/2-x-7))+'px');}
  else if(top>=ch+gap){placement='above';y=top-ch-gap;x=Math.min(window.innerWidth-cw-margin,Math.max(margin,(left+right-cw)/2));card.style.setProperty('--arrow-x',Math.max(18,Math.min(cw-30,(left+right)/2-x-7))+'px');}
  else if(window.innerWidth-right>=cw+gap){placement='right';x=right+gap;y=Math.min(window.innerHeight-ch-margin,Math.max(margin,(top+bottom-ch)/2));card.style.setProperty('--arrow-y',Math.max(18,Math.min(ch-30,(top+bottom)/2-y-7))+'px');}
  else if(left>=cw+gap){placement='left';x=left-cw-gap;y=Math.min(window.innerHeight-ch-margin,Math.max(margin,(top+bottom-ch)/2));card.style.setProperty('--arrow-y',Math.max(18,Math.min(ch-30,(top+bottom)/2-y-7))+'px');}
  card.dataset.placement=placement;card.style.left=x+'px';card.style.top=y+'px';
}

function renderClockPill(){
  const elapsed = elapsedMinutes(STATE.gc);
  const statusLabel = STATE.gc.status==='RUNNING' ? 'กำลังดำเนินการ' : STATE.gc.status==='ENDED' ? 'จบเกมแล้ว' : 'ยังไม่เริ่ม';
  return ''
  + '<div class="clockwrap">'
  +   '<span class="pill status-'+STATE.gc.status+'">● '+statusLabel+'</span>'
  +   '<span class="timerbig" id="liveTimer">'+ (STATE.gc.status==='NOT_STARTED' ? '--:--' : fmtClock(elapsed)) +'</span>'
  +   '<span class="pill">Max <b>'+STATE.gc.maxGameMin+'</b> น.</span>'
  + '</div>';
}
function fmtClock(elapsedMin){
  const totalSec = Math.max(0, Math.round(elapsedMin*60));
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function patientEventTime(p,type){
  const event=(p&&p.events||[]).find(function(e){return e&&e.type===type;});
  return event&&Number.isFinite(Number(event.t))?Number(event.t):null;
}
function patientZoneEntryTime(p,zone){
  if(!p)return 0;
  if(zone==='PRIMARY')return Number(p.createdAt)||0;
  if(zone==='SECONDARY'){
    if(p.stage==='TRANSIT'&&p.transit&&p.transit.toStage==='SECONDARY')return Number(p.transit.arriveElapsed)||0;
    return p.secondaryArrivalTime!=null?Number(p.secondaryArrivalTime):(p.primaryTime!=null?Number(p.primaryTime):Number(p.createdAt)||0);
  }
  if(String(zone||'').indexOf('TX_')===0){
    if(p.stage==='TRANSIT'&&p.transit&&p.transit.toStage==='TX')return Number(p.transit.arriveElapsed)||0;
    return p.txArrivalTime!=null?Number(p.txArrivalTime):(p.secondaryTime!=null?Number(p.secondaryTime):Number(p.createdAt)||0);
  }
  if(zone==='TRANSFER'){
    const eventTime=patientEventTime(p,'TO_TRANSFER');
    return p.transferArrivalTime!=null?Number(p.transferArrivalTime):(eventTime!=null?eventTime:(p.txStartTime!=null?Number(p.txStartTime):Number(p.createdAt)||0));
  }
  if(zone==='HOSPITAL'){
    if(p.hospitalArrivalTime!=null)return Number(p.hospitalArrivalTime);
    if(p.hospitalCare&&p.hospitalCare.arrivalAt!=null)return Number(p.hospitalCare.arrivalAt);
    if(p.hospitalPlannedArrivalTime!=null)return Number(p.hospitalPlannedArrivalTime);
    return p.transferTime!=null?Number(p.transferTime):Number(p.createdAt)||0;
  }
  return Number(p.createdAt)||0;
}
function zoneEntryClockHtml(p,zone){
  const t=patientZoneEntryTime(p,zone);
  const wallTime=STATE.gc&&STATE.gc.startTime?new Date(Number(STATE.gc.startTime)+t*60000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):fmtClock(t);
  const projected=p.stage==='TRANSIT'||(zone==='HOSPITAL'&&p.stage==='HOSPITAL'&&p.hospitalCare&&elapsedMinutes(STATE.gc)<Number(p.hospitalCare.arrivalAt));
  return '<div class="pixel-zone-time">'+(projected?'ถึง ':'เข้า ')+esc(wallTime)+'</div>';
}
function sortByZoneEntry(zone){
  return function(a,b){
    const diff=patientZoneEntryTime(a,zone)-patientZoneEntryTime(b,zone);
    return diff||String(a.id||'').localeCompare(String(b.id||''),undefined,{numeric:true});
  };
}

function visibleTxSlotIndexes(p){

function txSlotSelectHtml(p, slotIndex, elapsed, context){
  context=context||'TX';
  const inTriage=context==='PRIMARY'||context==='SECONDARY';
  const slot = (p.tx||[])[slotIndex];
  const staffFree=!inTriage||triageHasFreeStaff(context,STATE.patients,elapsed,STATE.roster);
  const canStart = canStartSequential(p, slotIndex, elapsed) && !hasAnyTxInProgress(p, elapsed) && staffFree;
  if(slot){
    const status = txSlotStatus(slot, elapsed);
    const endElapsed=slot.startedAt+slot.durationSec/60;
    const remain = status==='IN_PROGRESS' ? Math.max(0,Math.ceil((endElapsed-elapsed)*60)) : 0;
    return '<div class="kv"><span class="k">Tx'+(slotIndex+1)+': '+esc(slot.item)+' <span class="badge neutral">'+treatmentLocationLabel(slot.location)+'</span></span><span class="v">'
      + (status==='IN_PROGRESS' ? '<span class="tx-countdown" data-tx-end="'+endElapsed+'"><span class="pulse-dot"></span><span class="tx-countdown-text">เหลือ '+remain+'s</span></span>' : '✅ สำเร็จ')
      + ' <button class="btn sm danger" data-act="txCancel" data-pid="'+esc(p.id)+'" data-slot="'+slotIndex+'">ยกเลิก / คืน stock</button></span></div>';
  }
  if(!canStart){
    const reason=!staffFree?'ไม่มี Staff ว่าง':'รอลำดับก่อนหน้า';
    return '<div class="kv"><span class="k">Tx'+(slotIndex+1)+'</span><span class="v" style="color:var(--ink-faint);">'+reason+'</span></div>';
  }
  const selectable=STATE.resources.filter(function(r){return !inTriage||resourceTriageAllowed(r);});

  ).join('');

function transferTreatmentSummary(p,elapsed){

}

function viewTransfer(){

  const black=queue.filter(function(p){return p.secondary==='BLACK';});
  const hospitalOptions=['<option value="">— เลือกโรงพยาบาล —</option>'].concat(STATE.hospitals.map(function(h){return '<option value="'+esc(h.name)+'">'+esc(h.name)+'</option>';})).join('');
  const selectedHospitalOptions=hospitalOptions.replace('value="'+esc(transferUi.hospital||'###')+'"','value="'+esc(transferUi.hospital||'###')+'" selected');

  const requestLevel=transportCombined()?'PARKING_TO_COMMAND':'LOADING_TO_PARKING',loadingReqs=pendingVehicleRequests(requestLevel);

    +'<div class="transfer-workflow">'
      +'<div class="transfer-step"><div class="transfer-step-title"><span class="transfer-step-num">1</span>'+(transportCombined()?'ขอรถจาก Command / GM':'ขอรถจาก Parking')+' <span class="badge neutral">ที่ Loading '+availableVehicles.length+' คัน</span></div>'
        +vehicleRequestControls(requestLevel,transportCombined()?'โหมด Extern: Loading ขอรถจาก Command / GM โดยตรง':'ส่งคำขอไปยังผู้เล่น Parking')
        +(loadingReqs.length?'<div class="hint" style="margin-top:10px;color:var(--yellow)">กำลังรอ: '+loadingReqs.map(function(r){return r.type+' '+vehicleRequestRemaining(r)+' คัน';}).join(', ')+'</div>':'')+'<div class="transfer-vehicle-grid" style="margin-top:12px">'+(vehicleChoices||'<span class="hint">ยังไม่มีรถจอดที่ Loading</span>')+'</div>'
        +(busyVehicles.length?'<div class="transfer-returning"><div class="transfer-row-head"><b>รถกำลังมาที่ Loading</b><span class="badge wait">'+busyVehicles.length+' คัน</span></div><div class="transfer-return-grid">'+returningVehicles+'</div></div>':'')+'</div>'
      +'<div class="transfer-step"><div class="transfer-step-title"><span class="transfer-step-num">2</span>ผู้ป่วยรอขึ้นรถ <span class="badge neutral">ข้อมูลกลาง '+queue.length+' คน</span></div>'+colorRows
        +(black.length?'<div class="transfer-patient-row"><div class="transfer-row-head"><b>BLACK</b><span class="badge BLACK">'+black.filter(function(p){return !patientLockedByOther(p.id);}).length+' คน</span></div><div class="transfer-patient-grid">'+black.filter(function(p){return selectedIds.indexOf(normU(p.id))<0&&!patientLockedByOther(p.id);}).map(waitingPatientChoice).join('')+'</div></div>':'')
        +(!selectedVehicle?'<div class="hint" style="margin-top:10px;">เลือกรถก่อน จึงจะกดเลือกผู้ป่วยขึ้นรถได้</div>':'')+'</div>'
    +'</div>'
    +'<div class="transfer-staging"><div class="transfer-step-title"><span class="transfer-step-num">3</span>รถเตรียมส่ง'+(selectedVehicle?' · '+esc(vehicleDisplayName(selectedVehicle)):'')+'<span class="transfer-local-note">เฉพาะหน้าจอ '+esc(STATE.me.name||'นี้')+'</span></div>'

function commandRequestDomKey(id){return String(id||'request').replace(/[^a-zA-Z0-9_-]/g,'_');}
function commandVehicleRequestPanel(compact){

  const rows = STATE.vehicles.map(function(v){
    const status = vehicleEffectiveStatus(v, elapsed);
    const assigned = STATE.patients.filter(function(p){ return p.stage==='TRANSFER' && p.vehicle===v.name; });
    const ids = assigned.map(function(p){ return '#'+p.id; }).join(', ') || '—';
    const hospitalsList = uniq(assigned.map(function(p){ return p.hospital; }).filter(Boolean));
    const hospitalLabel = hospitalsList.length===0 ? '—' : hospitalsList.length===1 ? hospitalsList[0] : 'MIXED';
    const sitting = assigned.filter(function(p){ return effectiveCanWalk(p)==='yes'; }).length;
    const lying = assigned.filter(function(p){ return effectiveCanWalk(p)!=='yes'; }).length;
    const load = calcVehicleLoad(v.type, assigned.length, sitting, lying, hospitalsList.length);
    const canSend = status==='AVAILABLE' && hospitalsList.length===1 && load.ok && assigned.length>0;
    const returnInfo = status==='BUSY' ? ('กลับใน '+round1(v.busyUntilElapsed-elapsed)+' น. ('+esc(v.busyHospital||'')+')') : '';
    return '<tr class="row-hover">'
      + '<td><b>'+esc(v.name)+'</b><div class="hint">'+vehicleCapacityNote(v.type)+'</div></td>'
      + '<td><span class="badge neutral">'+v.type+'</span></td>'
      + '<td>'+(status==='AVAILABLE' ? '<span class="badge ok">ว่าง</span>' : '<span class="badge wait">ไม่ว่าง</span>')+'<div class="hint">'+returnInfo+'</div></td>'
      + '<td style="font-family:var(--font-mono);font-size:12px;">'+ids+'</td>'
      + '<td>'+hospitalLabel+'</td>'
      + '<td>'+(load.ok ? '<span class="badge ok">'+load.label+'</span>' : '<span class="badge bad">'+load.label+'</span>')+'</td>'
      + '<td><button class="btn sm primary" data-act="dispatchSend" data-vehicle="'+esc(v.name)+'" '+(canSend?'':'disabled')+'>ส่งรถ (SEND)</button></td>'
      + '</tr>';
  }).join('');

  const table = '<div class="card"><table><thead><tr><th>Vehicle</th><th>Type</th><th>Status</th><th>ผู้ป่วยบนรถ</th><th>ปลายทาง</th><th>โหลด</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';

  if(embedded) return table;
  return ''
  + '<div class="station-hero"><div class="titlewrap"><div class="eyebrow">TRANSPORT OPERATIONS</div><h1>'+stationHeading('transfer','Vehicle Dispatch')+'</h1></div></div>'
  + table;
}

function dashboardPatientZone(p){
  if(p.stage==='PRIMARY')return 'PRIMARY';
  if(p.stage==='SECONDARY')return 'SECONDARY';
  if(p.stage==='TRANSIT'&&p.transit){
    if(p.transit.toStage==='SECONDARY')return 'SECONDARY';
    if(p.transit.toStage==='TX')return 'TX_'+(p.transit.txZone||p.secondary||'RED');
  }
  if(p.stage==='TX')return 'TX_'+(p.txZone||p.secondary||'RED');
  if(p.stage==='TRANSFER')return 'TRANSFER';
  if(p.stage==='HOSPITAL')return 'HOSPITAL';
  if(p.stage==='CLOSED'&&p.hospital)return 'HOSPITAL';
  return null;
}
function dashboardPatientColor(p,elapsed){
  if(patientIsDead(p,elapsed)||String(p.closedReason||'').indexOf('DEAD')===0)return 'BLACK';
  return p.secondary||p.primary||'gray';
}
function dashboardPatientSub(p,zone,elapsed){
  if(p.stage==='TRANSIT')return 'กำลังเคลื่อนย้าย';
  if(zone==='HOSPITAL'){
    if(p.stage==='HOSPITAL')return p.hospital||'กำลังส่ง';
    return p.hospitalOutcome==='SURVIVED'?'รับรักษาแล้ว':(p.hospital||'สิ้นสุดการส่ง');
  }
  if(zone==='TRANSFER')return p.vehicle||'รอจัดรถ';
  const active=(p.tx||[]).find(function(slot){return slot&&txSlotStatus(slot,elapsed)==='IN_PROGRESS';});
  if(active)return active.item;
  return p.secondary||p.primary||'รอ Triage';
}

function zoneStaffActivity(name,stationIds,elapsed){
  for(let i=0;i<STATE.patients.length;i++){

      return x&&x.staffName===name&&txSlotStatus(x,elapsed)==='IN_PROGRESS'&&stationIds.indexOf(treatmentStationForSlot(p,x))>-1;
    });

  STATE.patients.forEach(function(p){
    (p.events||[]).forEach(function(e){
      if(e.by===name&&e.t<=elapsed&&(!latest||e.t>latest.t))latest={t:e.t,type:e.type,by:e.by,patient:p};
    });

  if(latest&&elapsed-latest.t<=5)return 'ล่าสุด '+fmtMin(latest.t)+' · '+timelineDescription(latest);

function gmTabControl(){
  const gc = STATE.gc;
  const elapsed=elapsedMinutes(gc);
  const hospitalMode=hospitalTreatmentEnabled(gc);
  const totalPatients = STATE.patients.length;
  const closedCount = STATE.patients.filter(function(p){return p.stage==='CLOSED';}).length;
  const deadCount = STATE.patients.filter(function(p){return patientIsDead(p,elapsed)||(p.closedReason&&p.closedReason.indexOf('DEAD')===0);}).length;
  const acceptedCount = STATE.patients.filter(function(p){return p.closedReason==='TRANSFER_ACCEPTED'||p.closedReason==='TRANSFER_ACCEPTED_HOSPITAL_TX';}).length;
  const primaryCount=STATE.patients.filter(function(p){return p.stage==='PRIMARY';}).length;
  const secondaryCount=STATE.patients.filter(function(p){return p.stage==='SECONDARY';}).length;
  const transitCount=STATE.patients.filter(function(p){return p.stage==='TRANSIT';}).length;
  const txPatients=STATE.patients.filter(function(p){return p.stage==='TX';});
  const txZoneStats={};
  TX_ZONES.forEach(function(zone){
    const list=txPatients.filter(function(p){return p.txZone===zone;});
    const dead=list.filter(function(p){return patientIsDead(p,elapsed);}).length;
    const active=list.filter(function(p){return !patientIsDead(p,elapsed)&&hasAnyTxInProgress(p,elapsed);}).length;
    const ready=list.filter(function(p){return !patientIsDead(p,elapsed)&&!hasAnyTxInProgress(p,elapsed)&&computeTxStatus(p,findCase(STATE.cases,p.id),elapsed)==='STABILIZED';}).length;
    txZoneStats[zone]={total:list.length,dead:dead,active:active,ready:ready,waiting:Math.max(0,list.length-dead-active-ready)};
  });
  const transferCount=STATE.patients.filter(function(p){return p.stage==='TRANSFER';}).length;
  const hospitalPatients=STATE.patients.filter(function(p){return p.stage==='HOSPITAL';});
  const hospitalTravel=hospitalPatients.filter(function(p){return hospitalCarePhase(p,elapsed)==='IN_TRANSIT';}).length;
  const hospitalTreating=hospitalPatients.filter(function(p){return hospitalCarePhase(p,elapsed)==='TREATING';}).length;

  return '<div class="toggle-row">'

    +'<span class="toggle-label">'+label+'</span>'
    +'</div>';
}
function flowCard(label,value,sub){
  return '<div class="flow-card"><div class="flow-label">'+label+'</div><div class="flow-value">'+value+'</div><div class="flow-sub">'+sub+'</div></div>';
}
function gmStageSort(p){
  return {PRIMARY:1,SECONDARY:2,TRANSIT:3,TX:4,TRANSFER:5,HOSPITAL:6,CLOSED:7}[p.stage]||9;
}
function gmPatientZoneHtml(p){
  if(p.stage==='PRIMARY')return '<span class="badge neutral">Primary Triage</span>';
  if(p.stage==='SECONDARY')return '<span class="badge neutral">Secondary Triage</span>';
  if(p.stage==='TX')return '<span class="badge '+(p.txZone||'neutral')+'">Treatment '+esc(p.txZone||'')+'</span>';
  if(p.stage==='TRANSFER')return '<span class="badge neutral">Transfer</span>';
  if(p.stage==='HOSPITAL')return '<span class="badge wait">โรงพยาบาล · '+esc(p.hospital||'—')+'</span>';
  if(p.stage==='TRANSIT')return '<span class="badge wait">กำลังเคลื่อนย้าย</span>';
  return '<span class="badge neutral">'+esc(p.stage||'—')+'</span>';
}
function gmPatientActivityHtml(p,elapsed){
  if(patientIsDead(p,elapsed)||(p.closedReason&&String(p.closedReason).indexOf('DEAD')===0))return '<span class="badge dead">เสียชีวิต</span>';
  if(p.stage==='HOSPITAL'&&p.hospitalCare){
    const phase=hospitalCarePhase(p,elapsed);
    if(phase==='IN_TRANSIT'){
      return '<span class="badge wait">🚑 ไป '+esc(p.hospital||'โรงพยาบาล')+' · '+liveCountdownHtml(p.hospitalCare.arrivalAt,elapsed,'ถึงโรงพยาบาล')+'</span>';
    }
  }
  const active=allTreatmentSlots(p).find(function(slot){return slot&&txSlotStatus(slot,elapsed)==='IN_PROGRESS';});
  if(active){
    return '<span class="badge wait"><span class="pulse-dot"></span> '+esc(active.item)+' · '+treatmentLocationLabel(active.location)+' · '+liveCountdownHtml(active.startedAt+active.durationSec/60,elapsed,'เสร็จ')+'</span>';
  }
  if(p.stage==='PRIMARY')return p.primary?'รอส่ง Secondary':'รอ Primary Triage';
  if(p.stage==='SECONDARY')return p.secondary?'รอส่ง Treatment':'รอ Secondary Triage';
  if(p.stage==='TX'){
    const status=computeTxStatus(p,findCase(STATE.cases,p.id),elapsed);
    return status==='STABILIZED'?'<span class="badge ok">พร้อมส่งต่อ</span>':'รอเริ่ม Treatment';
  }
  if(p.stage==='TRANSFER')return (p.vehicle||p.hospital)?'จัดรถ '+esc(p.vehicle||'—')+' → '+esc(p.hospital||'—'):'รอเลือกรถและโรงพยาบาล';
  if(p.stage==='HOSPITAL')return '<span class="badge wait">รอผลการรักษาที่โรงพยาบาล</span>';
  if(p.stage==='TRANSIT'&&p.transit){
    return 'ไป '+(p.transit.toStage==='TX'?'Treatment '+esc(p.transit.txZone||''):esc(p.transit.toStage))+' · '+liveCountdownHtml(p.transit.arriveElapsed,elapsed,'ถึงปลายทาง');
  }
  return '—';
}
function gmTreatmentHistoryHtml(p,elapsed){
  const items=allTreatmentSlots(p).map(function(slot){
    const slotStatus=txSlotStatus(slot,elapsed);
    const status=slotStatus==='PENDING'?'รอเริ่ม':slotStatus==='IN_PROGRESS'?'กำลังทำ':'เสร็จ';
    return '<span class="badge '+(status==='เสร็จ'?'ok':'wait')+'">'+esc(slot.item)+' · '+treatmentLocationLabel(slot.location)+' · '+status+'</span>';
  });
  return items.length?'<div class="tx-history">'+items.join('')+'</div>':'<span class="hint">ยังไม่มี</span>';
}

function gmTabRoster(){
  const names = Object.keys(STATE.roster);
  const assignable=STATIONS.filter(function(s){return !transportCombined()||s.id!=='PARKING';});
  const options = ['<option value="">— ไม่มอบหมาย —</option>'].concat(
    assignable.map(function(s){ return '<option value="'+s.id+'">'+esc(stationLabel(s.id))+'</option>'; })
  ).join('');

  const rows = names.map(function(n){
    const r = STATE.roster[n];
    const live = (Date.now()-(r.lastSeen||0)) < 45000;
    const displayStation=transportCombined()&&r.station==='PARKING'?'LOADING':r.station;
    const opts = options.replace('value="'+esc(displayStation||'###')+'"','value="'+esc(displayStation||'###')+'" selected');
    return '<tr class="row-hover">'
      + '<td><span class="'+(live?'dotlive':'dotstale')+'" style="display:inline-block;margin-right:6px;"></span><b>'+esc(n)+'</b></td>'
      + '<td><select data-act="gmAssign" data-name="'+esc(n)+'">'+opts+'</select></td>'
      + '<td class="hint">'+timeAgo(r.lastSeen)+'</td>'
      + '<td><button class="btn sm ghost" data-act="gmRemove" data-name="'+esc(n)+'">ลบ</button></td>'
      + '</tr>';
  }).join('');

  return '<div class="card"><h3>ผู้เข้าร่วม ('+names.length+')</h3>'
    + '<table><thead><tr><th>ชื่อ</th><th>หน้าที่</th><th>ล่าสุด</th><th></th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="4" style="text-align:center;color:var(--ink-faint);padding:20px;">ยังไม่มีใครเข้าร่วม</td></tr>')
    + '</tbody></table></div>';
}

function gmTabCases(){
  let draft=currentCaseDraft();
  if(draft.mode==='edit'&&!STATE.cases.some(function(c){return normU(c.id)===normU(draft.originalId);})){
    resetCaseDraft();draft=currentCaseDraft();saveLocalSession();
  }
  const editing=draft.mode==='edit';
  const rows=STATE.cases.slice().sort(function(a,b){return String(a.id).localeCompare(String(b.id),undefined,{numeric:true});}).map(function(c){
    const active=editing&&normU(c.id)===normU(draft.originalId);
    return '<tr class="row-hover"'+(active?' style="background:rgba(47,211,199,.08);"':'')+'>'

function timelineCategory(type){
  if(type==='GAME_START'||type==='GAME_END')return 'game';
  if(type==='COMM_MESSAGE')return 'communication';
  if(type.indexOf('TX_')>-1||type.indexOf('TREATMENT')>-1)return 'treatment';
  if(type.indexOf('TRANSFER')>-1||type.indexOf('DISPATCH')>-1||type.indexOf('HOSPITAL')>-1||type.indexOf('VEHICLE')>-1)return 'transfer';
  if(type.indexOf('PARKING')>-1||type.indexOf('LOADING')>-1||type.indexOf('COMMAND_SEND')>-1)return 'transfer';
  if(type.indexOf('DEAD')>-1||type.indexOf('SURVIVED')>-1||type.indexOf('DISCHARGE')>-1)return 'outcome';
  return 'patient';
}
function timelineDescription(entry){

  if(type.indexOf('PRIMARY_CORRECTED_AT_SECONDARY ')===0)return 'Secondary แก้ Primary '+no+' = '+type.slice(31);
  if(type==='REGISTERED')return no+' เข้าสู่ Primary Triage';
  if(type.indexOf('PRIMARY_CLASSIFY ')===0)return 'Primary Triage '+no+' = '+type.slice(17);
  if(type.indexOf('SECONDARY_CLASSIFY ')===0)return 'Secondary Triage '+no+' = '+type.slice(19);
  if(type.indexOf('PRIMARY_')===0){
    const dest=type.slice(8)==='DISCHARGE'?'Discharge':'Secondary Triage';
    return 'ส่ง '+no+' จาก Primary Triage → '+dest;
  }
  if(type.indexOf('SECONDARY_')===0){
    const dest=type.slice(10)==='DISCHARGE'?'Discharge':'Treatment '+(p.secondary||'');
    return 'ส่ง '+no+' จาก Secondary Triage → '+dest;
  }
  if(type.indexOf('TRIAGE_TX_START ')===0){
    const parts=type.split(' ');return 'เริ่ม Treatment '+parts.slice(2).join(' ')+' ให้ '+no+' ที่ '+parts[1]+' Triage';
  }

  if(type.indexOf('TX_DONE ')===0)return 'Treatment '+type.slice(8)+' ของ '+no+' เสร็จสิ้น';
  if(type.indexOf('TX_CANCEL_STAFF_MOVED ')===0)return 'Treatment ของ '+no+' ถูกยกเลิกเนื่องจากย้าย Staff ออกจาก '+type.slice(22);
  if(type.indexOf('TX_CANCEL ')===0)return 'ยกเลิก Treatment '+type.slice(10)+' ของ '+no+' และคืน Stock';
  if(type==='TO_TRANSFER')return no+' ย้ายเข้าสู่ Transfer';
  if(type.indexOf('HOSPITAL_SELECTED ')===0)return 'เลือกปลายทาง '+type.slice(18)+' ให้ '+no;
  if(type.indexOf('VEHICLE_SELECTED ')===0)return 'เลือกรถ '+type.slice(17)+' ให้ '+no;

  if(type.indexOf('HOSPITAL_TX_DONE ')===0)return 'โรงพยาบาลทำ '+type.slice(17)+' ให้ '+no+' เสร็จ';
  if(type==='TRANSFER_ACCEPTED')return no+' ได้รับการส่งต่อสำเร็จ';
  if(type==='SURVIVED_HOSPITAL_TREATMENT')return no+' รักษาที่โรงพยาบาลเสร็จและรอดชีวิต';
  if(type==='HOSPITAL_TREATMENT_LATE')return no+' ได้รับ Treatment ที่โรงพยาบาลไม่ทันเวลา';
  if(type==='DO_HARM_WRONG_VEHICLE')return no+' เกิดผลเสียระหว่างส่งจากการใช้รถผิดประเภท';
  if(type.indexOf('DISCHARGE')===0)return 'Discharge '+no;
  return no+(no?' · ':'')+type.replaceAll('_',' ');
}
function buildMasterTimeline(elapsed){
  let seq=0, entries=[];
  if(STATE.gc.startTime)entries.push({t:0,type:'GAME_START',by:STATE.gc.startedBy||'GM',seq:seq++});
  (STATE.gc.operationsLog||[]).forEach(function(e){entries.push({t:Number(e.t)||0,type:e.type,by:e.by||'',seq:seq++});});
  STATE.patients.forEach(function(p){
    (p.events||[]).forEach(function(e){
      if(e.type.indexOf('HOSPITAL_TX_START ')===0||e.type.indexOf('HOSPITAL_TX_DONE ')===0)return;
      entries.push({t:Number(e.t)||0,type:e.type,by:e.by||'',patient:p,seq:seq++});
    });
    (p.tx||[]).filter(Boolean).forEach(function(slot){
      const doneAt=slot.startedAt+slot.durationSec/60;
      if(doneAt<=elapsed)entries.push({t:doneAt,type:'TX_DONE '+slot.item,by:slot.staffName||'',patient:p,seq:seq++});
    });
    (p.hospitalTx||[]).filter(Boolean).forEach(function(slot){
      if(slot.startedAt<=elapsed)entries.push({t:slot.startedAt,type:'HOSPITAL_TX_START '+slot.item,by:'HOSPITAL',patient:p,seq:seq++});
      const doneAt=slot.startedAt+slot.durationSec/60;
      if(doneAt<=elapsed)entries.push({t:doneAt,type:'HOSPITAL_TX_DONE '+slot.item,by:'HOSPITAL',patient:p,seq:seq++});
    });
  });
  communicationRawMessages().forEach(function(msg){entries.push({t:Number(msg.t)||0,type:'COMM_MESSAGE',by:msg.by||'',communication:Object.assign({},msg,{displayZone:transportCombined()&&(msg.zone==='LOADING'||msg.zone==='PARKING')?'LOADING_PARKING':msg.zone}),seq:seq++});});
  if(STATE.gc.status==='ENDED'&&STATE.gc.endedElapsed!=null)entries.push({t:Number(STATE.gc.endedElapsed)||0,type:'GAME_END',by:STATE.gc.endedBy||'SYSTEM',seq:seq++});
  return entries.sort(function(a,b){return a.t-b.t||a.seq-b.seq;});
}
function triageUrgencyRank(color){
  return {BLACK:0,GREEN:1,YELLOW:2,RED:3}[normU(color)];
}
function triageDecisionResult(guess,answer){
  guess=normU(guess);answer=normU(answer);
  if(!guess||!answer)return 'UNKNOWN';
  if(guess===answer)return 'CORRECT';
  const g=triageUrgencyRank(guess),a=triageUrgencyRank(answer);
  if(g==null||a==null)return 'WRONG';
  return g>a?'OVER':'UNDER';
}
function latestEventByPrefix(p,prefixes){
  return (p.events||[]).filter(function(e){return prefixes.some(function(prefix){return e.type.indexOf(prefix)===0;});}).sort(function(a,b){return b.t-a.t;})[0]||null;
}
function debriefTriageRecords(field){
  const upper=field==='primary'?'PRIMARY':'SECONDARY';
  return STATE.patients.filter(function(p){return !!p[field];}).map(function(p){
    const caseObj=findCase(STATE.cases,p.id)||{};
    const event=latestEventByPrefix(p,[upper+'_CLASSIFY ',upper+'_AUTO_',upper+'_CORRECTED_'])||latestEventByPrefix(p,[upper+'_SECONDARY',upper+'_TX',upper+'_DISCHARGE']);
    return {patient:p,guess:p[field],answer:caseObj[field],result:triageDecisionResult(p[field],caseObj[field]),by:event&&event.by||'—'};
  });
}
function treatmentItemFromEvent(type){
  if(type.indexOf('TRIAGE_TX_START ')===0)return type.split(' ').slice(2).join(' ');
  if(type.indexOf('TX_START ')===0)return type.slice(9);
  return null;
}
function debriefTreatmentRecords(){
  const rows=[];
  STATE.patients.forEach(function(p){
    const required=(findCase(STATE.cases,p.id)||{}).reqTx||[];
    (p.events||[]).forEach(function(e){
      const item=treatmentItemFromEvent(e.type);
      if(item)rows.push({patient:p,item:item,appropriate:required.indexOf(item)>-1,by:e.by||'—'});
    });
  });
  return rows;
}
function dispatchedVehicleFromType(type){
  if(type.indexOf('DISPATCH ')!==0)return '';
  return type.slice(9).split(' ')[0];
}
function debriefVehicleRecords(){
  return STATE.patients.map(function(p){
    const event=latestEventByPrefix(p,['DISPATCH ']);
    if(!event)return null;
    const vehicle=dispatchedVehicleFromType(event.type)||p.vehicle||'';
    const required=requiredVehicleFor(findCase(STATE.cases,p.id));
    return {patient:p,vehicle:vehicle,required:required,appropriate:!required||vehicleType(vehicle)===required,by:event.by||'—'};
  }).filter(Boolean);
}
function actorBreakdown(records){
  const counts={};
  records.forEach(function(r){const by=r.by||'—';counts[by]=(counts[by]||0)+1;});
  const names=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||a.localeCompare(b);});
  return names.length?names.map(function(name){return esc(name)+' '+counts[name];}).join(' · '):'ไม่มี';
}
function percentOf(part,total){return total?round1(part*100/total)+'%':'—';}
function debriefEventCategory(type){
  if(type==='GAME_START'||type==='GAME_END')return 'GAME';
  if(type==='COMM_MESSAGE')return 'COMMUNICATION';
  if(type.indexOf('PRIMARY_')===0||type==='REGISTERED'||type==='REGISTERED_AT_SECONDARY')return 'PRIMARY';
  if(type.indexOf('SECONDARY_')===0)return 'SECONDARY';
  if(type.indexOf('TX_')>-1||type.indexOf('TREATMENT')>-1)return 'TREATMENT';
  return 'TRANSFER';
}
function eventCorrectness(entry){
  const p=entry.patient,type=entry.type||'';
  if(!p)return null;
  const caseObj=findCase(STATE.cases,p.id)||{};
  if(type.indexOf('PRIMARY_CLASSIFY ')===0){
    const result=triageDecisionResult(type.slice(17),caseObj.primary);
    return {ok:result==='CORRECT',text:result==='CORRECT'?'Primary Triage ถูกต้อง ✅':'Primary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
  }
  if(type==='PRIMARY_AUTO_GREEN'||type.indexOf('PRIMARY_CORRECTED_AT_SECONDARY ')===0){
    const guess=type==='PRIMARY_AUTO_GREEN'?'GREEN':type.slice(31),result=triageDecisionResult(guess,caseObj.primary);
    return {ok:result==='CORRECT',text:result==='CORRECT'?'Primary Triage ถูกต้อง ✅':'Primary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
  }
  if(type.indexOf('SECONDARY_CLASSIFY ')===0){
    const result=triageDecisionResult(type.slice(19),caseObj.secondary);
    return {ok:result==='CORRECT',text:result==='CORRECT'?'Secondary Triage ถูกต้อง ✅':'Secondary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
  }
  /* Compatibility for games recorded before separate CLASSIFY events existed.
     Judge the legacy send event only when no classification event is present,
     so new timelines do not display the same evaluation twice. */
  if(type.indexOf('PRIMARY_')===0){
    const hasClassify=(p.events||[]).some(function(e){return e.type.indexOf('PRIMARY_CLASSIFY ')===0;});
    if(!hasClassify){
      const result=triageDecisionResult(p.primary,caseObj.primary);
      return {ok:result==='CORRECT',text:result==='CORRECT'?'Primary Triage ถูกต้อง ✅':'Primary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
    }
  }
  if(type.indexOf('SECONDARY_')===0){
    const hasClassify=(p.events||[]).some(function(e){return e.type.indexOf('SECONDARY_CLASSIFY ')===0;});
    if(!hasClassify){
      const result=triageDecisionResult(p.secondary,caseObj.secondary);
      return {ok:result==='CORRECT',text:result==='CORRECT'?'Secondary Triage ถูกต้อง ✅':'Secondary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
    }
  }
  const item=treatmentItemFromEvent(type);
  if(item){
    const appropriate=(caseObj.reqTx||[]).indexOf(item)>-1;
    return {ok:appropriate,text:appropriate?'Treatment เหมาะสม ✅':'Treatment ไม่ตรง Required Tx ❌'};
  }
  if(type.indexOf('VEHICLE_SELECTED ')===0||type.indexOf('DISPATCH ')===0){
    const vehicle=type.indexOf('VEHICLE_SELECTED ')===0?type.slice(17):dispatchedVehicleFromType(type);
    const required=requiredVehicleFor(caseObj);
    const appropriate=!required||vehicleType(vehicle)===required;
    return {ok:appropriate,text:appropriate?'เลือกรถเหมาะสม ✅':'เลือกรถไม่เหมาะสม ❌ (ต้องการ '+required+')'};
  }
  return null;
}

function animateDispatchExit(){

    const vehicle=document.getElementById('dispatchVehicleVisual');

    if(!vehicle||reduced){resolve();return;}

}
