function norm(v){ return String(v==null?'':v).trim(); }
function normU(v){ return norm(v).toUpperCase(); }
function round1(n){ return Math.round(Number(n)*10)/10; }
function uniq(arr){ return arr.filter(function(x,i){ return arr.indexOf(x)===i; }); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function findCase(cases, id){
  const target = normU(id);
  for(let i=0;i<cases.length;i++){ if(String(cases[i].id).toUpperCase()===target) return cases[i]; }
  return null;
}

/* ============================================================
   3b) SCENE-DISTANCE HELPERS (IN_TRANSIT mechanic)
   Tent-to-tent walking/carrying time is computed from real map
   coordinates published in the Scene Setup module (straight-line,
   since these are short in-scene legs, not road routes). If the
   scene has no such tents (skipped, or GM didn't place that type),
   distance falls back to 0 — identical to old instant-transfer
   behaviour, so old saves / skip-scene games are unaffected.
============================================================ */
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
            Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function sceneTent(typeId){
  const data = STATE.scene && STATE.scene.data;
  if(!data || !data.tents) return null;
  return data.tents.find(function(t){ return t.typeId===typeId; }) || null;
}
/* Returns real ambulance travel time (minutes, one-way) to a hospital, or
   null if nothing is linked yet — callers fall back to hospital.distanceMin.
   Priority:
   1) A route explicitly linked to this hospital (most accurate — real
      road distance at the speed the GM set for that route).
   2) A hospital tent linked to this hospital but with no route drawn to it
      yet — straight-line distance from the scene's Loading/incident/command
      point, at a fallback ambulance speed. This is what makes "linking the
      hospital tent" alone actually do something, instead of silently no-op'ing
      like it did before. */
const AMBULANCE_FALLBACK_KMH = 40;
function routeMinutes(r){
  let mins = Number(r && r.oneWayMin);
  if(!isFinite(mins) && r && r.points && r.points.length>1){
    let km=0;
    for(let i=1;i<r.points.length;i++) km += haversineKm(r.points[i-1].lat,r.points[i-1].lng,r.points[i].lat,r.points[i].lng);
    mins = (km/(Number(r.speed)||30))*60;
  }
  return isFinite(mins) ? mins : null;
}
/* Returns separate outbound and return travel times. Routes marked "to"
   are used only for scene → hospital, routes marked "from" only for
   hospital → scene, and "both" may be used for either leg. Missing legs
   fall back to straight-line map distance rather than copying the other leg. */
/* Returns {min, points} for the fastest linked route in the given leg
   direction ('to'/'from'), or the straight-line hub↔hospital fallback if
   no route covers that leg. "both"-direction routes are reused for either
   leg; their points are reversed for the "from" (return) leg so the
   ambulance visually retraces the same line back to the scene. */
function sceneRouteTravelTimes(hospitalName){
  const data = STATE.scene && STATE.scene.data;
  if(!data) return null;
  const routes = (data.routes||[]).filter(function(r){ return r.linkedHospitalName===hospitalName; });
  const tents = data.tents || [];
  const hospTent = tents.find(function(t){ return t.typeId==='hospital' && (t.linkedHospitalName===hospitalName || t.name===hospitalName); });
  const hub = tents.find(function(t){ return t.typeId==='loading'; })
           || tents.find(function(t){ return t.typeId==='incident'; })
           || tents.find(function(t){ return t.typeId==='command'; });
  let fallbackMin=null, fallbackOutPath=null, fallbackRetPath=null;
  if(hospTent && hub){
    fallbackMin=(haversineKm(hub.lat,hub.lng,hospTent.lat,hospTent.lng)/AMBULANCE_FALLBACK_KMH)*60;
    fallbackOutPath=[{lat:hub.lat,lng:hub.lng},{lat:hospTent.lat,lng:hospTent.lng}];
    fallbackRetPath=[{lat:hospTent.lat,lng:hospTent.lng},{lat:hub.lat,lng:hub.lng}];
  }
  function bestFor(leg){
    const candidates=routes.filter(function(r){ return r.direction===leg || r.direction==='both'; })
      .map(function(r){ return {min:routeMinutes(r), route:r}; })
      .filter(function(x){ return x.min!=null; });
    if(!candidates.length){
      if(fallbackMin==null) return null;
      return {min:fallbackMin, points: leg==='to' ? fallbackOutPath : fallbackRetPath};
    }
    candidates.sort(function(a,b){ return a.min-b.min; });
    const chosen = candidates[0];
    let points = (chosen.route.points||[]).slice();
    if(chosen.route.direction==='both' && leg==='from') points = points.slice().reverse();
    return {min:chosen.min, points:points};
  }
  const out=bestFor('to');
  const ret=bestFor('from');
  if(!out && !ret) return null;
  return {
    outboundMin: out ? out.min : 0,
    returnMin: ret ? ret.min : 0,
    outboundPath: out ? out.points : (fallbackOutPath||[]),
    returnPath: ret ? ret.points : (fallbackRetPath||[])
  };
}
/* Public helper matching the shape used by dispatchSend/SceneViewer:
   {outboundMin, returnMin, outboundPath, returnPath} or null if the scene
   has nothing linked to this hospital yet. */
function sceneRouteMinutesTo(hospitalName){
  const t=sceneRouteTravelTimes(hospitalName);
  if(!t) return null;
  return {outboundMin:t.outboundMin, returnMin:t.returnMin, outboundPath:t.outboundPath, returnPath:t.returnPath};
}
const TX_ZONE_TENT_TYPE = {RED:'red', YELLOW:'yellow', GREEN:'green'};
function mapSettings(){
  return (STATE.gc && STATE.gc.mapSettings) || DEFAULT_GC.mapSettings;
}
function hospitalTreatmentEnabled(gc){
  return !!((gc||STATE.gc||DEFAULT_GC).allowHospitalTreatment);
}
/* settingKey ('distSecondary' | 'distTreatment') lets the GM turn off travel
   time for that specific leg even while the map itself is still in use.
   If the map is off entirely, every leg is instant regardless. */
function transitMinutes(fromTypeId, toTypeId, canWalk, settingKey){
  const ms = mapSettings();
  if(!ms.useMap) return 0;
  if(settingKey && !ms[settingKey]) return 0;
  const a = sceneTent(fromTypeId), b = sceneTent(toTypeId);
  if(!a || !b) return 0;
  const distKm = haversineKm(a.lat, a.lng, b.lat, b.lng);
  const speeds = (STATE.gc && STATE.gc.transitSpeeds) || DEFAULT_GC.transitSpeeds;
  const speed = canWalk==='yes' ? (speeds.walkKmh||4) : (speeds.carryKmh||3);
  if(!speed) return 0;
  return (distKm/speed)*60;
}
/* Deterministic, poll-safe promotion of patients whose transit window has passed. */
function resolveTransits(patients, elapsed){
  let changed = false;
  const next = patients.map(function(p){
    if(p.stage!=='TRANSIT' || !p.transit) return p;
    if(elapsed < p.transit.arriveElapsed) return p;
    changed = true;
    if(p.transit.toStage==='SECONDARY'){
      return Object.assign({}, p, {stage:'SECONDARY', transit:null});
    }
    if(p.transit.toStage==='TX'){
      return Object.assign({}, p, {stage:'TX', txZone:p.transit.txZone, transit:null});
    }
    return Object.assign({}, p, {transit:null});
  });
  return {changed:changed, patients:next};
}

function elapsedMinutes(gc){
  if(!gc || gc.status==='NOT_STARTED') return 0;
  if(gc.status==='ENDED') return gc.endedElapsed || 0;
  if(!gc.startTime) return 0;
  return (Date.now()-gc.startTime)/60000;
}

function txSlotStatus(slot, elapsed){
  if(!slot) return null;
  if(elapsed < slot.startedAt) return 'PENDING';
  const doneAt = slot.startedAt + slot.durationSec/60;
  return elapsed < doneAt ? 'IN_PROGRESS' : 'SUCCESS';
}
function allTreatmentSlots(p){
  return (p.tx||[]).concat(p.hospitalTx||[]).filter(Boolean);
}
function patientTxStatuses(p, elapsed){
  return allTreatmentSlots(p).map(function(s){ return txSlotStatus(s, elapsed); });
}
function hasAnyTxInProgress(p, elapsed){
  return patientTxStatuses(p, elapsed).indexOf('IN_PROGRESS') > -1;
}
function requiredTxComplete(p, caseObj, elapsed){
  const required = (caseObj && caseObj.reqTx) || [];
  if(!required.length) return true;
  const successful = {};
  allTreatmentSlots(p).forEach(function(slot){
    if(slot && txSlotStatus(slot, elapsed)==='SUCCESS') successful[slot.item]=true;
  });
  return required.every(function(r){ return successful[r]; });
}
function computeTxStatus(p, caseObj, elapsed){
  if(!caseObj) return 'UNKNOWN';
  const limit = Number(caseObj.timeLimit)||999;
  const required = caseObj.reqTx||[];
  const requiredSlots = required.map(function(item){
    return allTreatmentSlots(p).find(function(slot){ return slot && slot.item===item; });
  });
  const allAssigned = requiredSlots.every(Boolean);
  const allFinished = allAssigned && requiredSlots.every(function(slot){ return txSlotStatus(slot,elapsed)==='SUCCESS'; });
  const allFinishedInTime = allFinished && requiredSlots.every(function(slot){
    return (slot.startedAt + slot.durationSec/60) <= limit;
  });
  if(required.length===0) return 'STABILIZED';
  if(allFinishedInTime) return 'STABILIZED';
  if(elapsed>limit) return 'DEAD';
  if(hasAnyTxInProgress(p,elapsed)) return 'IN_PROGRESS';
  return 'UNASSESSED';
}
function patientIsDead(p, elapsed){
  if(p&&p.stage==='HOSPITAL'&&p.hospitalCare&&p.hospitalCare.transportHarm){
    return elapsed>=p.hospitalCare.outcomeAt;
  }
  return computeTxStatus(p, findCase(STATE.cases,p.id), elapsed)==='DEAD';
}
function deathReasonFor(p, elapsed){
  const c=findCase(STATE.cases,p.id);
  if(!c) return 'ไม่พบข้อมูลโจทย์';
  const missing=(c.reqTx||[]).filter(function(item){
    const slot=allTreatmentSlots(p).find(function(x){return x&&x.item===item;});
    return !slot || (slot.startedAt+slot.durationSec/60)>Number(c.timeLimit);
  });
  return missing.length ? 'รักษาไม่ครบ/ไม่ทันเวลา: '+missing.join(', ') : 'เกินเวลาที่กำหนด';
}
function effectiveCanWalk(p){
  const c=findCase(STATE.cases,p.id);
  return c ? c.canWalk : p.canWalk;
}
function canStartSequential(p, slotIndex, elapsed){
  if(slotIndex===0) return true;
  const prev = (p.tx||[])[slotIndex-1];
  if(!prev) return false;
  return txSlotStatus(prev, elapsed)==='SUCCESS';
}
function defaultResourceByName(item){
  return DEFAULT_RESOURCES.find(function(r){return r.item===item;});
}
function resourceTriageAllowed(resource){
  if(!resource) return false;
  if(resource.triageAllowed!=null) return !!resource.triageAllowed;
  const fallback=defaultResourceByName(resource.item);
  return !!(fallback&&fallback.triageAllowed);
}
function effectiveTreatmentDurationSec(resource,gc){
  return gc&&gc.fastTreatment?5:(Number(resource&&resource.durationSec)||5);
}
function completedPrehospitalTreatmentItems(p, elapsed){
  const done={};
  (p.tx||[]).forEach(function(slot){
    if(slot&&txSlotStatus(slot,elapsed)==='SUCCESS') done[slot.item]=true;
  });
  return done;
}
/* The destination hospital is simulated as an automatic treatment room.
   It starts immediately on arrival, completes only the required items that
   were not already finished prehospital, and uses the same configured
   treatment durations (including the 5-second fast-treatment setting).
   Hospital supplies are independent and do not consume scene stock. */
function buildHospitalTreatmentPlan(p, caseObj, arrivalAt, resources, gc, elapsed){
  const completed=completedPrehospitalTreatmentItems(p,elapsed);
  let cursor=arrivalAt;
  return ((caseObj&&caseObj.reqTx)||[]).filter(function(item){return !completed[item];}).map(function(item){
    const resource=(resources||[]).find(function(r){return r.item===item;})||defaultResourceByName(item)||{durationSec:5};
    const durationSec=effectiveTreatmentDurationSec(resource,gc);
    const slot={item:item,startedAt:cursor,durationSec:durationSec,location:'HOSPITAL'};
    cursor += durationSec/60;
    return slot;
  });
}
function hospitalPlanWillSucceed(p, caseObj, hospitalTx){
  if(!caseObj) return true;
  const limit=Number(caseObj.timeLimit)||999;
  const slots=(p.tx||[]).concat(hospitalTx||[]).filter(Boolean);
  return (caseObj.reqTx||[]).every(function(item){
    const slot=slots.find(function(x){return x.item===item;});
    return !!slot && (slot.startedAt+slot.durationSec/60)<=limit;
  });
}
function hospitalCarePhase(p,elapsed){
  const care=p.hospitalCare;
  if(!care)return null;
  if(elapsed<care.arrivalAt)return 'IN_TRANSIT';
  const slots=p.hospitalTx||[];
  if(slots.some(function(slot){return txSlotStatus(slot,elapsed)==='IN_PROGRESS';}))return 'TREATING';
  if(slots.some(function(slot){return txSlotStatus(slot,elapsed)==='PENDING';}))return 'WAITING_TREATMENT';
  return care.willSurvive?'READY_SURVIVED':'READY_DEAD';
}
/* Poll-safe promotion from the virtual hospital room to a final outcome.
   Merely pressing SEND never closes the case; travel and hospital treatment
   time must actually elapse first. */
function resolveHospitalPatients(patients,elapsed){
  let changed=false;
  const next=(patients||[]).map(function(p){
    if(p.stage!=='HOSPITAL'||!p.hospitalCare)return p;
    const care=p.hospitalCare;
    if(elapsed<care.outcomeAt)return p;
    changed=true;
    if(care.transportHarm){
      return Object.assign({},p,{
        stage:'CLOSED',transferStatus:'DEAD_WRONG_VEHICLE',closedReason:'DEAD_WRONG_VEHICLE',
        hospitalArrivalTime:null,hospitalOutcome:'DEAD',hospitalOutcomeTime:care.outcomeAt,dischargeTime:care.outcomeAt,
        events:(p.events||[]).concat([{t:care.outcomeAt,type:'DO_HARM_WRONG_VEHICLE',by:'SYSTEM'}])
      });
    }
    const hospitalEvents=[{t:care.arrivalAt,type:'ARRIVE_HOSPITAL '+(p.hospital||''),by:'HOSPITAL'}];
    (p.hospitalTx||[]).forEach(function(slot){
      hospitalEvents.push({t:slot.startedAt,type:'HOSPITAL_TX_START '+slot.item,by:'HOSPITAL'});
      hospitalEvents.push({t:slot.startedAt+slot.durationSec/60,type:'HOSPITAL_TX_DONE '+slot.item,by:'HOSPITAL'});
    });
    if(care.willSurvive){
      const treatedAtHospital=(p.hospitalTx||[]).length>0;
      return Object.assign({},p,{
        stage:'CLOSED',transferStatus:'ACCEPTED',
        closedReason:treatedAtHospital?'TRANSFER_ACCEPTED_HOSPITAL_TX':'TRANSFER_ACCEPTED',
        hospitalArrivalTime:care.arrivalAt,hospitalOutcome:'SURVIVED',hospitalOutcomeTime:care.outcomeAt,dischargeTime:care.outcomeAt,
        events:(p.events||[]).concat(hospitalEvents).concat([{t:care.outcomeAt,type:treatedAtHospital?'SURVIVED_HOSPITAL_TREATMENT':'TRANSFER_ACCEPTED',by:'HOSPITAL'}])
      });
    }
    return Object.assign({},p,{
      stage:'CLOSED',transferStatus:'DEAD_HOSPITAL_TX_LATE',closedReason:'DEAD_HOSPITAL_TX_LATE',
      hospitalArrivalTime:care.arrivalAt<=care.outcomeAt?care.arrivalAt:null,
      hospitalOutcome:'DEAD',hospitalOutcomeTime:care.outcomeAt,dischargeTime:care.outcomeAt,
      events:(p.events||[]).concat(hospitalEvents.filter(function(e){return e.t<=care.outcomeAt;})).concat([{t:care.outcomeAt,type:'HOSPITAL_TREATMENT_LATE',by:'HOSPITAL'}])
    });
  });
  return {changed:changed,patients:next};
}
function dischargeOutcomeFields(p,caseObj,elapsed,successReason){
  const incomplete=!requiredTxComplete(p,caseObj,elapsed);
  return incomplete
    ? {closedReason:'DISCHARGE_PENDING_TX_OUTCOME',dischargePendingOutcome:true}
    : {closedReason:successReason,dischargePendingOutcome:false};
}
/* A patient discharged without every required treatment never enters the
   hospital simulation. Keep the result pending until that case's deadline,
   then convert it to a terminal failed outcome. */
function resolveDischargedPatients(patients,elapsed,cases){
  let changed=false;
  const next=(patients||[]).map(function(p){
    if(p.stage!=='CLOSED'||!p.dischargePendingOutcome)return p;
    const caseObj=findCase(cases||STATE.cases,p.id);
    const limit=Number(caseObj&&caseObj.timeLimit)||999;
    if(elapsed<=limit)return p;
    changed=true;
    return Object.assign({},p,{
      closedReason:'DEAD_DISCHARGE_TX_INCOMPLETE',dischargePendingOutcome:false,
      events:(p.events||[]).concat([{t:limit,type:'DISCHARGE_TREATMENT_INCOMPLETE',by:'SYSTEM'}])
    });
  });
  return {changed:changed,patients:next};
}
function triageStationForStage(stage){
  return stage==='PRIMARY'?'PRIMARY':stage==='SECONDARY'?'SECONDARY':null;
}
function triageStaffCount(stage, roster){
  const station=triageStationForStage(stage);
  const source=roster||STATE.roster||{};
  if(!station) return 0;
  return Object.keys(source).filter(function(name){return source[name]&&source[name].station===station;}).length;
}
function countTriageTreatmentInProgress(patients, stage, elapsed){
  return (patients||[]).filter(function(p){
    if(p.stage!==stage||patientIsDead(p,elapsed)) return false;
    return (p.tx||[]).some(function(slot){
      return slot&&slot.location===stage&&txSlotStatus(slot,elapsed)==='IN_PROGRESS';
    });
  }).length;
}
function triageHasFreeStaff(stage, patients, elapsed, roster){
  return countTriageTreatmentInProgress(patients,stage,elapsed)<triageStaffCount(stage,roster);
}
function countZoneInProgress(patients, zone, elapsed){
  // A timer may still be running after the case has passed its survival limit.
  // That case must release its treatment staff immediately.
  return patients.filter(function(p){
    return p.stage==='TX' && p.txZone===zone &&
      !patientIsDead(p,elapsed) && hasAnyTxInProgress(p, elapsed);
  }).length;
}
function treatmentStaffCount(zone, roster){
  const station = 'TX_'+zone;
  const source=roster||STATE.roster||{};
  return Object.keys(source).filter(function(name){ return source[name] && source[name].station===station; }).length;
}
function treatmentStationForSlot(p,slot){
  if(!slot)return null;
  if(slot.location==='PRIMARY'||slot.location==='SECONDARY')return slot.location;
  if(slot.location==='TX'&&p.txZone)return 'TX_'+p.txZone;
  return null;
}
function compactTreatmentSlots(slots){
  const compact=(slots||[]).filter(Boolean).slice(0,TX_SLOT_COUNT);
  while(compact.length<TX_SLOT_COUNT)compact.push(null);
  return compact;
}
/* When a staff member leaves a treatment station, cancel work explicitly
   tagged to that staff. For treatment records created by older versions that
   have no staffName, cancel the newest active items only when the remaining
   station capacity would otherwise be exceeded. Returns refunded item names. */
function cancelActiveTreatmentsAfterStaffDeparture(root,staffName,oldStation,elapsed){
  if(!oldStation||['PRIMARY','SECONDARY','TX_RED','TX_YELLOW','TX_GREEN'].indexOf(oldStation)<0)return [];
  const patients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
  const roster=root[KEYS.roster]||{};
  const active=[];
  patients.forEach(function(p,pi){
    (p.tx||[]).forEach(function(slot,si){
      if(slot&&txSlotStatus(slot,elapsed)==='IN_PROGRESS'&&treatmentStationForSlot(p,slot)===oldStation){
        active.push({pi:pi,si:si,slot:slot,tagged:slot.staffName===staffName});
      }
    });
  });
  const cancelKeys={};
  active.filter(function(x){return x.tagged;}).forEach(function(x){cancelKeys[x.pi+':'+x.si]=true;});
  const remainingCapacity=Object.keys(roster).filter(function(name){return roster[name]&&roster[name].station===oldStation;}).length;
  const survivors=active.filter(function(x){return !cancelKeys[x.pi+':'+x.si];});
  const over=Math.max(0,survivors.length-remainingCapacity);
  survivors.filter(function(x){return !x.slot.staffName;}).sort(function(a,b){return b.slot.startedAt-a.slot.startedAt;}).slice(0,over).forEach(function(x){cancelKeys[x.pi+':'+x.si]=true;});
  const refundCounts={};
  const nextPatients=patients.map(function(p,pi){
    const tx=(p.tx||[]).slice();
    let changed=false;
    tx.forEach(function(slot,si){
      if(slot&&cancelKeys[pi+':'+si]){
        refundCounts[slot.item]=(refundCounts[slot.item]||0)+1;
        tx[si]=null; changed=true;
      }
    });
    return changed?Object.assign({},p,{tx:compactTreatmentSlots(tx),events:(p.events||[]).concat([{t:elapsed,type:'TX_CANCEL_STAFF_MOVED '+oldStation,by:staffName}])}):p;
  });
  const resources=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
  root[KEYS.patients]=nextPatients;
  root[KEYS.resources]=resources.map(function(r){return refundCounts[r.item]?Object.assign({},r,{stock:Number(r.stock||0)+refundCounts[r.item]}):r;});
  return Object.keys(refundCounts).reduce(function(items,item){return items.concat(Array(refundCounts[item]).fill(item));},[]);
}
function availableVehicles(elapsed){
  return STATE.vehicles.filter(function(v){ return vehicleEffectiveStatus(v, elapsed)==='AVAILABLE'; });
}
function vehicleType(name){ return normU(String(name).split('_')[0]); }
function requiredVehicleFor(caseObj){
  if(!caseObj) return null;
  if(caseObj.vehicle) return normU(caseObj.vehicle);
  // Safety net for GM-created cases: a correct RED case requires ALS even
  // when Required Vehicle was accidentally left blank.
  if(normU(caseObj.primary)==='RED'||normU(caseObj.secondary)==='RED') return 'ALS';
  return null;
}
function vehicleEffectiveStatus(v, elapsed){
  return (v.busyUntilElapsed && elapsed < v.busyUntilElapsed) ? 'BUSY' : 'AVAILABLE';
}
function calcVehicleLoad(type, total, sitting, lying, hospitalCount){
  if(hospitalCount>1) return {ok:false,label:'ปลายทางไม่ตรงกัน (Mixed hospital)'};
  if(!total) return {ok:true,label:'ว่าง'};
  type = normU(type);
  if(type==='BUS'){
    if(lying>0) return {ok:false,label:'BUS รับผู้ป่วยนอนไม่ได้'};
    if(sitting>10) return {ok:false,label:'เกิน 10 ที่นั่ง'};
    return {ok:true,label:'พร้อมส่ง'};
  }
  if(type==='ALS'||type==='BLS'){
    if(lying>1) return {ok:false,label:'นอนได้ไม่เกิน 1 คน'};
    if(lying===1 && total>1) return {ok:false,label:'มีผู้ป่วยนอน รถเต็มคันแล้ว'};
    if(lying===0 && sitting>2) return {ok:false,label:'นั่งได้ไม่เกิน 2 คน'};
    return {ok:true,label:'พร้อมส่ง'};
  }
  return {ok:true,label:'พร้อมส่ง'};
}
function vehicleCapacityNote(type){
  type = normU(type);
  if(type==='BUS') return 'นั่งได้สูงสุด 10 / รับผู้ป่วยนอนไม่ได้';
  if(type==='ALS'||type==='BLS') return 'นอนได้ 1 คน หรือ นั่งได้ 2 คน';
  return '';
}
function maxOrder(patients, field){
  return patients.reduce(function(m,p){ return Math.max(m, p[field]||0); }, 0);
}
function fmtMin(n){
  if(n==null) return '—';
  return round1(n)+' น.';
}
function timeAgo(ts){
  if(!ts) return '—';
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s ago';
  return Math.floor(s/60)+'m ago';
}

const SESSION_KEY='mci_sim_player_v6';
function saveLocalSession(){
  try{
    sessionStorage.setItem(SESSION_KEY,JSON.stringify({
      name:STATE.me.name,
      gmAuthorized:!!STATE.me.gmAuthorized,
      clientId:STATE.me.clientId,
      gmTab:STATE.gmTab,
      ui:STATE.ui
    }));
  }catch(e){}
}
function restoreLocalSession(){
  try{
    const raw=sessionStorage.getItem(SESSION_KEY);
    if(!raw)return false;
    const saved=JSON.parse(raw);
    if(!saved||!saved.name)return false;
    STATE.me.name=String(saved.name);
    STATE.me.gmAuthorized=!!saved.gmAuthorized;
    STATE.me.clientId=saved.clientId?String(saved.clientId):makeClientId();
    if(saved.gmTab)STATE.gmTab=saved.gmTab;
    if(saved.ui&&saved.ui.focused)STATE.ui.focused=Object.assign({},STATE.ui.focused,saved.ui.focused);
    if(saved.ui&&saved.ui.transfer){
      STATE.ui.transfer=Object.assign({},STATE.ui.transfer,saved.ui.transfer);
      if(!Array.isArray(STATE.ui.transfer.patientIds))STATE.ui.transfer.patientIds=[];
    }
    return true;
  }catch(e){return false;}
}
function clearLocalSession(){
  try{sessionStorage.removeItem(SESSION_KEY);}catch(e){}
}
function setFocusedPatient(key,id){
  if(!STATE.ui.focused[key])STATE.ui.focused[key]=null;
  STATE.ui.focused[key]=id==null?null:normU(id);
  saveLocalSession();
}

function makeClientId(){
  return 'c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);
}

const PATIENT_LOCK_TTL_MS=45000;
function patientLockIsActive(lock,now){
  return !!(lock&&lock.clientId&&Number(lock.lastSeen)>0&&((now||Date.now())-Number(lock.lastSeen)<PATIENT_LOCK_TTL_MS));
}
function patientLockOwnedByMe(lock){
  return !!(lock&&STATE.me.clientId&&lock.clientId===STATE.me.clientId&&lock.ownerName===STATE.me.name);
}
function patientLockFor(id){
  const lock=(STATE.locks||{})[normU(id)];
  return patientLockIsActive(lock)?lock:null;
}
function patientLockedByOther(id){
  const lock=patientLockFor(id);
  return lock&&!patientLockOwnedByMe(lock)?lock:null;
}
function canEditLockedPatient(id){
  const lock=patientLockFor(id);
  if(lock&&patientLockOwnedByMe(lock))return true;
  toast(lock?'No. '+normU(id)+' กำลังทำโดย '+lock.ownerName:'สิทธิ์ทำ No. '+normU(id)+' หมดอายุแล้ว กรุณาค้นหา No. ใหม่','err');
  return false;
}
function compactActiveLocks(){
  const compact={};
  const now=Date.now();
  Object.keys(STATE.locks||{}).sort().forEach(function(id){
    const lock=STATE.locks[id];
    if(patientLockIsActive(lock,now))compact[id]={ownerName:lock.ownerName||'',clientId:lock.clientId||'',station:lock.station||''};
  });
  return compact;
}
async function claimPatientLock(id,station){
  id=normU(id);
  if(!id||!STATE.me.name)return false;
  if(!STATE.me.clientId){STATE.me.clientId=makeClientId();saveLocalSession();}
  const now=Date.now(),ownerName=STATE.me.name,clientId=STATE.me.clientId;
  const result=await kvLocksTransaction(function(locks){
    const next={};
    Object.keys(locks||{}).forEach(function(key){
      if(patientLockIsActive(locks[key],now))next[key]=locks[key];
    });
    const current=next[id];
    if(current&&!(current.clientId===clientId&&current.ownerName===ownerName))return null;
    next[id]={patientId:id,ownerName:ownerName,clientId:clientId,station:station||STATE.me.station||'',acquiredAt:current&&current.acquiredAt||now,lastSeen:now};
    return next;
  });
  if(!result.error)STATE.locks=result.locks||{};
  const saved=(result.locks||{})[id];
  const mine=!!(result.committed&&saved&&saved.clientId===clientId&&saved.ownerName===ownerName);
  if(!mine){
    const live=(result.locks||{})[id]||patientLockFor(id);
    toast(live&&live.ownerName?'No. '+id+' กำลังทำโดย '+live.ownerName+' กรุณาเลือกผู้ป่วยคนอื่น':'ไม่สามารถล็อก No. '+id+' ได้ กรุณาลองใหม่','err');
  }
  return mine;
}
async function releasePatientLocks(ids){
  const wanted=uniq((ids||[]).map(normU).filter(Boolean));
  if(!wanted.length||!STATE.me.clientId)return true;
  const ownerName=STATE.me.name,clientId=STATE.me.clientId;
  const result=await kvLocksTransaction(function(locks){
    const next=Object.assign({},locks||{});
    wanted.forEach(function(id){
      const lock=next[id];
      if(lock&&lock.clientId===clientId&&lock.ownerName===ownerName)delete next[id];
    });
    return next;
  });
  if(result.committed)STATE.locks=result.locks;
  return !!result.committed;
}
async function releaseAllMyPatientLocks(){
  if(!STATE.me.clientId)return true;
  const ownerName=STATE.me.name,clientId=STATE.me.clientId;
  const result=await kvLocksTransaction(function(locks){
    const next={};
    Object.keys(locks||{}).forEach(function(id){
      const lock=locks[id];
      if(!(lock&&lock.clientId===clientId&&lock.ownerName===ownerName))next[id]=lock;
    });
    return next;
  });
  if(result.committed)STATE.locks=result.locks;
  return !!result.committed;
}
async function refreshMyPatientLocks(){
  if(!STATE.me.name||!STATE.me.clientId)return;
  const now=Date.now(),ownerName=STATE.me.name,clientId=STATE.me.clientId;
  const result=await kvLocksTransaction(function(locks){
    const next={};
    Object.keys(locks||{}).forEach(function(id){
      const lock=locks[id];
      if(!patientLockIsActive(lock,now))return;
      next[id]=(lock.clientId===clientId&&lock.ownerName===ownerName)?Object.assign({},lock,{lastSeen:now}):lock;
    });
    return next;
  });
  if(result.committed)STATE.locks=result.locks;
}

async function refreshAll(){
  const results = await Promise.all([
    kvGet(KEYS.gc, DEFAULT_GC),
    kvGet(KEYS.cases, DEFAULT_CASES),
    kvGet(KEYS.resources, DEFAULT_RESOURCES),
    kvGet(KEYS.hospitals, DEFAULT_HOSPITALS),

    kvGet(KEYS.patients, []),
    kvGet(KEYS.roster, {}),
    kvGet(KEYS.scene, DEFAULT_SCENE),
    kvGet(KEYS.locks, {})
  ]);
  let gc=results[0], cases=results[1], resources=results[2], hospitals=results[3],
      vehicles=results[4], patients=results[5], roster=results[6], scene=results[7], locks=results[8];

  STATE.vehicles=vehicles; STATE.patients=patients; STATE.roster=roster; STATE.scene=scene; STATE.locks=locks||{};

}

function applyRosterIdentity(){
  if(!STATE.me.name)return;
  const entry=STATE.roster[STATE.me.name];
  let assignedStation=entry?entry.station:null;
  // Backward compatibility for a roster saved by v5. Vehicle Dispatch is now
  // part of Transfer, so an old DISPATCH assignment opens the Transfer screen.
  if(assignedStation==='DISPATCH')assignedStation='TRANSFER';
  STATE.me.station=assignedStation==='GM'&&!STATE.me.gmAuthorized?null:assignedStation;
}

const REALTIME_STATE_KEYS={
  gc:'gc',cases:'cases',resources:'resources',hospitals:'hospitals',
  vehicles:'vehicles',patients:'patients',roster:'roster',scene:'scene',locks:'locks'
};
const REALTIME_DEFAULTS={
  gc:DEFAULT_GC,cases:DEFAULT_CASES,resources:DEFAULT_RESOURCES,hospitals:DEFAULT_HOSPITALS,
  vehicles:DEFAULT_VEHICLES,patients:[],roster:{},scene:DEFAULT_SCENE,locks:{}
};
let realtimeBindings=[];
let realtimeInitial={};
let backgroundRenderTimer=null;
let backgroundRenderPending=false;
let derivedBusy=false;

function decodeRealtimeValue(raw,fallback){
  if(raw==null)return JSON.parse(JSON.stringify(fallback));
  try{return typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return JSON.parse(JSON.stringify(fallback));}
}
function scheduleBackgroundRender(){
  if(backgroundRenderTimer)return;
  backgroundRenderTimer=setTimeout(function(){
    backgroundRenderTimer=null;
    backgroundRender();
  },80);
}
function startRealtimeListeners(session){
  if(!fbReady||realtimeBindings.length)return;
  realtimeInitial={};
  Object.keys(REALTIME_STATE_KEYS).forEach(function(dbKey){
    const stateKey=REALTIME_STATE_KEYS[dbKey];
    const ref=fbDb.ref(DB_ROOT+'/'+dbKey);
    const handler=function(snap){
      if(session!==identitySession)return;
      STATE[stateKey]=decodeRealtimeValue(snap.val(),REALTIME_DEFAULTS[dbKey]);
      realtimeInitial[dbKey]=true;
      if(dbKey==='roster')applyRosterIdentity();
      if(Object.keys(realtimeInitial).length===Object.keys(REALTIME_STATE_KEYS).length)STATE.ready=true;
      STATE.fbConnected=true;
      scheduleBackgroundRender();
    };
    const errorHandler=function(err){
      STATE.fbConnected=false;STATE.fbErrorMsg=(err&&err.message)||String(err||'Realtime sync error');
      scheduleBackgroundRender();
    };
    ref.on('value',handler,errorHandler);
    realtimeBindings.push({ref:ref,handler:handler});
  });
}
function stopRealtimeListeners(){
  realtimeBindings.forEach(function(binding){binding.ref.off('value',binding.handler);});
  realtimeBindings=[];realtimeInitial={};
  if(backgroundRenderTimer){clearTimeout(backgroundRenderTimer);backgroundRenderTimer=null;}
}
async function runDerivedStateMaintenance(){
  if(derivedBusy||STATE.me.station!=='GM'||STATE.gc.status==='NOT_STARTED')return;
  derivedBusy=true;
  try{
    const elapsed=elapsedMinutes(STATE.gc);
    if(STATE.gc.status==='RUNNING'&&STATE.gc.maxGameMin>0&&elapsed>=STATE.gc.maxGameMin){
      await kvSet(KEYS.gc,Object.assign({},STATE.gc,{status:'ENDED',endedElapsed:STATE.gc.maxGameMin}));
    }
    const hasTimedPatient=STATE.patients.some(function(p){return p.stage==='TRANSIT'||p.stage==='HOSPITAL'||p.dischargePendingOutcome;});
    if(!hasTimedPatient)return;
    const result=await kvPatientsTransaction(function(patients){
      let next=resolveTransits(patients,elapsed);
      let changed=next.changed;
      let list=next.patients;
      next=resolveHospitalPatients(list,elapsed);changed=changed||next.changed;list=next.patients;
      next=resolveDischargedPatients(list,elapsed,STATE.cases);changed=changed||next.changed;list=next.patients;
      return changed?list:null;
    });
    if(result.committed)STATE.patients=result.patients;
  }finally{derivedBusy=false;}
}

/* Background refreshes (polling / clock tick) must never yank focus away
   from a <select> or text input the user is actively using — that's what
   caused the "flickers, can't pick treatment/vehicle" bug. Foreground
   renders triggered directly by the user's own click/change always run
   in full via render()/render(true) as before. */
function backgroundRender(){
  const ae = document.activeElement;
  const interacting = ae && (ae.tagName==='SELECT' || ae.tagName==='TEXTAREA' ||
    (ae.tagName==='INPUT' && (ae.type==='text' || ae.type==='number')));
  if(interacting){
    backgroundRenderPending=true;
    updateLiveTimersOnly();
    return;
  }
  backgroundRenderPending=false;
  render(false);
}
function updateLiveTimersOnly(){
  const el = document.getElementById('liveTimer');
  if(el) el.textContent = STATE.gc.status==='NOT_STARTED' ? '--:--' : fmtClock(elapsedMinutes(STATE.gc));
}
function updateTreatmentCountdownsOnly(){
  const elapsed=elapsedMinutes(STATE.gc);
  let completed=false;
  document.querySelectorAll('.tx-countdown[data-tx-end]').forEach(function(el){
    const remain=Math.max(0,Math.ceil((Number(el.dataset.txEnd)-elapsed)*60));
    const textEl=el.querySelector('.tx-countdown-text');
    const nextText=remain>0?'เหลือ '+remain+'s':'✅ สำเร็จ';
    if(textEl&&textEl.textContent!==nextText)textEl.textContent=nextText;
    if(remain<=0&&!el.dataset.finished){el.dataset.finished='1';completed=true;}
  });
  if(completed){STATE._snapshot=null;scheduleBackgroundRender();}
}
let lastLockVisualSnapshot='{}';
function updateExpiredLockVisualsOnly(){
  const next=JSON.stringify(compactActiveLocks());
  if(next!==lastLockVisualSnapshot){lastLockVisualSnapshot=next;scheduleBackgroundRender();}
}

let pollTimer=null;
let rosterHeartbeatTimer=null;
let clockTimer=null;
let derivedTimer=null;
let identitySession=0;

function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(rosterHeartbeatTimer){ clearInterval(rosterHeartbeatTimer); rosterHeartbeatTimer=null; }
  if(clockTimer){ clearInterval(clockTimer); clockTimer=null; }
  if(derivedTimer){ clearInterval(derivedTimer); derivedTimer=null; }
  stopRealtimeListeners();
}

function startPolling(){
  if(pollTimer||realtimeBindings.length) return;
  const session = identitySession;
  refreshAll().then(function(){
    if(session===identitySession)startRealtimeListeners(session);
  });
  // Realtime listeners reconnect themselves. This slow fallback only runs
  // after an observed connection error; it is not the normal sync path.
  pollTimer = setInterval(function(){if(STATE.fbConnected===false)refreshAll();},20000);
  rosterHeartbeatTimer = setInterval(function(){
    const activeName = STATE.me.name;
    if(!activeName || session!==identitySession) return;
    kvRosterUpdate(function(roster){
      if(session!==identitySession || STATE.me.name!==activeName) return roster;
      const cur = roster[activeName] || {station:null};
      const next = Object.assign({}, roster);
      next[activeName] = Object.assign({}, cur, {lastSeen:Date.now()});
      return next;
    });
    refreshMyPatientLocks();
  }, 15000);
  clockTimer = setInterval(function(){
    if(STATE.gc.status==='RUNNING'){
      updateLiveTimersOnly();
      updateTreatmentCountdownsOnly();
      updateExpiredLockVisualsOnly();
      updateSceneViewerPanel();
    }
  }, 1000);
  derivedTimer=setInterval(runDerivedStateMaintenance,2000);
}

async function joinAsPlayer(name, asGM, asCommander, gmPassword){
  name = name.trim();
  if(!name) { toast('กรุณากรอกชื่อ','err'); return; }
  if(asGM && gmPassword!==GM_PASSWORD){
    toast('รหัส GM ไม่ถูกต้อง','err');
    const passwordInput = document.getElementById('joinGMPassword');
    if(passwordInput){ passwordInput.value=''; passwordInput.focus(); }
    return;
  }
  await ensureSeeded();
  const currentRoster = await kvGet(KEYS.roster, {});
  if(currentRoster[name] && currentRoster[name].station==='GM' && !asGM){
    toast('ชื่อนี้เป็น GM กรุณาเลือก “ฉันเป็นผู้ควบคุมเกม” และกรอกรหัส','err');
    return;
  }
  STATE.me.name = name;
  STATE.me.gmAuthorized = !!asGM;
  if(!STATE.me.clientId)STATE.me.clientId=makeClientId();
  identitySession += 1;
  await kvRosterUpdate(function(roster){
    const cur = roster[name];
    const next = Object.assign({}, roster);
    next[name] = {station: asGM ? 'GM' : (asCommander ? 'COMMANDER' : (cur ? cur.station : null)), lastSeen:Date.now()};
    return next;
  });
  saveLocalSession();
  startPolling();
}
async function gmAssignStation(name, stationId){
  const elapsed=elapsedMinutes(STATE.gc);
  let refunded=[];
  const result=await kvRootTransaction(function(root){
    const roster=root[KEYS.roster]||{};
    const cur=roster[name]||{lastSeen:Date.now()};
    const oldStation=cur.station||null;
    const next=Object.assign({},roster);
    next[name]=Object.assign({},cur,{station:stationId||null});
    root[KEYS.roster]=next;
    if(oldStation!==(stationId||null)){
      refunded=cancelActiveTreatmentsAfterStaffDeparture(root,name,oldStation,elapsed);
      const locks=root[KEYS.locks]||{},nextLocks={};
      Object.keys(locks).forEach(function(id){if(!locks[id]||locks[id].ownerName!==name)nextLocks[id]=locks[id];});
      root[KEYS.locks]=nextLocks;
    }
    return root;
  });
  if(!result.committed){toast('อัปเดตหน้าที่ไม่สำเร็จ','err');return;}
  await refreshAll();
  if(STATE.me.name===name) STATE.me.station = stationId||null;
  if(STATE.me.name===name)saveLocalSession();
  toast('อัปเดตหน้าที่ของ '+name+(refunded.length?' · ยกเลิก Treatment และคืน stock '+refunded.length+' รายการ':''), 'ok');
  render();
}
async function gmRemovePlayer(name){
  const elapsed=elapsedMinutes(STATE.gc);
  await kvRootTransaction(function(root){
    const roster=root[KEYS.roster]||{};
    const oldStation=roster[name]&&roster[name].station;
    const next=Object.assign({},roster);
    delete next[name];
    root[KEYS.roster]=next;
    const locks=root[KEYS.locks]||{},nextLocks={};
    Object.keys(locks).forEach(function(id){if(!locks[id]||locks[id].ownerName!==name)nextLocks[id]=locks[id];});
    root[KEYS.locks]=nextLocks;
    cancelActiveTreatmentsAfterStaffDeparture(root,name,oldStation,elapsed);
    return root;
  });
  await refreshAll();
  render();
}

async function leaveCurrentPlayer(){
  const leavingName = STATE.me.name;
  const elapsed=elapsedMinutes(STATE.gc);
  await releaseAllMyPatientLocks();
  identitySession += 1;
  stopPolling();
  STATE.me.name=null;
  STATE.me.station=null;
  STATE.me.gmAuthorized=false;
  STATE.me.clientId=null;
  STATE.ui={focused:{PRIMARY:null,SECONDARY:null,TX_RED:null,TX_YELLOW:null,TX_GREEN:null},transfer:{vehicle:null,patientIds:[],hospital:null}};
  clearLocalSession();

  if(leavingName){
    await kvRootTransaction(function(root){
      const roster=root[KEYS.roster]||{};
      const oldStation=roster[leavingName]&&roster[leavingName].station;
      const next=Object.assign({},roster);
      delete next[leavingName];
      root[KEYS.roster]=next;
      cancelActiveTreatmentsAfterStaffDeparture(root,leavingName,oldStation,elapsed);
      return root;
    });
    STATE.roster=await kvGet(KEYS.roster,{});
    STATE.patients=await kvGet(KEYS.patients,[]);
    STATE.resources=await kvGet(KEYS.resources,DEFAULT_RESOURCES);
  }
  render(true);
}

async function gmSetMapSetting(key, value){

async function gmSetFastTreatment(enabled){
  enabled=!!enabled;
  const elapsed=elapsedMinutes(STATE.gc);
  const result=await kvRootTransaction(function(root){
    root[KEYS.gc]=Object.assign({},root[KEYS.gc]||STATE.gc,{fastTreatment:enabled});
    if(enabled){
      root[KEYS.patients]=(root[KEYS.patients]||[]).map(function(p){
        const tx=(p.tx||[]).map(function(slot){
          if(!slot||txSlotStatus(slot,elapsed)!=='IN_PROGRESS') return slot;
          return Object.assign({},slot,{durationSec:Math.min(Number(slot.durationSec)||5,5)});
        });
        return Object.assign({},p,{tx:tx});
      });
    }
    return root;
  });
  if(!result.committed){toast('เปลี่ยนโหมดเวลารักษาไม่สำเร็จ','err');return;}
  await refreshAll();
  toast(enabled?'ปิดเวลารักษาแล้ว — ทุก Treatment ใช้ 5 วินาที':'เปิดเวลารักษาตามทรัพยากรแล้ว','ok');

async function gmAddVehicle(name, type){

async function reserveResourceItem(item){
  if(!fbReady) return {ok:false, reason:'ไม่สามารถเชื่อมต่อฐานข้อมูลได้'};
  try{
    const ref=fbDb.ref(DB_ROOT+'/'+KEYS.resources);
    // Same caching issue as kvRootTransaction (see comment there): Firebase's
    // transaction() runs its update function against whatever is *locally
    // cached* for this exact path, which can be null if this client has never
    // read it directly. When that happens the function below aborts on a
    // false "โหลดข้อมูลทรัพยากรไม่สำเร็จ" without ever contacting the server.
    // Force a fresh read first so the transaction always starts from real data.
    await ref.once('value');
    let durationSec=5;
    let fail='';
    const result=await ref.transaction(function(raw){
      let list;
      try{ list=typeof raw==='string'?JSON.parse(raw):raw; }
      catch(e){ list=null; }
      // A previously seeded game can still have a missing `resources` child
      // (for example after importing/resetting an older save).  The UI uses
      // DEFAULT_RESOURCES as its fallback, so initialise the Firebase child
      // from the same defaults instead of aborting with a misleading load
      // error. If the server already has data, Firebase will rerun this
      // transaction with that current value before committing.
      if(list==null){
        list=DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
      }
      if(!Array.isArray(list)){ fail='รูปแบบข้อมูลทรัพยากรไม่ถูกต้อง กรุณาให้ GM Reset game'; return; }
      const ri=list.findIndex(function(r){return r.item===item;});
      if(ri<0){ fail='ไม่พบทรัพยากร '+item; return; }
      if(Number(list[ri].stock)<=0){ fail=item+' หมด กรุณาขอ GM เพิ่ม'; return; }
      durationSec=Number(list[ri].durationSec)||5;
      const next=list.slice();
      next[ri]=Object.assign({},list[ri],{stock:Number(list[ri].stock)-1});
      return JSON.stringify(next);
    });
    if(!result.committed) return {ok:false,reason:fail||'ไม่สามารถจองทรัพยากรได้'};
    const raw=result.snapshot.val();
    const list=typeof raw==='string'?JSON.parse(raw):raw;
    const resource=(list||[]).find(function(r){return r.item===item;});
    return {ok:true,durationSec:durationSec,stock:resource?Number(resource.stock):null};
  }catch(e){
    console.error('reserveResourceItem failed',e);
    return {ok:false,reason:(e&&e.message)||'เกิดข้อผิดพลาดในการจองทรัพยากร'};
  }
}

async function refundResourceItem(item){
  if(!fbReady) return;
  try{
    const ref=fbDb.ref(DB_ROOT+'/'+KEYS.resources);
    await ref.once('value'); // see note in reserveResourceItem
    await ref.transaction(function(raw){
      let list;
      try{ list=typeof raw==='string'?JSON.parse(raw):raw; }
      catch(e){ return; }
      if(!Array.isArray(list)) return;
      const ri=list.findIndex(function(r){return r.item===item;});
      if(ri<0) return;
      const next=list.slice();
      next[ri]=Object.assign({},list[ri],{stock:Number(list[ri].stock||0)+1});
      return JSON.stringify(next);
    });
  }catch(e){ console.error('refundResourceItem failed',e); }
}

async function txStartItem(id, slotIndex, item, location){
  if(!item) return;
  id=normU(id);
  if(!canEditLockedPatient(id))return;
  slotIndex=Number(slotIndex);
  location=location||'TX';
  const elapsed=elapsedMinutes(STATE.gc);

  // ตรวจสอบผู้ป่วยและกำลังคนก่อน แล้วจอง stock ด้วย Firebase transaction
  // เพื่อป้องกันผู้เล่นหลายคนใช้ทรัพยากรชิ้นสุดท้ายพร้อมกัน
  const patients=await kvGet(KEYS.patients,[]);
  const idx=patients.findIndex(function(p){return normU(p.id)===id;});
  if(idx<0){toast('ไม่พบผู้ป่วย #'+id,'err');return;}

  const p=patients[idx];
  const caseObj=findCase(STATE.cases,id);
  const inTriage=location==='PRIMARY'||location==='SECONDARY';
  if(inTriage&&p.stage!==location){toast('ผู้ป่วยไม่ได้อยู่ใน '+location+' Triage','err');return;}
  if(!inTriage&&p.stage!=='TX'){toast('ผู้ป่วยไม่ได้อยู่ใน Treatment zone','err');return;}
  if(computeTxStatus(p,caseObj,elapsed)==='DEAD'){
    toast('ผู้ป่วยเสียชีวิตแล้วและต้องค้างใน Treatment','err');return;
  }
  if(!canStartSequential(p,slotIndex,elapsed)){
    toast('ต้องทำ Treatment ลำดับก่อนหน้าให้สำเร็จก่อน','err');return;
  }
  if(hasAnyTxInProgress(p,elapsed)){
    toast('มี Treatment กำลังดำเนินการอยู่','err');return;
  }

  const selectedResource=STATE.resources.find(function(r){return r.item===item;});
  if(inTriage&&!resourceTriageAllowed(selectedResource)){
    toast(item+' ไม่ได้รับอนุญาตให้ทำใน Triage','err');return;
  }
  const capacity=inTriage?triageStaffCount(location):treatmentStaffCount(p.txZone);
  const inProgress=inTriage?countTriageTreatmentInProgress(patients,location,elapsed):countZoneInProgress(patients,p.txZone,elapsed);
  if(capacity<=0||inProgress>=capacity){
    toast('ไม่มี Staff ว่างในโซน '+(inTriage?location+' Triage':p.txZone)+' ('+inProgress+'/'+capacity+')','err');return;
  }

  // Commit the patient timer and stock deduction together. This prevents a
  // partial save and also prevents two players taking the final item.
  let fail='';
  let committedPatients=null;
  let committedResources=null;
  const result=await kvRootTransaction(function(root){
    const livePatients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
    const liveResources=Array.isArray(root[KEYS.resources])
      ? root[KEYS.resources]
      : DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
    const liveRoster=root[KEYS.roster]||STATE.roster||{};
    const liveGc=root[KEYS.gc]||STATE.gc||DEFAULT_GC;
    const pi=livePatients.findIndex(function(x){return normU(x.id)===id;});
    if(pi<0){fail='ไม่พบผู้ป่วย #'+id;return null;}
    const liveP=livePatients[pi];
    if(inTriage&&liveP.stage!==location){fail='ผู้ป่วยไม่ได้อยู่ใน '+location+' Triage';return null;}
    if(!inTriage&&liveP.stage!=='TX'){fail='ผู้ป่วยไม่ได้อยู่ใน Treatment zone';return null;}
    if(computeTxStatus(liveP,caseObj,elapsed)==='DEAD'){fail='ผู้ป่วยเสียชีวิตแล้วและต้องค้างใน Treatment';return null;}
    if(!canStartSequential(liveP,slotIndex,elapsed)){fail='ต้องทำ Treatment ลำดับก่อนหน้าให้สำเร็จก่อน';return null;}
    if(hasAnyTxInProgress(liveP,elapsed)){fail='มี Treatment กำลังดำเนินการอยู่';return null;}
    const ri=liveResources.findIndex(function(r){return r.item===item;});
    if(ri<0){fail='ไม่พบทรัพยากร '+item;return null;}
    if(inTriage&&!resourceTriageAllowed(liveResources[ri])){fail=item+' ไม่ได้รับอนุญาตให้ทำใน Triage';return null;}
    if(Number(liveResources[ri].stock)<=0){fail=item+' หมด กรุณาขอ GM เพิ่ม';return null;}

    const liveCapacity=inTriage?triageStaffCount(location,liveRoster):treatmentStaffCount(liveP.txZone,liveRoster);
    const liveInProgress=inTriage?countTriageTreatmentInProgress(livePatients,location,elapsed):countZoneInProgress(livePatients,liveP.txZone,elapsed);
    if(liveCapacity<=0||liveInProgress>=liveCapacity){fail='ไม่มี Staff ว่างในโซน '+(inTriage?location+' Triage':liveP.txZone)+' ('+liveInProgress+'/'+liveCapacity+')';return null;}

    const durationSec=effectiveTreatmentDurationSec(liveResources[ri],liveGc);
    const tx=(liveP.tx||Array(TX_SLOT_COUNT).fill(null)).slice();
    tx[slotIndex]={item:item,startedAt:elapsed,durationSec:durationSec,location:location,staffName:STATE.me.name||null};
    const nextPatients=livePatients.slice();
    nextPatients[pi]=Object.assign({},liveP,{
      tx:tx,
      firstTreatmentTime:liveP.firstTreatmentTime==null?elapsed:liveP.firstTreatmentTime,
      txStartTime:location==='TX'&&liveP.txStartTime==null?elapsed:liveP.txStartTime,
      events:(liveP.events||[]).concat([{t:elapsed,type:(inTriage?'TRIAGE_TX_START '+location+' ':'TX_START ')+item,by:STATE.me.name||''}])
    });
    const nextResources=liveResources.slice();
    nextResources[ri]=Object.assign({},liveResources[ri],{stock:Number(liveResources[ri].stock)-1});
    root[KEYS.patients]=nextPatients;
    root[KEYS.resources]=nextResources;
    committedPatients=nextPatients;
    committedResources=nextResources;
    return root;
  });
  if(!result.committed){
    toast(fail||'เริ่ม Treatment ไม่สำเร็จ กรุณาลองอีกครั้ง','err');
    await refreshAll();
    return;
  }

  STATE.patients=committedPatients;
  STATE.resources=committedResources;
  toast('เริ่ม Treatment: '+item+(inTriage?' ที่ '+location+' Triage':''),'ok');
  render();
}

async function txCancelItem(id,slotIndex){
  id=normU(id); slotIndex=Number(slotIndex);
  if(!canEditLockedPatient(id))return;
  const elapsed=elapsedMinutes(STATE.gc);
  let fail='',cancelledItem='',committedPatients=null,committedResources=null;
  const result=await kvRootTransaction(function(root){
    const patients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
    const resources=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
    const roster=root[KEYS.roster]||STATE.roster||{};
    const pi=patients.findIndex(function(p){return normU(p.id)===id;});
    if(pi<0){fail='ไม่พบผู้ป่วย #'+id;return null;}
    const p=patients[pi];
    if(['PRIMARY','SECONDARY','TX'].indexOf(p.stage)<0){fail='ยกเลิกได้เฉพาะขณะผู้ป่วยยังอยู่ใน Triage หรือ Treatment';return null;}
    const tx=(p.tx||[]).slice();
    const slot=tx[slotIndex];
    if(!slot){fail='ไม่พบ Treatment ที่ต้องการยกเลิก';return null;}
    const requiredStation=treatmentStationForSlot(p,slot);
    const actingStation=roster[STATE.me.name]&&roster[STATE.me.name].station;
    if(actingStation!=='GM'&&actingStation!==requiredStation){fail='ต้องอยู่ใน Zone ที่ทำ Treatment นี้จึงจะยกเลิกได้';return null;}
    const ri=resources.findIndex(function(r){return r.item===slot.item;});
    if(ri<0){fail='ไม่พบทรัพยากร '+slot.item;return null;}
    cancelledItem=slot.item;
    tx.splice(slotIndex,1);
    const nextPatients=patients.slice();
    nextPatients[pi]=Object.assign({},p,{tx:compactTreatmentSlots(tx),events:(p.events||[]).concat([{t:elapsed,type:'TX_CANCEL '+slot.item,by:STATE.me.name||''}])});
    const nextResources=resources.slice();
    nextResources[ri]=Object.assign({},resources[ri],{stock:Number(resources[ri].stock||0)+1});
    root[KEYS.patients]=nextPatients; root[KEYS.resources]=nextResources;
    committedPatients=nextPatients; committedResources=nextResources;
    return root;
  });
  if(!result.committed){toast(fail||'ยกเลิก Treatment ไม่สำเร็จ','err');return;}
  STATE.patients=committedPatients; STATE.resources=committedResources;
  toast('ยกเลิก '+cancelledItem+' และคืนของเข้า stock แล้ว','ok');
  render();
}

    // Deliberately NOT blocking on whether required tx were completed correctly/in

    let next;
    if(dispo==='TRANSFER') next=Object.assign({},p,{dispo:'TRANSFER',transferOrder:maxOrder(patients,'transferOrder')+1,stage:'TRANSFER',events:(p.events||[]).concat([{t:elapsed,type:'TO_TRANSFER',by:STATE.me.name||''}])});

    const copy=patients.slice();copy[idx]=next;return copy;
  });
  if(saved&&STATE.me.station&&STATE.me.station.indexOf('TX_')===0){await releasePatientLocks([id]);setFocusedPatient(STATE.me.station,null);render(true);}

async function transferAssign(id, field, value){
  if(!canEditLockedPatient(id))return;
  const elapsed=elapsedMinutes(STATE.gc);
  await mutatePatients(function(patients){
    return patients.map(function(p){
      if(normU(p.id)!==normU(id))return p;
      const patch=mkPatch(field,value);
      const label=field==='hospital'?'HOSPITAL_SELECTED ':field==='vehicle'?'VEHICLE_SELECTED ':'TRANSFER_SET '+field+' ';
      patch.events=(p.events||[]).concat([{t:elapsed,type:label+(value||'—'),by:STATE.me.name||''}]);
      return Object.assign({},p,patch);
    });
  });
}

/* ============================================================
   13) DISPATCH ACTION
============================================================ */
async function dispatchSend(vehicleName,selectedIds,selectedHospital){
  vehicleName=norm(vehicleName);
  const explicitSelection=Array.isArray(selectedIds);
  const wantedIds=explicitSelection?uniq(selectedIds.map(normU).filter(Boolean)):[];
  if(!vehicleName){toast('เลือกรถก่อน','err');return false;}
  if(explicitSelection&&!wantedIds.length){toast('เลือกผู้ป่วยอย่างน้อย 1 คน','err');return false;}
  const elapsed=elapsedMinutes(STATE.gc);
  const lockNow=Date.now();
  let fail='';
  let summary=null;
  const result=await kvRootTransaction(function(root){
    fail='';summary=null;
    const vehicles=Array.isArray(root[KEYS.vehicles])?root[KEYS.vehicles]:DEFAULT_VEHICLES.slice();
    const patients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
    const hospitals=Array.isArray(root[KEYS.hospitals])?root[KEYS.hospitals]:DEFAULT_HOSPITALS.slice();
    const casesNow=Array.isArray(root[KEYS.cases])?root[KEYS.cases]:STATE.cases;
    const resourcesNow=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:STATE.resources;
    const gcNow=root[KEYS.gc]||STATE.gc;
    const locksNow=root[KEYS.locks]||{};
    const vehicle=vehicles.find(function(v){return v.name===vehicleName;});
    if(!vehicle){fail='ไม่พบรถ '+vehicleName;return null;}
    if(vehicleEffectiveStatus(vehicle,elapsed)!=='AVAILABLE'){fail='รถยังไม่ว่าง';return null;}

    let assigned;
    if(explicitSelection){
      const unavailable=wantedIds.find(function(id){
        const lock=locksNow[id];
        return !patientLockIsActive(lock,lockNow)||!patientLockOwnedByMe(lock);
      });
      if(unavailable){fail='สิทธิ์จัดผู้ป่วย No. '+unavailable+' หมดอายุหรือถูกใช้งานจากหน้าจออื่น กรุณาเลือกใหม่';return null;}
      assigned=patients.filter(function(p){return p.stage==='TRANSFER'&&wantedIds.indexOf(normU(p.id))>-1;});
      if(assigned.length!==wantedIds.length){fail='ผู้ป่วยบางคนถูกย้ายออกจาก Transfer แล้ว กรุณาเลือกใหม่';return null;}
    }else{
      assigned=patients.filter(function(p){return p.stage==='TRANSFER'&&p.vehicle===vehicleName;});
    }
    if(!assigned.length){fail='ไม่มีผู้ป่วยที่เลือกสำหรับรถคันนี้';return null;}
    if(assigned.some(function(p){return patientIsDead(p,elapsed);})){fail='มีผู้ป่วยที่ไม่สามารถส่งต่อได้ กรุณาเลือกใหม่';return null;}

    const hospitalsList=explicitSelection?[selectedHospital].filter(Boolean):uniq(assigned.map(function(p){return p.hospital;}).filter(Boolean));
    if(hospitalsList.length===0){fail='ยังไม่ได้กำหนดโรงพยาบาลปลายทาง';return null;}
    if(hospitalsList.length>1){fail='ผู้ป่วยบนรถปลายทางไม่ตรงกัน (Mixed hospital)';return null;}
    const hospital=hospitalsList[0];
    const hCapacity=hospitals.find(function(h){return h.name===hospital;});
    if(!hCapacity){fail='ไม่พบโรงพยาบาลปลายทาง';return null;}
    const type=normU(vehicle.type||vehicleType(vehicleName));
    const sitting=assigned.filter(function(p){return effectiveCanWalk(p)==='yes';}).length;
    const lying=assigned.length-sitting;
    const load=calcVehicleLoad(type,assigned.length,sitting,lying,1);
    if(!load.ok){fail='โหลดเกินกำหนด: '+load.label;return null;}

    const ms=Object.assign({},DEFAULT_GC.mapSettings,gcNow.mapSettings||{});
    const manualOutbound=Number(hCapacity.outboundMin!=null?hCapacity.outboundMin:hCapacity.distanceMin)||5;
    const manualReturn=Number(hCapacity.returnMin!=null?hCapacity.returnMin:hCapacity.distanceMin)||manualOutbound;
    const sceneTimes=(ms.useMap&&ms.distTransfer)?sceneRouteTravelTimes(hospital):null;
    const outboundMin=!ms.useMap?manualOutbound:(!ms.distTransfer?0:(sceneTimes?sceneTimes.outboundMin:manualOutbound));
    const returnMin=!ms.useMap?manualReturn:(!ms.distTransfer?0:(sceneTimes?sceneTimes.returnMin:manualReturn));
    const outboundPath=(sceneTimes&&sceneTimes.outboundPath)||[];
    const returnPath=(sceneTimes&&sceneTimes.returnPath)||[];
    const arrivalAt=elapsed+outboundMin;
    const transportHarmAt=elapsed+outboundMin/2;
    const allowHospitalTreatment=hospitalTreatmentEnabled(gcNow);
    const assignedKeys={};assigned.forEach(function(p){assignedKeys[normU(p.id)]=true;});
    const capacityKeys={};
    const projected={RED:Number(hCapacity.redUsed||0),YELLOW:Number(hCapacity.yellowUsed||0),GREEN:Number(hCapacity.greenUsed||0)};
    let sentCount=0,mismatchCount=0,acceptedCount=0,deadCount=0;

    const nextPatients=patients.map(function(p){
      if(p.stage!=='TRANSFER'||!assignedKeys[normU(p.id)])return p;
      const base=Object.assign({},p,{vehicle:vehicleName,hospital:hospital});
      const caseObj=findCase(casesNow,p.id);
      const requiredVehicle=requiredVehicleFor(caseObj);
      const wrongVehicle=requiredVehicle&&type!==normU(requiredVehicle);
      sentCount++;
      if(wrongVehicle){
        mismatchCount++;
        return Object.assign({},base,{
          stage:'HOSPITAL',transferStatus:'IN_TRANSIT_TO_HOSPITAL',closedReason:null,transferTime:elapsed,
          hospitalPlannedArrivalTime:arrivalAt,hospitalArrivalTime:null,hospitalTx:[],
          hospitalCare:{dispatchedAt:elapsed,arrivalAt:arrivalAt,treatmentCompleteAt:arrivalAt,outcomeAt:transportHarmAt,willSurvive:false,transportHarm:true},
          hospitalOutcome:null,transportMismatch:true,requiredVehicle:requiredVehicle||null,overCapacity:false,
          events:(p.events||[]).concat([{t:elapsed,type:'DISPATCH '+vehicleName+' → '+hospital+' (DO HARM: WRONG VEHICLE)',by:STATE.me.name||''}])
        });
      }
      if(!allowHospitalTreatment){
        const txComplete=requiredTxComplete(p,caseObj,elapsed);
        let transferStatus,closedReason;
        if(!txComplete){transferStatus='DEAD_TX_INCOMPLETE';closedReason='DEAD_TX_INCOMPLETE';deadCount++;}
        else{transferStatus='ACCEPTED';closedReason='TRANSFER_ACCEPTED';acceptedCount++;capacityKeys[normU(p.id)]=true;}
        const color=p.secondary||'';
        let overCapacity=false;
        if(closedReason==='TRANSFER_ACCEPTED'&&projected[color]!=null){
          projected[color]++;
          const cap=color==='RED'?hCapacity.redCap:color==='YELLOW'?hCapacity.yellowCap:hCapacity.greenCap;
          overCapacity=projected[color]>Number(cap||0);
        }
        return Object.assign({},base,{
          stage:'CLOSED',transferStatus:transferStatus,closedReason:closedReason,transferTime:elapsed,
          hospitalTx:[],hospitalCare:null,hospitalOutcome:null,hospitalArrivalTime:null,hospitalPlannedArrivalTime:null,
          transportMismatch:false,requiredVehicle:requiredVehicle||null,overCapacity:overCapacity,
          events:(p.events||[]).concat([{t:elapsed,type:'DISPATCH '+vehicleName+' → '+hospital+' (LEGACY)',by:STATE.me.name||''}])
        });
      }
      const hospitalTx=buildHospitalTreatmentPlan(p,caseObj,arrivalAt,resourcesNow,gcNow,elapsed);
      const treatmentCompleteAt=hospitalTx.length?hospitalTx[hospitalTx.length-1].startedAt+hospitalTx[hospitalTx.length-1].durationSec/60:arrivalAt;
      const willSurvive=hospitalPlanWillSucceed(p,caseObj,hospitalTx);
      const limit=Number(caseObj&&caseObj.timeLimit)||999;
      const outcomeAt=willSurvive?treatmentCompleteAt:Math.max(elapsed,Math.min(treatmentCompleteAt,limit));
      capacityKeys[normU(p.id)]=true;
      const color=p.secondary||'';
      let overCapacity=false;
      if(projected[color]!=null){
        projected[color]++;
        const cap=color==='RED'?hCapacity.redCap:color==='YELLOW'?hCapacity.yellowCap:hCapacity.greenCap;
        overCapacity=projected[color]>Number(cap||0);
      }
      return Object.assign({},base,{
        stage:'HOSPITAL',transferStatus:'IN_TRANSIT_TO_HOSPITAL',closedReason:null,transferTime:elapsed,
        hospitalPlannedArrivalTime:arrivalAt,hospitalArrivalTime:null,hospitalTx:hospitalTx,
        hospitalCare:{dispatchedAt:elapsed,arrivalAt:arrivalAt,treatmentCompleteAt:treatmentCompleteAt,outcomeAt:outcomeAt,willSurvive:willSurvive,transportHarm:false},
        transportMismatch:false,requiredVehicle:requiredVehicle||null,overCapacity:overCapacity,
        events:(p.events||[]).concat([{t:elapsed,type:'DISPATCH '+vehicleName+' → '+hospital,by:STATE.me.name||''}])
      });
    });

    const nextHospitals=hospitals.map(function(h){
      if(h.name!==hospital)return h;
      let addRed=0,addYellow=0,addGreen=0;
      nextPatients.forEach(function(p){
        if(!capacityKeys[normU(p.id)])return;
        if(p.secondary==='RED')addRed++;else if(p.secondary==='YELLOW')addYellow++;else if(p.secondary==='GREEN')addGreen++;
      });
      return Object.assign({},h,{redUsed:Number(h.redUsed||0)+addRed,yellowUsed:Number(h.yellowUsed||0)+addYellow,greenUsed:Number(h.greenUsed||0)+addGreen});
    });
    const nextVehicles=vehicles.map(function(v){return v.name===vehicleName?Object.assign({},v,{
      busyStartElapsed:elapsed,outboundMin:outboundMin,returnMin:returnMin,outboundPath:outboundPath,returnPath:returnPath,
      busyUntilElapsed:elapsed+outboundMin+returnMin,busyHospital:hospital
    }):v;});
    root[KEYS.patients]=nextPatients;
    root[KEYS.hospitals]=nextHospitals;
    root[KEYS.vehicles]=nextVehicles;
    if(explicitSelection){
      const nextLocks=Object.assign({},locksNow);
      wantedIds.forEach(function(id){delete nextLocks[id];});
      root[KEYS.locks]=nextLocks;
    }
    summary={allowHospitalTreatment:allowHospitalTreatment,hospital:hospital,sentCount:sentCount,mismatchCount:mismatchCount,acceptedCount:acceptedCount,deadCount:deadCount};
    return root;
  });
  if(!result.committed){toast(fail||'ส่งรถไม่สำเร็จ กรุณาลองใหม่','err');return false;}
  if(result.root){
    if(result.root[KEYS.patients])STATE.patients=result.root[KEYS.patients];
    if(result.root[KEYS.hospitals])STATE.hospitals=result.root[KEYS.hospitals];
    if(result.root[KEYS.vehicles])STATE.vehicles=result.root[KEYS.vehicles];
    if(result.root[KEYS.locks])STATE.locks=result.root[KEYS.locks];
  }
  if(summary.allowHospitalTreatment){
    toast('ส่งรถ '+vehicleName+' → '+summary.hospital+' | ผู้ป่วย '+summary.sentCount+' คน กำลังเข้าสู่ Hospital simulation'+(summary.mismatchCount?' | รถไม่ตรงโจทย์ '+summary.mismatchCount:'') ,'ok');
  }else{
    toast('ส่งรถ '+vehicleName+' → '+summary.hospital+' | กติกาเดิม: Accepted '+summary.acceptedCount+' | Dead '+summary.deadCount,summary.acceptedCount>0?'ok':'err');
  }
  render();
  return true;
}

async function gmUpdateResource(item, patch){
  await kvUpdate(KEYS.resources,DEFAULT_RESOURCES,function(list){return list.map(function(r){
    if(r.item!==item)return r;
    const added=patch.stock==null?0:Math.max(0,Number(patch.stock)-Number(r.stock));
    return Object.assign({},r,patch,{addedTotal:Number(r.addedTotal||0)+added});
  });});
  STATE.resources=await kvGet(KEYS.resources,DEFAULT_RESOURCES);toast('อัปเดตทรัพยากร '+item,'ok');render();
}
async function gmAddResource(item, stock, durationSec){
  item=norm(item);
  if(!item){toast('กรุณากรอกชื่อทรัพยากร','err');return;}
  if(STATE.resources.some(function(r){return String(r.item).toLowerCase()===item.toLowerCase();})){
    toast('มีทรัพยากรชื่อนี้แล้ว','err');return;
  }
  const rec={item:item,stock:Math.max(0,Number(stock)||0),durationSec:Math.max(1,Number(durationSec)||5),triageAllowed:false,addedTotal:Math.max(0,Number(stock)||0)};

}
async function gmUpdateHospital(name, patch){

async function gmRenameHospital(oldName,newName,patch){

    root[KEYS.hospitals]=(root[KEYS.hospitals]||DEFAULT_HOSPITALS).map(function(h){return h.name===oldName?Object.assign({},h,patch,{name:newName}):h;});

async function gmDeleteHospital(name){
  if(STATE.gc.mapSettings && STATE.gc.mapSettings.useMap){toast('กรุณาปิด “ใช้ Map” ก่อนลบโรงพยาบาลที่กรอกเอง','err');return;}
  const assigned=STATE.patients.some(function(p){return p.hospital===name && (p.stage==='TRANSFER'||p.stage==='HOSPITAL');});
  if(assigned){toast('ลบไม่ได้: มีผู้ป่วยกำลังรอส่งหรืออยู่ใน Hospital simulation','err');return;}

/* ============================================================
   15) RENDER CORE (shell, join, waiting, topbar, toasts)
============================================================ */
/* The embedded Scene Setup module owns a live Leaflet map instance that must
   NOT be destroyed by innerHTML replacement while GM is actively working in
   it (dragging pins etc. isn't caught by the [data-preserve] focus-guard
   below, since map drags don't focus a form control). So once mounted, we
   skip full re-renders entirely while GM stays on that tab; we only rebuild
   when the tab actually changes (which calls render(true) and, in the else
   branch below, tears the map down cleanly first). */
let sceneMounted = false;
/* Stations that get the read-only live Scene Map panel. GM also gets it
   (optional, per spec) whenever GM isn't already on the Scene Setup editor
   tab, since that tab has its own live map. */
const SCENE_VIEWER_STATIONS = ['COMMANDER','TRANSFER','DISPATCH'];
let sceneViewerMounted = false;
function rosterStationSnapshot(){
  const compact={};
  Object.keys(STATE.roster||{}).forEach(function(name){compact[name]=(STATE.roster[name]&&STATE.roster[name].station)||null;});
  return compact;
}
function renderSnapshotForCurrentView(){
  const st=STATE.me.station;
  const base={gc:STATE.gc,me:STATE.me,ready:STATE.ready,fbConnected:STATE.fbConnected,toasts:STATE.toasts,ui:STATE.ui,locks:compactActiveLocks()};
  const rosterStations=rosterStationSnapshot();
  if(!STATE.me.name||!STATE.ready||!st)return JSON.stringify(Object.assign(base,{roster:rosterStations}));
  if(st==='GM')return JSON.stringify(Object.assign(base,{cases:STATE.cases,resources:STATE.resources,hospitals:STATE.hospitals,vehicles:STATE.vehicles,patients:STATE.patients,roster:rosterStations,scene:STATE.scene,gmTab:STATE.gmTab}));
  if(st==='COMMANDER')return JSON.stringify(Object.assign(base,{roster:rosterStations,hospitals:STATE.hospitals,vehicles:STATE.vehicles,scene:STATE.scene}));
  let relevant=[];
  if(st==='PRIMARY')relevant=STATE.patients.filter(function(p){return p.stage==='PRIMARY'||(p.stage==='TRANSIT'&&p.transit&&p.transit.fromStage==='PRIMARY');});
  else if(st==='SECONDARY')relevant=STATE.patients.filter(function(p){return p.stage==='SECONDARY'||(p.stage==='TRANSIT'&&p.transit&&p.transit.fromStage==='SECONDARY');});
  else if(st.indexOf('TX_')===0){const zone=st.slice(3);relevant=STATE.patients.filter(function(p){return p.stage==='TX'&&p.txZone===zone;});}
  else if(st==='TRANSFER'||st==='DISPATCH')relevant=STATE.patients.filter(function(p){return p.stage==='TRANSFER';});
  else if(st==='DISCHARGE')relevant=STATE.patients.filter(function(p){return p.stage==='CLOSED';});
  const scoped={patients:relevant,roster:rosterStations};
  if(st==='PRIMARY'||st==='SECONDARY'||st.indexOf('TX_')===0)scoped.resources=STATE.resources;
  if(st==='TRANSFER'||st==='DISPATCH')Object.assign(scoped,{hospitals:STATE.hospitals,vehicles:STATE.vehicles,scene:STATE.scene});
  return JSON.stringify(Object.assign(base,scoped));
}
function render(force){
  const onSceneTab = STATE.ready && STATE.me.station==='GM' && STATE.gmTab==='scene';
  if(onSceneTab && sceneMounted){ updateSceneViewerPanel(); return; }

  const snap=renderSnapshotForCurrentView();
  if(!force && snap===STATE._snapshot){updateLiveTimersOnly();updateSceneViewerPanel();return;}
  STATE._snapshot = snap;

  const active = document.activeElement;
  let preserved = null;
  if(active && active.matches && active.matches('[data-preserve]')){
    preserved = {id:active.id, value:active.value, selStart:active.selectionStart, selEnd:active.selectionEnd};
  }

  const app = document.getElementById('app');
  app.innerHTML = buildView();

  if(preserved){
    const el = document.getElementById(preserved.id);
    if(el){
      el.value = preserved.value;
      el.focus();
      try{ el.setSelectionRange(preserved.selStart, preserved.selEnd); }catch(e){}
    }
  }

  if(onSceneTab){
    sceneMounted = true;
    window.SceneApp && window.SceneApp.mount({
      container: document.getElementById('scRoot'),
      data: STATE.scene && STATE.scene.data,
      hospitals: STATE.hospitals
    });
  }else if(sceneMounted){
    sceneMounted = false;
    window.SceneApp && window.SceneApp.destroy();
  }

  updateSceneViewerPanel();
}

/* Shows/hides + mounts/destroys/updates the persistent #sceneViewerHost
   panel. The panel's DOM node lives outside #app (untouched by the
   app.innerHTML rebuild above), so mount() only runs once when a relevant
   station first becomes active; every other call here is a cheap
   setData()/setVehicles() update — this is what lets vehicle markers
   animate smoothly on every ~1s render tick without the map flickering
   or re-initializing. */
function updateSceneViewerPanel(){
  const host = document.getElementById('sceneViewerHost');
  if(!host) return;
  const st = STATE.me && STATE.me.station;
  const wantsIt = STATE.ready && st && sceneReady() && STATE.scene && STATE.scene.data && (
    SCENE_VIEWER_STATIONS.indexOf(st)>-1 || (st==='GM' && STATE.gmTab!=='scene')
  );
  if(!wantsIt){
    if(sceneViewerMounted){ sceneViewerMounted=false; window.SceneViewer && window.SceneViewer.destroy(); }
    host.classList.add('hidden');
    return;
  }
  host.classList.remove('hidden');
  if(!sceneViewerMounted){
    sceneViewerMounted = true;
    window.SceneViewer && window.SceneViewer.mount({container: document.getElementById('sceneViewerMap'), data: STATE.scene.data});
  }else{
    window.SceneViewer && window.SceneViewer.setData(STATE.scene.data);
  }
  window.SceneViewer && window.SceneViewer.setVehicles(STATE.vehicles, elapsedMinutes(STATE.gc));
}

function buildView(){
  if(!fbReady){
    return viewSetupNeeded();
  }
  const banner = STATE.fbConnected===false ? viewConnErrorBanner() : '';
  if(!STATE.me.name){
    return banner + viewJoin();
  }
  if(!STATE.ready){
    return banner + '<div class="waitwrap"><div class="spinner"></div><p>กำลังโหลด...</p></div>';
  }
  if(!STATE.me.station){
    return banner + viewWaiting();
  }
  return banner + viewShell(viewStationBody());
}

function viewSetupNeeded(){
  return ''
  + '<div class="joinwrap"><div class="joincard">'
  +   '<div class="jc-title">⚙️ ยังไม่ได้ตั้งค่า Firebase</div>'

function renderClockPill(){
  const elapsed = elapsedMinutes(STATE.gc);
  const statusLabel = STATE.gc.status==='RUNNING' ? 'กำลังดำเนินการ' : STATE.gc.status==='ENDED' ? 'จบเกมแล้ว' : 'ยังไม่เริ่ม';
  return ''
  + '<div class="clockwrap">'
  +   '<span class="pill status-'+STATE.gc.status+'">● '+statusLabel+'</span>'
  +   '<span class="timerbig" id="liveTimer">'+ (STATE.gc.status==='NOT_STARTED' ? '--:--' : fmtClock(elapsed)) +'</span>'
  +   '<span class="pill">Max <b>'+STATE.gc.maxGameMin+'</b> น.</span>'
  + '</div>';
}
function fmtClock(elapsedMin){
  const totalSec = Math.max(0, Math.round(elapsedMin*60));
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function treatmentLocationLabel(location){
  if(location==='PRIMARY')return 'Primary Triage';
  if(location==='SECONDARY')return 'Secondary Triage';
  if(location==='HOSPITAL')return 'โรงพยาบาล';

function visibleTxSlotIndexes(p){
  const used=(p.tx||[]).filter(Boolean).length;
  const count=Math.min(TX_SLOT_COUNT,Math.max(1,used+(used<TX_SLOT_COUNT?1:0)));
  return Array.from({length:count},function(_,i){return i;});
}
function txSlotSelectHtml(p, slotIndex, elapsed, context){
  context=context||'TX';
  const inTriage=context==='PRIMARY'||context==='SECONDARY';
  const slot = (p.tx||[])[slotIndex];
  const staffFree=!inTriage||triageHasFreeStaff(context,STATE.patients,elapsed,STATE.roster);
  const canStart = canStartSequential(p, slotIndex, elapsed) && !hasAnyTxInProgress(p, elapsed) && staffFree;
  if(slot){
    const status = txSlotStatus(slot, elapsed);
    const endElapsed=slot.startedAt+slot.durationSec/60;
    const remain = status==='IN_PROGRESS' ? Math.max(0,Math.ceil((endElapsed-elapsed)*60)) : 0;
    return '<div class="kv"><span class="k">Tx'+(slotIndex+1)+': '+esc(slot.item)+' <span class="badge neutral">'+treatmentLocationLabel(slot.location)+'</span></span><span class="v">'
      + (status==='IN_PROGRESS' ? '<span class="tx-countdown" data-tx-end="'+endElapsed+'"><span class="pulse-dot"></span><span class="tx-countdown-text">เหลือ '+remain+'s</span></span>' : '✅ สำเร็จ')
      + ' <button class="btn sm danger" data-act="txCancel" data-pid="'+esc(p.id)+'" data-slot="'+slotIndex+'">ยกเลิก / คืน stock</button></span></div>';
  }
  if(!canStart){
    const reason=!staffFree?'ไม่มี Staff ว่าง':'รอลำดับก่อนหน้า';
    return '<div class="kv"><span class="k">Tx'+(slotIndex+1)+'</span><span class="v" style="color:var(--ink-faint);">'+reason+'</span></div>';
  }

function transferDiagnosis(p){
  return norm(p&&p.dx)||norm(p&&p.txNote)||'—';
}
function transferTreatmentSummary(p,elapsed){
  const done=(p&&p.tx||[]).filter(Boolean).filter(function(slot){return txSlotStatus(slot,elapsed)==='SUCCESS';}).map(function(slot){return slot.item;});
  return done.length?done.join(', '):'ยังไม่มี Treatment ที่สำเร็จ';
}
function viewTransfer(){
  const elapsed=elapsedMinutes(STATE.gc);
  const queue=STATE.patients.filter(function(p){return p.stage==='TRANSFER';}).sort(function(a,b){return (a.transferOrder||0)-(b.transferOrder||0);});

    const lock=patientLockFor(id);
    return lock&&patientLockOwnedByMe(lock)&&queue.some(function(p){return normU(p.id)===normU(id);});
  }):[];
  const selectedPatients=queue.filter(function(p){return selectedIds.indexOf(normU(p.id))>-1;});
  const availableVehicles=STATE.vehicles.filter(function(v){return vehicleEffectiveStatus(v,elapsed)==='AVAILABLE';});
  const parkedVehicles=availableVehicles.filter(function(v){return !selectedVehicle||v.name!==selectedVehicle.name;});

  const sitting=selectedPatients.filter(function(p){return effectiveCanWalk(p)==='yes';}).length;

  function waitingPatientChoice(p){

      +(otherLock?'<span class="transfer-lock">กำลังจัดโดย '+esc(otherLock.ownerName)+'</span>':'')+'</button>';

    return '<button class="vehicle-passenger staging-passenger vp-'+color+'" data-act="transferPatientLocal" data-pid="'+esc(p.id)+'" title="นำ Patient No. '+esc(p.id)+' ลงจากรถ">'

    const type=dashboardVehicleType(selectedVehicle);

      +'<div class="vehicle-meta">แตะผู้ป่วยบนรถเพื่อนำลง</div><div class="vehicle-visual '+type+'">'+vehicleGraphicSvg(type)+onboard+'</div>'
      +'<div class="vehicle-meta '+(load.ok?'vehicle-load-ok':'vehicle-load-bad')+'">'+esc(load.label)+' · นั่ง '+sitting+' · นอน '+lying+'</div></div>';
  }
  function stagingClinicalHtml(){
    if(!selectedPatients.length)return '';
    return '<div class="transfer-clinical-list">'+selectedPatients.map(function(p){

    const onboard=list.length-waiting.length;
    return '<div class="transfer-patient-row"><div class="transfer-row-head"><b>'+color+'</b><span class="badge '+color+'">'+waiting.length+' รอ'+(onboard?' · '+onboard+' บนรถนี้':'')+'</span></div><div class="transfer-patient-grid">'+(waiting.length?waiting.map(waitingPatientChoice).join(''):'<span class="hint">ไม่มีผู้ป่วยรอในแถวนี้</span>')+'</div></div>';

  const selectedHospitalOptions=hospitalOptions.replace('value="'+esc(transferUi.hospital||'###')+'"','value="'+esc(transferUi.hospital||'###')+'" selected');

  return '<div class="station-hero"><div class="titlewrap"><div class="eyebrow">STATION</div><h1>🚑 Transfer & Vehicle</h1></div><span class="badge neutral">รอในคิว '+queue.length+'</span></div>'
    +'<div class="transfer-workflow">'

        +'<div class="hint" style="margin-bottom:10px;">รถที่ทุกหน้าจอเห็นตรงกัน · เลือกแล้วจะย้ายไปช่องเตรียมส่งเฉพาะหน้าจอนี้</div><div class="transfer-vehicle-grid">'+(vehicleChoices||'<span class="hint">ไม่มีรถว่างในลานจอด</span>')+'</div>'
        +(busyVehicles.length?'<div class="parking-busy">ออกปฏิบัติการ '+busyVehicles.length+' คัน · '+busyVehicles.map(function(v){return esc(vehicleDisplayName(v));}).join(', ')+'</div>':'')+'</div>'
      +'<div class="transfer-step"><div class="transfer-step-title"><span class="transfer-step-num">2</span>ผู้ป่วยรอขึ้นรถ <span class="badge neutral">ข้อมูลกลาง '+queue.length+' คน</span></div>'+colorRows
        +(black.length?'<div class="transfer-patient-row"><div class="transfer-row-head"><b>BLACK</b><span class="badge BLACK">'+black.length+' คน</span></div><div class="transfer-patient-grid">'+black.filter(function(p){return selectedIds.indexOf(normU(p.id))<0;}).map(waitingPatientChoice).join('')+'</div></div>':'')
        +(!selectedVehicle?'<div class="hint" style="margin-top:10px;">เลือกรถก่อน จึงจะกดเลือกผู้ป่วยขึ้นรถได้</div>':'')+'</div>'
    +'</div>'
    +'<div class="transfer-staging"><div class="transfer-step-title"><span class="transfer-step-num">3</span>รถเตรียมส่ง'+(selectedVehicle?' · '+esc(vehicleDisplayName(selectedVehicle)):'')+'<span class="transfer-local-note">เฉพาะหน้าจอ '+esc(STATE.me.name||'นี้')+'</span></div>'
      +'<div class="transfer-staging-layout"><div>'+stagingVehicleHtml()+stagingClinicalHtml()+(selectedVehicle?'<button class="btn sm" data-act="transferVehicleClear">↩ คืนรถเข้าลานบนหน้าจอนี้</button>':'')+'</div>'
        +'<div class="transfer-sendbar"><label class="label">โรงพยาบาลปลายทาง</label><select data-act="transferHospitalLocal" '+(selectedVehicle?'':'disabled')+'>'+selectedHospitalOptions+'</select>'
          +'<div class="transfer-load-summary"><b>'+(selectedVehicle?esc(vehicleDisplayName(selectedVehicle)):'ยังไม่ได้เลือกรถ')+'</b><br>ผู้ป่วยบนรถ '+selectedPatients.length+' คน · นั่ง '+sitting+' · นอน '+lying+'<br><span class="'+(load.ok?'vehicle-load-ok':'vehicle-load-bad')+'">'+esc(load.label)+'</span></div>'
          +'<button class="btn primary block" data-act="transferSendBatch" '+(canSend?'':'disabled')+'>SEND รถพร้อมผู้ป่วย</button></div></div></div>';
}
