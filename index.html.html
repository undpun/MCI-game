function viewDispatch(embedded){
  const elapsed = elapsedMinutes(STATE.gc);
  const rows = STATE.vehicles.map(function(v){
    const status = vehicleEffectiveStatus(v, elapsed);
    const assigned = STATE.patients.filter(function(p){ return p.stage==='TRANSFER' && p.vehicle===v.name; });
    const ids = assigned.map(function(p){ return '#'+p.id; }).join(', ') || '—';
    const hospitalsList = uniq(assigned.map(function(p){ return p.hospital; }).filter(Boolean));
    const hospitalLabel = hospitalsList.length===0 ? '—' : hospitalsList.length===1 ? hospitalsList[0] : 'MIXED';
    const sitting = assigned.filter(function(p){ return effectiveCanWalk(p)==='yes'; }).length;
    const lying = assigned.filter(function(p){ return effectiveCanWalk(p)!=='yes'; }).length;
    const load = calcVehicleLoad(v.type, assigned.length, sitting, lying, hospitalsList.length);
    const canSend = status==='AVAILABLE' && hospitalsList.length===1 && load.ok && assigned.length>0;
    const returnInfo = status==='BUSY' ? ('กลับใน '+round1(v.busyUntilElapsed-elapsed)+' น. ('+esc(v.busyHospital||'')+')') : '';
    return '<tr class="row-hover">'
      + '<td><b>'+esc(v.name)+'</b><div class="hint">'+vehicleCapacityNote(v.type)+'</div></td>'
      + '<td><span class="badge neutral">'+v.type+'</span></td>'
      + '<td>'+(status==='AVAILABLE' ? '<span class="badge ok">ว่าง</span>' : '<span class="badge wait">ไม่ว่าง</span>')+'<div class="hint">'+returnInfo+'</div></td>'
      + '<td style="font-family:var(--font-mono);font-size:12px;">'+ids+'</td>'
      + '<td>'+hospitalLabel+'</td>'
      + '<td>'+(load.ok ? '<span class="badge ok">'+load.label+'</span>' : '<span class="badge bad">'+load.label+'</span>')+'</td>'
      + '<td><button class="btn sm primary" data-act="dispatchSend" data-vehicle="'+esc(v.name)+'" '+(canSend?'':'disabled')+'>ส่งรถ (SEND)</button></td>'
      + '</tr>';
  }).join('');

  const table = '<div class="card"><table><thead><tr><th>Vehicle</th><th>Type</th><th>Status</th><th>ผู้ป่วยบนรถ</th><th>ปลายทาง</th><th>โหลด</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';

  if(embedded) return table;
  return ''
  + '<div class="station-hero"><div class="titlewrap"><div class="eyebrow">STATION</div><h1>📡 Vehicle Dispatch</h1></div></div>'
  + table;
}

function viewGM(){
  const useMap = mapSettings().useMap;

    return '<div class="tab'+(STATE.gmTab===t.id?' active':'')+'" data-act="gmTab" data-tab="'+t.id+'">'+t.label+'</div>';
  }).join('');

  let body = '';
  if(STATE.gmTab==='control') body = gmTabControl();
  else if(STATE.gmTab==='scene') body = gmTabScene();

  else if(STATE.gmTab==='resources') body = gmTabResources();
  else if(STATE.gmTab==='vehicles') body = gmTabVehicles();

function dashboardPatientZone(p){
  if(p.stage==='PRIMARY')return 'PRIMARY';
  if(p.stage==='SECONDARY')return 'SECONDARY';
  if(p.stage==='TRANSIT'&&p.transit){
    if(p.transit.toStage==='SECONDARY')return 'SECONDARY';
    if(p.transit.toStage==='TX')return 'TX_'+(p.transit.txZone||p.secondary||'RED');
  }
  if(p.stage==='TX')return 'TX_'+(p.txZone||p.secondary||'RED');
  if(p.stage==='TRANSFER')return 'TRANSFER';
  if(p.stage==='HOSPITAL')return 'HOSPITAL';
  if(p.stage==='CLOSED'&&p.hospital)return 'HOSPITAL';
  return null;
}
function dashboardPatientColor(p,elapsed){
  if(patientIsDead(p,elapsed)||String(p.closedReason||'').indexOf('DEAD')===0)return 'BLACK';
  return p.secondary||p.primary||'gray';
}
function dashboardPatientSub(p,zone,elapsed){
  if(p.stage==='TRANSIT')return 'กำลังเคลื่อนย้าย';
  if(zone==='HOSPITAL'){
    if(p.stage==='HOSPITAL')return p.hospital||'กำลังส่ง';
    return p.hospitalOutcome==='SURVIVED'?'รับรักษาแล้ว':(p.hospital||'สิ้นสุดการส่ง');
  }
  if(zone==='TRANSFER')return p.vehicle||'รอจัดรถ';
  const active=(p.tx||[]).find(function(slot){return slot&&txSlotStatus(slot,elapsed)==='IN_PROGRESS';});
  if(active)return active.item;
  return p.secondary||p.primary||'รอ Triage';
}
function pixelPatientHtml(p,zone,elapsed){
  const color=dashboardPatientColor(p,elapsed);
  return '<div class="pixel-patient" title="#'+esc(p.id)+' · '+esc(dashboardPatientSub(p,zone,elapsed))+'">'
    +'<div class="pixel-human '+color+'"></div><div class="pixel-label">No. '+esc(p.id)+'</div>'
    +'<div class="pixel-sub">'+esc(dashboardPatientSub(p,zone,elapsed))+'</div></div>';
}
function zoneStaffActivity(name,stationIds,elapsed){
  for(let i=0;i<STATE.patients.length;i++){
    const p=STATE.patients[i];
    const slot=(p.tx||[]).find(function(x){
      return x&&x.staffName===name&&txSlotStatus(x,elapsed)==='IN_PROGRESS'&&stationIds.indexOf(treatmentStationForSlot(p,x))>-1;
    });
    if(slot)return 'กำลังรักษา No. '+p.id+' · '+slot.item;
  }
  let latest=null;
  STATE.patients.forEach(function(p){
    (p.events||[]).forEach(function(e){

  });

function gmStageSort(p){

function gmPatientZoneHtml(p){
  if(p.stage==='PRIMARY')return '<span class="badge neutral">Primary Triage</span>';
  if(p.stage==='SECONDARY')return '<span class="badge neutral">Secondary Triage</span>';
  if(p.stage==='TX')return '<span class="badge '+(p.txZone||'neutral')+'">Treatment '+esc(p.txZone||'')+'</span>';
  if(p.stage==='TRANSFER')return '<span class="badge neutral">Transfer</span>';
  if(p.stage==='HOSPITAL')return '<span class="badge wait">โรงพยาบาล · '+esc(p.hospital||'—')+'</span>';
  if(p.stage==='TRANSIT')return '<span class="badge wait">กำลังเคลื่อนย้าย</span>';
  return '<span class="badge neutral">'+esc(p.stage||'—')+'</span>';
}
function gmPatientActivityHtml(p,elapsed){
  if(patientIsDead(p,elapsed)||(p.closedReason&&String(p.closedReason).indexOf('DEAD')===0))return '<span class="badge dead">เสียชีวิต</span>';
  if(p.stage==='HOSPITAL'&&p.hospitalCare){
    const phase=hospitalCarePhase(p,elapsed);
    if(phase==='IN_TRANSIT'){
      const remain=Math.max(0,round1((p.hospitalCare.arrivalAt-elapsed)*60));
      return '<span class="badge wait">🚑 ไป '+esc(p.hospital||'โรงพยาบาล')+' · '+remain+'s</span>';
    }
  }
  const active=allTreatmentSlots(p).find(function(slot){return slot&&txSlotStatus(slot,elapsed)==='IN_PROGRESS';});
  if(active){
    const remain=Math.max(0,round1((active.startedAt+active.durationSec/60-elapsed)*60));
    return '<span class="badge wait"><span class="pulse-dot"></span> '+esc(active.item)+' · '+treatmentLocationLabel(active.location)+' · '+remain+'s</span>';
  }
  if(p.stage==='PRIMARY')return p.primary?'รอส่ง Secondary':'รอ Primary Triage';
  if(p.stage==='SECONDARY')return p.secondary?'รอส่ง Treatment':'รอ Secondary Triage';
  if(p.stage==='TX'){
    const status=computeTxStatus(p,findCase(STATE.cases,p.id),elapsed);
    return status==='STABILIZED'?'<span class="badge ok">พร้อมส่งต่อ</span>':'รอเริ่ม Treatment';
  }
  if(p.stage==='TRANSFER')return (p.vehicle||p.hospital)?'จัดรถ '+esc(p.vehicle||'—')+' → '+esc(p.hospital||'—'):'รอเลือกรถและโรงพยาบาล';
  if(p.stage==='HOSPITAL')return '<span class="badge wait">รอผลการรักษาที่โรงพยาบาล</span>';
  if(p.stage==='TRANSIT'&&p.transit){
    const remain=Math.max(0,round1((p.transit.arriveElapsed-elapsed)*60));
    return 'ไป '+(p.transit.toStage==='TX'?'Treatment '+esc(p.transit.txZone||''):esc(p.transit.toStage))+' · '+remain+'s';
  }
  return '—';
}
function gmTreatmentHistoryHtml(p,elapsed){
  const items=allTreatmentSlots(p).map(function(slot){
    const slotStatus=txSlotStatus(slot,elapsed);
    const status=slotStatus==='PENDING'?'รอเริ่ม':slotStatus==='IN_PROGRESS'?'กำลังทำ':'เสร็จ';
    return '<span class="badge '+(status==='เสร็จ'?'ok':'wait')+'">'+esc(slot.item)+' · '+treatmentLocationLabel(slot.location)+' · '+status+'</span>';
  });
  return items.length?'<div class="tx-history">'+items.join('')+'</div>':'<span class="hint">ยังไม่มี</span>';
}

function avgMetric(values){
  const v=values.filter(function(x){return Number.isFinite(x)&&x>=0;});
  return v.length?round1(v.reduce(function(a,b){return a+b;},0)/v.length):'—';
}
function timelineClock(t){
  if(!STATE.gc.startTime)return fmtMin(t);
  return new Date(STATE.gc.startTime+(Number(t)||0)*60000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}
function timelineDateTime(t){
  if(!STATE.gc.startTime)return '—';
  return new Date(STATE.gc.startTime+(Number(t)||0)*60000).toLocaleString('th-TH',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}
function timelineCategory(type){
  if(type==='GAME_START'||type==='GAME_END')return 'game';
  if(type.indexOf('TX_')>-1||type.indexOf('TREATMENT')>-1)return 'treatment';
  if(type.indexOf('TRANSFER')>-1||type.indexOf('DISPATCH')>-1||type.indexOf('HOSPITAL')>-1||type.indexOf('VEHICLE')>-1)return 'transfer';
  if(type.indexOf('DEAD')>-1||type.indexOf('SURVIVED')>-1||type.indexOf('DISCHARGE')>-1)return 'outcome';
  return 'patient';
}
function timelineDescription(entry){
  const type=entry.type||'', p=entry.patient, no=p?'No. '+p.id:'';
  if(type==='GAME_START')return 'เริ่มเกม MCI';
  if(type==='GAME_END')return 'จบเกม MCI';
  if(type==='REGISTERED')return no+' เข้าสู่ Primary Triage';
  if(type.indexOf('PRIMARY_CLASSIFY ')===0)return 'Primary Triage '+no+' = '+type.slice(17);
  if(type.indexOf('SECONDARY_CLASSIFY ')===0)return 'Secondary Triage '+no+' = '+type.slice(19);
  if(type.indexOf('PRIMARY_')===0){
    const dest=type.slice(8)==='DISCHARGE'?'Discharge':'Secondary Triage';
    return 'ส่ง '+no+' จาก Primary Triage → '+dest;
  }
  if(type.indexOf('SECONDARY_')===0){
    const dest=type.slice(10)==='DISCHARGE'?'Discharge':'Treatment '+(p.secondary||'');
    return 'ส่ง '+no+' จาก Secondary Triage → '+dest;
  }
  if(type.indexOf('TRIAGE_TX_START ')===0){
    const parts=type.split(' ');return 'เริ่ม Treatment '+parts.slice(2).join(' ')+' ให้ '+no+' ที่ '+parts[1]+' Triage';
  }
  if(type.indexOf('TX_START ')===0)return 'เริ่ม Treatment '+type.slice(9)+' ให้ '+no;
  if(type.indexOf('TX_DONE ')===0)return 'Treatment '+type.slice(8)+' ของ '+no+' เสร็จสิ้น';
  if(type.indexOf('TX_CANCEL_STAFF_MOVED ')===0)return 'Treatment ของ '+no+' ถูกยกเลิกเนื่องจากย้าย Staff ออกจาก '+type.slice(22);
  if(type.indexOf('TX_CANCEL ')===0)return 'ยกเลิก Treatment '+type.slice(10)+' ของ '+no+' และคืน Stock';
  if(type==='TO_TRANSFER')return no+' ย้ายเข้าสู่ Transfer';
  if(type.indexOf('HOSPITAL_SELECTED ')===0)return 'เลือกปลายทาง '+type.slice(18)+' ให้ '+no;
  if(type.indexOf('VEHICLE_SELECTED ')===0)return 'เลือกรถ '+type.slice(17)+' ให้ '+no;
  if(type.indexOf('DISPATCH ')===0)return 'ส่ง '+no+' '+type.slice(9);
  if(type.indexOf('ARRIVE_HOSPITAL ')===0)return no+' ถึง '+type.slice(16);
  if(type.indexOf('HOSPITAL_TX_START ')===0)return 'โรงพยาบาลเริ่ม '+type.slice(18)+' ให้ '+no;
  if(type.indexOf('HOSPITAL_TX_DONE ')===0)return 'โรงพยาบาลทำ '+type.slice(17)+' ให้ '+no+' เสร็จ';
  if(type==='TRANSFER_ACCEPTED')return no+' ได้รับการส่งต่อสำเร็จ';
  if(type==='SURVIVED_HOSPITAL_TREATMENT')return no+' รักษาที่โรงพยาบาลเสร็จและรอดชีวิต';
  if(type==='HOSPITAL_TREATMENT_LATE')return no+' ได้รับ Treatment ที่โรงพยาบาลไม่ทันเวลา';
  if(type==='DO_HARM_WRONG_VEHICLE')return no+' เกิดผลเสียระหว่างส่งจากการใช้รถผิดประเภท';
  if(type.indexOf('DISCHARGE')===0)return 'Discharge '+no;
  return no+(no?' · ':'')+type.replaceAll('_',' ');
}
function buildMasterTimeline(elapsed){
  let seq=0, entries=[];
  if(STATE.gc.startTime)entries.push({t:0,type:'GAME_START',by:STATE.gc.startedBy||'GM',seq:seq++});
  STATE.patients.forEach(function(p){
    (p.events||[]).forEach(function(e){
      if(e.type.indexOf('HOSPITAL_TX_START ')===0||e.type.indexOf('HOSPITAL_TX_DONE ')===0)return;
      entries.push({t:Number(e.t)||0,type:e.type,by:e.by||'',patient:p,seq:seq++});
    });
    (p.tx||[]).filter(Boolean).forEach(function(slot){
      const doneAt=slot.startedAt+slot.durationSec/60;
      if(doneAt<=elapsed)entries.push({t:doneAt,type:'TX_DONE '+slot.item,by:slot.staffName||'',patient:p,seq:seq++});
    });
    (p.hospitalTx||[]).filter(Boolean).forEach(function(slot){
      if(slot.startedAt<=elapsed)entries.push({t:slot.startedAt,type:'HOSPITAL_TX_START '+slot.item,by:'HOSPITAL',patient:p,seq:seq++});
      const doneAt=slot.startedAt+slot.durationSec/60;
      if(doneAt<=elapsed)entries.push({t:doneAt,type:'HOSPITAL_TX_DONE '+slot.item,by:'HOSPITAL',patient:p,seq:seq++});
    });
  });
  if(STATE.gc.status==='ENDED'&&STATE.gc.endedElapsed!=null)entries.push({t:Number(STATE.gc.endedElapsed)||0,type:'GAME_END',by:STATE.gc.endedBy||'SYSTEM',seq:seq++});
  return entries.sort(function(a,b){return a.t-b.t||a.seq-b.seq;});
}
function triageUrgencyRank(color){
  return {BLACK:0,GREEN:1,YELLOW:2,RED:3}[normU(color)];
}
function triageDecisionResult(guess,answer){
  guess=normU(guess);answer=normU(answer);
  if(!guess||!answer)return 'UNKNOWN';
  if(guess===answer)return 'CORRECT';
  const g=triageUrgencyRank(guess),a=triageUrgencyRank(answer);
  if(g==null||a==null)return 'WRONG';
  return g>a?'OVER':'UNDER';
}
function latestEventByPrefix(p,prefixes){
  return (p.events||[]).filter(function(e){return prefixes.some(function(prefix){return e.type.indexOf(prefix)===0;});}).sort(function(a,b){return b.t-a.t;})[0]||null;
}
function debriefTriageRecords(field){
  const upper=field==='primary'?'PRIMARY':'SECONDARY';
  return STATE.patients.filter(function(p){return !!p[field];}).map(function(p){
    const caseObj=findCase(STATE.cases,p.id)||{};
    const event=latestEventByPrefix(p,[upper+'_CLASSIFY '])||latestEventByPrefix(p,[upper+'_SECONDARY',upper+'_TX',upper+'_DISCHARGE']);
    return {patient:p,guess:p[field],answer:caseObj[field],result:triageDecisionResult(p[field],caseObj[field]),by:event&&event.by||'—'};
  });
}
function treatmentItemFromEvent(type){
  if(type.indexOf('TRIAGE_TX_START ')===0)return type.split(' ').slice(2).join(' ');
  if(type.indexOf('TX_START ')===0)return type.slice(9);
  return null;
}
function debriefTreatmentRecords(){
  const rows=[];
  STATE.patients.forEach(function(p){
    const required=(findCase(STATE.cases,p.id)||{}).reqTx||[];
    (p.events||[]).forEach(function(e){
      const item=treatmentItemFromEvent(e.type);
      if(item)rows.push({patient:p,item:item,appropriate:required.indexOf(item)>-1,by:e.by||'—'});
    });
  });
  return rows;
}
function dispatchedVehicleFromType(type){
  if(type.indexOf('DISPATCH ')!==0)return '';
  return type.slice(9).split(' ')[0];
}
function debriefVehicleRecords(){
  return STATE.patients.map(function(p){
    const event=latestEventByPrefix(p,['DISPATCH ']);
    if(!event)return null;
    const vehicle=dispatchedVehicleFromType(event.type)||p.vehicle||'';
    const required=requiredVehicleFor(findCase(STATE.cases,p.id));
    return {patient:p,vehicle:vehicle,required:required,appropriate:!required||vehicleType(vehicle)===required,by:event.by||'—'};
  }).filter(Boolean);
}
function actorBreakdown(records){
  const counts={};
  records.forEach(function(r){const by=r.by||'—';counts[by]=(counts[by]||0)+1;});
  const names=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||a.localeCompare(b);});
  return names.length?names.map(function(name){return esc(name)+' '+counts[name];}).join(' · '):'ไม่มี';
}
function percentOf(part,total){return total?round1(part*100/total)+'%':'—';}
function debriefEventCategory(type){
  if(type==='GAME_START'||type==='GAME_END')return 'GAME';
  if(type.indexOf('PRIMARY_')===0||type==='REGISTERED')return 'PRIMARY';
  if(type.indexOf('SECONDARY_')===0)return 'SECONDARY';
  if(type.indexOf('TX_')>-1||type.indexOf('TREATMENT')>-1)return 'TREATMENT';
  return 'TRANSFER';
}
function eventCorrectness(entry){
  const p=entry.patient,type=entry.type||'';
  if(!p)return null;
  const caseObj=findCase(STATE.cases,p.id)||{};
  if(type.indexOf('PRIMARY_CLASSIFY ')===0){
    const result=triageDecisionResult(type.slice(17),caseObj.primary);
    return {ok:result==='CORRECT',text:result==='CORRECT'?'Primary Triage ถูกต้อง ✅':'Primary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
  }
  if(type.indexOf('SECONDARY_CLASSIFY ')===0){
    const result=triageDecisionResult(type.slice(19),caseObj.secondary);
    return {ok:result==='CORRECT',text:result==='CORRECT'?'Secondary Triage ถูกต้อง ✅':'Secondary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
  }
  /* Compatibility for games recorded before separate CLASSIFY events existed.
     Judge the legacy send event only when no classification event is present,
     so new timelines do not display the same evaluation twice. */
  if(type.indexOf('PRIMARY_')===0){
    const hasClassify=(p.events||[]).some(function(e){return e.type.indexOf('PRIMARY_CLASSIFY ')===0;});
    if(!hasClassify){
      const result=triageDecisionResult(p.primary,caseObj.primary);
      return {ok:result==='CORRECT',text:result==='CORRECT'?'Primary Triage ถูกต้อง ✅':'Primary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
    }
  }
  if(type.indexOf('SECONDARY_')===0){
    const hasClassify=(p.events||[]).some(function(e){return e.type.indexOf('SECONDARY_CLASSIFY ')===0;});
    if(!hasClassify){
      const result=triageDecisionResult(p.secondary,caseObj.secondary);
      return {ok:result==='CORRECT',text:result==='CORRECT'?'Secondary Triage ถูกต้อง ✅':'Secondary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
    }
  }
  const item=treatmentItemFromEvent(type);
  if(item){
    const appropriate=(caseObj.reqTx||[]).indexOf(item)>-1;
    return {ok:appropriate,text:appropriate?'Treatment เหมาะสม ✅':'Treatment ไม่ตรง Required Tx ❌'};
  }
  if(type.indexOf('VEHICLE_SELECTED ')===0||type.indexOf('DISPATCH ')===0){
    const vehicle=type.indexOf('VEHICLE_SELECTED ')===0?type.slice(17):dispatchedVehicleFromType(type);
    const required=requiredVehicleFor(caseObj);
    const appropriate=!required||vehicleType(vehicle)===required;
    return {ok:appropriate,text:appropriate?'เลือกรถเหมาะสม ✅':'เลือกรถไม่เหมาะสม ❌ (ต้องการ '+required+')'};
  }
  return null;
}
function gmTabDebrief(){
  const elapsed=elapsedMinutes(STATE.gc);
  const entries=buildMasterTimeline(elapsed);
  const primaryRecords=debriefTriageRecords('primary'),secondaryRecords=debriefTriageRecords('secondary');
  const primaryCorrect=primaryRecords.filter(function(r){return r.result==='CORRECT';});
  const secondaryCorrect=secondaryRecords.filter(function(r){return r.result==='CORRECT';});
  const allTriage=primaryRecords.concat(secondaryRecords);
  const over=allTriage.filter(function(r){return r.result==='OVER';});
  const under=allTriage.filter(function(r){return r.result==='UNDER';});
  const treatmentRecords=debriefTreatmentRecords(),treatmentGood=treatmentRecords.filter(function(r){return r.appropriate;});
  const vehicleRecords=debriefVehicleRecords(),vehicleGood=vehicleRecords.filter(function(r){return r.appropriate;});
  const dead=STATE.patients.filter(function(p){return patientIsDead(p,elapsed)||String(p.closedReason||'').indexOf('DEAD')===0;});
  const players=uniq(entries.map(function(e){return e.by;}).filter(function(name){return name&&name!=='SYSTEM'&&name!=='HOSPITAL';}).concat(Object.keys(STATE.roster))).sort();
  if(STATE.debriefPlayerFilter!=='ALL'&&players.indexOf(STATE.debriefPlayerFilter)<0)STATE.debriefPlayerFilter='ALL';
  const categoryFilters=STATE.debriefCategoryFilters||{PRIMARY:true,SECONDARY:true,TREATMENT:true,TRANSFER:true};
  const filtered=entries.filter(function(e){
    const playerOk=STATE.debriefPlayerFilter==='ALL'||e.by===STATE.debriefPlayerFilter;
    const category=debriefEventCategory(e.type);
    return playerOk&&(category==='GAME'||categoryFilters[category]);
  });
  const playerButtons='<button class="tab '+(STATE.debriefPlayerFilter==='ALL'?'active':'')+'" data-act="debriefFilter" data-player="ALL">ผู้เล่นทั้งหมด</button>'
    +players.map(function(name){return '<button class="tab '+(STATE.debriefPlayerFilter===name?'active':'')+'" data-act="debriefFilter" data-player="'+esc(name)+'">'+esc(name)+'</button>';}).join('');
  const allCategories=categoryFilters.PRIMARY&&categoryFilters.SECONDARY&&categoryFilters.TREATMENT&&categoryFilters.TRANSFER;
  const categoryLabels={PRIMARY:'Primary Triage',SECONDARY:'Secondary Triage',TREATMENT:'Treatment',TRANSFER:'Transfer / Hospital'};
  const categoryButtons='<button class="tab '+(allCategories?'active':'')+'" data-act="debriefCategory" data-category="ALL">Overall</button>'
    +Object.keys(categoryLabels).map(function(key){return '<button class="tab '+(categoryFilters[key]?'active':'')+'" data-act="debriefCategory" data-category="'+key+'">'+categoryLabels[key]+'</button>';}).join('');
  const rows=filtered.map(function(e){
    const evaluation=eventCorrectness(e);
    return '<div class="timeline-event '+timelineCategory(e.type)+'"><div class="timeline-time">'+timelineClock(e.t)+' <span class="hint">(+'+fmtClock(e.t)+')</span></div>'
      +'<div class="timeline-desc">'+esc(timelineDescription(e))+'</div>'
      +(evaluation?'<div><span class="eval-badge '+(evaluation.ok?'good':'bad')+'">'+esc(evaluation.text)+'</span></div>':'')
      +'<div class="timeline-meta">'+(e.by?'ดำเนินการโดย '+esc(e.by):'ระบบ')+(e.patient?' · Patient No. '+esc(e.patient.id):'')+'</div></div>';
  }).join('');
  const endText=STATE.gc.status==='ENDED'&&STATE.gc.endedElapsed!=null?timelineDateTime(STATE.gc.endedElapsed):'เกมยังไม่จบ';
  return '<div class="grid cols-4">'
    +statCard('Primary Triage ถูก',percentOf(primaryCorrect.length,primaryRecords.length)+'<div class="summary-detail">'+primaryCorrect.length+'/'+primaryRecords.length+' ครั้ง</div>')
    +statCard('Secondary Triage ถูก',percentOf(secondaryCorrect.length,secondaryRecords.length)+'<div class="summary-detail">'+secondaryCorrect.length+'/'+secondaryRecords.length+' ครั้ง</div>')
    +statCard('Overtriage',over.length+'<div class="summary-detail">โดย '+actorBreakdown(over)+'</div>')
    +statCard('Undertriage',under.length+'<div class="summary-detail">โดย '+actorBreakdown(under)+'</div>')
    +'</div><div class="grid cols-3 section-gap">'
    +statCard('Treatment เหมาะสม',percentOf(treatmentGood.length,treatmentRecords.length)+'<div class="summary-detail">'+treatmentGood.length+'/'+treatmentRecords.length+' รายการ</div>')
    +statCard('เลือกรถเหมาะสม',percentOf(vehicleGood.length,vehicleRecords.length)+'<div class="summary-detail">'+vehicleGood.length+'/'+vehicleRecords.length+' ราย</div>')
    +statCard('Dead',dead.length+' · '+percentOf(dead.length,STATE.patients.length)+'<div class="summary-detail">'+(dead.length?'No. '+dead.map(function(p){return esc(p.id);}).join(', '):'ไม่มี')+'</div>')
    +'</div><div class="card section-gap"><div class="flexrow" style="justify-content:space-between;"><div><h3 style="margin-bottom:3px;">Master Event Timeline</h3><div class="hint">เริ่ม '+(STATE.gc.startTime?timelineDateTime(0):'—')+' · จบ '+endText+' · ทั้งหมด '+entries.length+' เหตุการณ์</div></div></div>'
    +'<div class="timeline-filter-row"><div class="timeline-filter-label">กรองตาม Player</div><div class="timeline-filter">'+playerButtons+'</div></div>'
    +'<div class="timeline-filter-row"><div class="timeline-filter-label">กรองตามประเภทงาน · เปิด/ปิดร่วมกับ Player ได้</div><div class="timeline-filter">'+categoryButtons+'</div></div>'
    +'<div class="master-timeline">'+(rows||'<div class="zone-empty">ยังไม่มีเหตุการณ์ในตัวกรองนี้</div>')+'</div></div>';
}

function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }

async function handleClick(el){
  const act = el.dataset.act;
  if(act==='join'){
    const name = val('joinName');
    const asGM = document.getElementById('joinAsGM').checked;
    const asCommander = document.getElementById('joinAsCommander').checked;
    const gmPassword = val('joinGMPassword');
    await joinAsPlayer(name, asGM, asCommander, gmPassword);
    return;
  }
  if(act==='leaveJoin'){
    await leaveCurrentPlayer();
    return;
  }
  if(act==='debriefFilter'){ STATE.debriefPlayerFilter=el.dataset.player||'ALL'; render(true); return; }
  if(act==='debriefCategory'){
    const key=el.dataset.category;
    if(key==='ALL')STATE.debriefCategoryFilters={PRIMARY:true,SECONDARY:true,TREATMENT:true,TRANSFER:true};
    else if(['PRIMARY','SECONDARY','TREATMENT','TRANSFER'].indexOf(key)>-1){
      STATE.debriefCategoryFilters=Object.assign({PRIMARY:true,SECONDARY:true,TREATMENT:true,TRANSFER:true},STATE.debriefCategoryFilters||{});
      STATE.debriefCategoryFilters[key]=!STATE.debriefCategoryFilters[key];
    }
    render(true);return;
  }
  if(act==='gmTab'){STATE.gmTab=el.dataset.tab;saveLocalSession();render(true);return;}
  if(act==='gmStart'){ await gmStartGame(); return; }
  if(act==='gmEnd'){ await gmEndGame(); return; }
  if(act==='gmReset'){ if(confirm('ยืนยัน Reset เกม? ข้อมูลผู้ป่วยทั้งหมดจะถูกลบ')) await gmResetGame(); return; }
  if(act==='sceneImport'){ window.SceneApp && window.SceneApp.triggerImport(); return; }
  if(act==='sceneExport'){ window.SceneApp && window.SceneApp.exportFile(); return; }
  if(act==='sceneSkip'){
    if(!confirm('ข้ามขั้นตอน Scene Setup? เกมจะใช้รายชื่อ ความจุ และระยะทางโรงพยาบาลที่กรอกเองในแท็บทรัพยากร')) return;
    const scene = Object.assign({}, DEFAULT_SCENE, {skipped:true});
    await kvSet(KEYS.scene, scene); STATE.scene = scene;
    document.getElementById('statusText') && (document.getElementById('statusText').textContent = 'ข้ามขั้นตอนนี้แล้ว — ผู้เล่นเริ่มเกมได้');
    render(true);
    return;
  }
  if(act==='scenePublish'){
    const data = window.SceneApp && window.SceneApp.serialize();
    const tents = data && data.tents ? data.tents : [];
    const mapHospitals = tents.filter(function(t){return t.typeId==='hospital' && String(t.name||'').trim();}).map(function(t){
      const name=String(t.name).trim();
      const linked=(data.routes||[]).filter(function(r){return r.linkedHospitalName===name;});
      const hub=tents.find(function(x){return x.typeId==='loading';})||tents.find(function(x){return x.typeId==='incident';})||tents.find(function(x){return x.typeId==='command';});
      const fallback=hub ? (haversineKm(hub.lat,hub.lng,t.lat,t.lng)/AMBULANCE_FALLBACK_KMH)*60 : 0;
      function routeBest(direction){
        const vals=linked.filter(function(r){return r.direction===direction||r.direction==='both';}).map(routeMinutes).filter(function(v){return v!=null;});
        return vals.length?Math.min.apply(null,vals):fallback;
      }
      const outboundMin=routeBest('to');
      const returnMin=routeBest('from');
      return {name:name,redCap:Number(t.redCap)||0,yellowCap:Number(t.yellowCap)||0,greenCap:Number(t.greenCap)||0,redUsed:0,yellowUsed:0,greenUsed:0,outboundMin:Number(outboundMin.toFixed(1)),returnMin:Number(returnMin.toFixed(1)),distanceMin:Number(outboundMin.toFixed(1))};
    });
    const scene = {published:true, publishedAt:Date.now(), skipped:false, data: data||null};
    await kvSet(KEYS.scene, scene); await kvSet(KEYS.hospitals,mapHospitals);
    STATE.scene = scene; STATE.hospitals=mapHospitals;
    const st = document.getElementById('statusText');
    if(st) st.textContent = 'เผยแพร่สำเร็จ — ใช้โรงพยาบาลจาก Map '+mapHospitals.length+' แห่ง';
    render(true);
    return;
  }
  if(act==='gmSaveConfig'){
    await gmUpdateConfig({
      maxGameMin: Number(val('cfgMaxMin'))||60,
      transitSpeeds: {
        walkKmh: Number(val('cfgWalkKmh'))||4,
        carryKmh: Number(val('cfgCarryKmh'))||3
      }
    });
    toast('บันทึกการตั้งค่าแล้ว','ok');
    return;
  }
  if(act==='gmRemove'){ await gmRemovePlayer(el.dataset.name); return; }
  if(act==='selfCommander'){ await gmAssignStation(STATE.me.name,'COMMANDER'); return; }
  if(act==='gmAddVehicle'){ await gmAddVehicle(val('newVehicleName'),val('newVehicleType')); return; }
  if(act==='gmRemoveVehicle'){ await gmRemoveVehicle(el.dataset.vehicle); return; }
  if(act==='gmDeleteCase'){ if(confirm('ลบเคส #'+el.dataset.id+' ?')) await gmDeleteCase(el.dataset.id); return; }
  if(act==='gmAddCaseBtn'){
    const id = val('ncId').trim();
    if(!id){ toast('กรอก Patient ID','err'); return; }
    const reqTx = [val('ncReq1'), val('ncReq2'), val('ncReq3')].filter(Boolean);
    await gmAddCase({
      id: id, canWalk: val('ncWalk'), reqTx: reqTx,
      timeLimit: Number(val('ncLimit'))||30,
      primary: val('ncPrimary'), secondary: val('ncSecondary'),
      dispo: val('ncDispo'), vehicle: val('ncVehicle')||null
    });
    return;
  }
  if(act==='gmSaveResource'){
    const item = el.dataset.item;
    await gmUpdateResource(item, {
      stock: Number(val('res_stock_'+item))||0,
      durationSec: Number(val('res_dur_'+item))||5
    });
    return;
  }
  if(act==='gmAddResource'){
    await gmAddResource(val('newResourceName'),val('newResourceStock'),val('newResourceDuration'));
    return;
  }
  if(act==='gmAddHospital'){
    const out=Math.max(0,Number(val('newHospOut'))||0), ret=Math.max(0,Number(val('newHospReturn'))||0);
    await gmAddHospital({name:val('newHospName'),redCap:Math.max(0,Number(val('newHospRed'))||0),yellowCap:Math.max(0,Number(val('newHospYellow'))||0),greenCap:Math.max(0,Number(val('newHospGreen'))||0),redUsed:0,yellowUsed:0,greenUsed:0,outboundMin:out,returnMin:ret,distanceMin:out});
    return;
  }
  if(act==='gmDeleteHospital'){
    const i=Number(el.dataset.index), h=STATE.hospitals[i]; if(!h)return;
    if(confirm('ลบโรงพยาบาล '+h.name+' ?')) await gmDeleteHospital(h.name);
    return;
  }
  if(act==='gmSaveHospital'){
    const i=Number(el.dataset.index), h=STATE.hospitals[i]; if(!h)return;
    await gmRenameHospital(h.name,val('hosp_name_'+i),{
      redCap:Number(val('hosp_red_'+i))||0,
      yellowCap:Number(val('hosp_yellow_'+i))||0,
      greenCap:Number(val('hosp_green_'+i))||0,
      outboundMin:Number(val('hosp_out_'+i))||0,
      returnMin:Number(val('hosp_return_'+i))||0,
      distanceMin:Number(val('hosp_out_'+i))||0
    });
    return;
  }
  if(act==='patientFocus'){
    const key=el.dataset.key,inputId=el.dataset.input;
    const id=normU(val(inputId));
    if(!id){toast('กรอก Patient No. ก่อน','err');return;}
    const p=visiblePatientsForFocusKey(key).find(function(x){return normU(x.id)===id;});
    if(!p){toast('ไม่พบผู้ป่วย No. '+id+' ในโซนนี้','err');return;}
    const oldId=STATE.ui.focused[key];
    if(oldId&&normU(oldId)!==id){await releasePatientLocks([oldId]);setFocusedPatient(key,null);}
    if(!await claimPatientLock(id,key))return;
    setFocusedPatient(key,id);render(true);return;
  }
  if(act==='patientFocusClear'){
    const oldId=STATE.ui.focused[el.dataset.key];
    if(oldId)await releasePatientLocks([oldId]);
    setFocusedPatient(el.dataset.key,null);render(true);return;
  }
  if(act==='primaryRegister'){await primaryRegister(val(el.dataset.input||'primaryIdInput'));const inp=document.getElementById(el.dataset.input||'primaryIdInput');if(inp)inp.value='';return;}
  if(act==='primarySet'){ await primarySetField(el.dataset.pid, el.dataset.field, el.dataset.value); return; }
  if(act==='primarySend'){ await primarySend(el.dataset.pid, el.dataset.dest); return; }
  if(act==='secondarySet'){ await secondarySetField(el.dataset.pid, el.dataset.field, el.dataset.value); return; }
  if(act==='secondarySend'){ await secondarySend(el.dataset.pid, el.dataset.dest); return; }
  if(act==='txCancel'){ if(confirm('ยกเลิก Treatment นี้และคืนของเข้า stock?')) await txCancelItem(el.dataset.pid,el.dataset.slot); return; }
  if(act==='txDispo'){ await txSetDispo(el.dataset.pid, el.dataset.value); return; }
  if(act==='dispatchSend'){ await dispatchSend(el.dataset.vehicle); return; }
  if(act==='transferVehicleLocal'){
    await releasePatientLocks((STATE.ui.transfer.patientIds||[]).slice());
    STATE.ui.transfer.vehicle=el.dataset.vehicle||null;
    STATE.ui.transfer.patientIds=[];
    saveLocalSession();render(true);return;
  }
  if(act==='transferVehicleClear'){
    await releasePatientLocks((STATE.ui.transfer.patientIds||[]).slice());
    STATE.ui.transfer={vehicle:null,patientIds:[],hospital:null};
    saveLocalSession();render(true);return;
  }
  if(act==='transferPatientLocal'){
    if(!STATE.ui.transfer.vehicle){toast('เลือกรถก่อน','err');return;}
    const id=normU(el.dataset.pid),ids=(STATE.ui.transfer.patientIds||[]).slice(),i=ids.indexOf(id);
    if(i>-1){ids.splice(i,1);await releasePatientLocks([id]);}
    else{
      if(!await claimPatientLock(id,'TRANSFER'))return;
      ids.push(id);
    }
    STATE.ui.transfer.patientIds=ids;saveLocalSession();render(true);return;
  }
  if(act==='transferSendBatch'){
    const ui=STATE.ui.transfer;
    const sent=await dispatchSend(ui.vehicle,(ui.patientIds||[]).slice(),ui.hospital);
    if(sent){STATE.ui.transfer={vehicle:null,patientIds:[],hospital:null};saveLocalSession();render(true);}
    return;
  }
  if(act==='gmAssign'){ /* handled on change */ return; }
}

async function handleChange(el){
  const act = el.dataset.act;
  if(act==='toggleGMPassword'){
    const wrap = document.getElementById('gmPasswordWrap');
    const passwordInput = document.getElementById('joinGMPassword');
    const commanderCheckbox = document.getElementById('joinAsCommander');
    if(wrap) wrap.style.display = el.checked ? 'block' : 'none';
    if(el.checked){
      if(commanderCheckbox) commanderCheckbox.checked = false;
      if(passwordInput) passwordInput.focus();
    }else if(passwordInput){
      passwordInput.value = '';
    }
    return;
  }
  if(act==='toggleCommanderRole'){
    if(el.checked){
      const gmCheckbox = document.getElementById('joinAsGM');
      const wrap = document.getElementById('gmPasswordWrap');
      const passwordInput = document.getElementById('joinGMPassword');
      if(gmCheckbox) gmCheckbox.checked = false;
      if(wrap) wrap.style.display = 'none';
      if(passwordInput) passwordInput.value = '';
    }
    return;
  }
  if(act==='gmAssign'){ await gmAssignStation(el.dataset.name, el.value); return; }
  if(act==='gmTriageResourceToggle'){ await gmUpdateResource(el.dataset.item,{triageAllowed:el.checked}); return; }
  if(act==='fastTreatmentToggle'){ await gmSetFastTreatment(el.checked); return; }
  if(act==='hospitalTreatmentToggle'){ await gmSetHospitalTreatment(el.checked); return; }
  if(act==='transferHospitalLocal'){STATE.ui.transfer.hospital=el.value||null;saveLocalSession();render(true);return;}
  if(act==='transferSet'){ await transferAssign(el.dataset.pid, el.dataset.field, el.value); return; }
  if(act==='txNote'){ await txSetNote(el.dataset.pid,el.value); return; }
  if(act==='txDx'){ await txSetDx(el.dataset.pid,el.value); return; }
  if(act==='txSelect'){
    if(!el.value) return;
    await txStartItem(el.dataset.pid, Number(el.dataset.slot), el.value, 'TX');
    return;
  }
  if(act==='triageTxSelect'){
    if(!el.value) return;
    await txStartItem(el.dataset.pid, Number(el.dataset.slot), el.value, el.dataset.stage);
    return;
  }
  if(act==='mapSettingToggle'){
    const keyByCheckboxId={cfgUseMap:'useMap', cfgDistSecondary:'distSecondary', cfgDistTreatment:'distTreatment', cfgDistTransfer:'distTransfer'};
    const key=keyByCheckboxId[el.dataset.key];
    if(!key) return;
    await gmSetMapSetting(key, el.checked);
    return;
  }
}

function boot(){
  fbInit();
  const svToggle = document.getElementById('sceneViewerToggle');
  if(svToggle){
    svToggle.addEventListener('click', function(){
      const host = document.getElementById('sceneViewerHost');
      if(host) host.classList.toggle('collapsed');
    });
  }
  const app = document.getElementById('app');
  app.addEventListener('click', function(e){
    const el = e.target.closest('[data-act]');
    if(!el || el.disabled) return;
    handleClick(el);
  });
  app.addEventListener('change', function(e){
    const el = e.target.closest('[data-act]');
    if(!el) return;
    handleChange(el);
  });
  app.addEventListener('focusout',function(){
    if(backgroundRenderPending)scheduleBackgroundRender();
  });
  app.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    const el = e.target.closest('[data-enter-act]');
    if(!el) return;
    e.preventDefault();
    const act = el.dataset.enterAct;
    if(act==='join') handleClick({dataset:{act:'join'}});
    else if(act==='primaryRegister') handleClick({dataset:{act:'primaryRegister',input:el.id}});
    else if(act==='patientFocus')handleClick({dataset:{act:'patientFocus',key:el.dataset.focusKey,input:el.id}});
  });
  const restored=restoreLocalSession();
  render(true);
  if(fbReady){
    fbSelfTest();
    if(restored&&STATE.me.name){identitySession+=1;startPolling();}
  }
}

boot();
})();

</script>
