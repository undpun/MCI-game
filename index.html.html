<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MCI Command — Mass Casualty Incident Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
<style>
:root{
  --bg:#0B0F14;
  --bg-panel:#121821;
  --bg-panel-2:#1A222D;
  --line:#26313F;
  --line-soft:#1D2732;
  --ink:#E7EDF3;
  --ink-dim:#8FA1B3;
  --ink-faint:#5E6E7E;
  --accent:#2FD3C7;
  --accent-dim:#1B7A73;
  --red:#E5484D;
  --red-dim:#3A1719;
  --yellow:#F3A712;
  --yellow-dim:#3A2C0C;
  --green:#3FBF6F;
  --green-dim:#12301E;
  --black-tri:#9BA3AE;
  --black-dim:#22262B;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(47,211,199,.07), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(229,72,77,.05), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-dim);color:#fff;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* ---------- scaffold ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;
  background:linear-gradient(180deg, var(--bg-panel), rgba(18,24,33,.85));
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(6px);
}
.brand{
  font-family:var(--font-display);
  font-weight:700;
  font-size:15px;
  letter-spacing:.02em;
  color:var(--ink);
  display:flex;align-items:center;gap:8px;
  white-space:nowrap;
}
.brand .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 3px rgba(47,211,199,.15);
}
.clockwrap{
  display:flex;align-items:center;gap:10px;
  font-family:var(--font-mono);
  margin-left:auto;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);
  background:var(--bg-panel-2);
  font-size:12px;color:var(--ink-dim);
  white-space:nowrap;
}
.pill b{color:var(--ink);font-weight:600;}
.pill.status-RUNNING{border-color:var(--accent-dim);color:var(--accent);}
.pill.status-ENDED{border-color:#4a2b2b;color:var(--red);}
.pill.status-NOT_STARTED{border-color:var(--line);color:var(--ink-faint);}
.timerbig{
  font-family:var(--font-mono);
  font-size:22px;font-weight:600;
  color:var(--ink);
  letter-spacing:.03em;
  padding:2px 4px;
  position:relative;
}
.sweepbar{
  height:2px;width:100%;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size:200% 100%;
  animation:sweep 2.6s linear infinite;
  opacity:.7;
}
@keyframes sweep{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

.mebadge{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--ink-dim);
}
.mebadge b{color:var(--ink);}
.switchbtn{
  background:none;border:1px solid var(--line);color:var(--ink-dim);
  border-radius:7px;padding:4px 9px;font-size:11px;cursor:pointer;
}
.switchbtn:hover{border-color:var(--accent-dim);color:var(--accent);}

.main{
  flex:1;
  width:100%;
  max-width:1360px;
  margin:0 auto;
  padding:20px 18px 60px;
}

/* ---------- generic components ---------- */
.card{
  background:var(--bg-panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
}
.card + .card{margin-top:14px;}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}
}

h1,h2,h3,h4{font-family:var(--font-display);margin:0 0 10px;color:var(--ink);}
h1{font-size:26px;font-weight:700;}
h2{font-size:18px;font-weight:600;}
h3{font-size:14px;font-weight:600;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;}
p{color:var(--ink-dim);line-height:1.55;margin:0 0 10px;}

.label{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:block;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  color:var(--ink);
  padding:9px 16px;
  border-radius:8px;
  font-size:13px;font-weight:600;
  cursor:pointer;
  transition:border-color .15s, background .15s, transform .05s;
}
.btn:hover{border-color:var(--accent-dim);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04211E;}
.btn.primary:hover{background:#3EE6D9;}
.btn.danger{background:var(--red);border-color:var(--red);color:#2B0708;}
.btn.danger:hover{background:#ff5b60;}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.block{width:100%;}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:6px;}

input[type=text],input[type=number],select,textarea{
  width:100%;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--ink);
  padding:9px 11px;
  border-radius:7px;
  font-size:13.5px;
  outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,211,199,.12);}
select{cursor:pointer;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:11px;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.05em;font-weight:600;
  padding:8px 10px;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-hover:hover td{background:rgba(255,255,255,.02);}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.02em;
  border:1px solid transparent;
  white-space:nowrap;
}
.badge.RED{background:var(--red-dim);color:var(--red);border-color:#5a2427;}
.badge.YELLOW{background:var(--yellow-dim);color:var(--yellow);border-color:#5a4413;}
.badge.GREEN{background:var(--green-dim);color:var(--green);border-color:#1f5c39;}
.badge.BLACK{background:var(--black-dim);color:var(--black-tri);border-color:#3a3f46;}
.badge.ok{background:var(--green-dim);color:var(--green);}
.badge.bad{background:var(--red-dim);color:var(--red);}
.badge.wait{background:var(--yellow-dim);color:var(--yellow);}
.badge.neutral{background:var(--bg-panel-2);color:var(--ink-dim);border-color:var(--line);}
.badge.dead{background:#000;color:var(--red);border-color:var(--red);}

.pulse-dot{
  width:7px;height:7px;border-radius:50%;background:var(--yellow);
  animation:pulse 1.2s ease-in-out infinite;display:inline-block;
}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(243,167,18,.5);}50%{opacity:.5;box-shadow:0 0 0 4px rgba(243,167,18,0);}}

.stripe-RED{border-left:3px solid var(--red);}
.stripe-YELLOW{border-left:3px solid var(--yellow);}
.stripe-GREEN{border-left:3px solid var(--green);}
.stripe-BLACK{border-left:3px solid var(--black-tri);}

.patient-card{
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:13px 14px;
  margin-bottom:10px;
}
.patient-card .pidrow{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;
}
.pid{font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--ink);}
.subrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}

.empty{
  text-align:center;padding:40px 20px;color:var(--ink-faint);
  border:1px dashed var(--line);border-radius:10px;
}
.empty .big{font-size:32px;margin-bottom:8px;}

.toastwrap{
  position:fixed;bottom:18px;right:18px;z-index:100;
  display:flex;flex-direction:column;gap:8px;
  max-width:360px;
}
.toast{
  background:var(--bg-panel-2);border:1px solid var(--line);
  border-left:3px solid var(--accent);
  padding:10px 14px;border-radius:8px;font-size:13px;color:var(--ink);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  animation:toastin .2s ease;
}
.toast.err{border-left-color:var(--red);}
.toast.ok{border-left-color:var(--green);}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tab{
  padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg-panel);color:var(--ink-dim);font-size:13px;font-weight:600;
  cursor:pointer;
}
.tab.active{background:var(--accent);color:#04211E;border-color:var(--accent);}

.station-hero{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.station-hero .titlewrap .eyebrow{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;
}
.capbar{
  display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);
}
.capbar .capfill{width:70px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--line);}
.capbar .capfill i{display:block;height:100%;background:var(--accent);}

/* GM live zone board */
.zone-flow-board{display:grid;grid-template-columns:minmax(170px,1fr) minmax(170px,1fr) minmax(210px,1.25fr) minmax(190px,1fr);gap:12px;align-items:stretch;}
.zone-flow-column{display:flex;flex-direction:column;gap:10px;min-width:0;}
.zone-box{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:190px;display:flex;flex-direction:column;}
.zone-box.compact{min-height:148px;}
.zone-box.red{border-color:rgba(239,68,68,.5);}.zone-box.yellow{border-color:rgba(234,179,8,.5);}.zone-box.green{border-color:rgba(34,197,94,.5);}
.zone-box-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid var(--line-soft);}
.zone-box-title{font-size:12px;font-weight:800;letter-spacing:.035em;text-transform:uppercase;}
.zone-box-count{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;}
.zone-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:10px 6px;padding:12px 0;align-content:start;min-height:72px;}
.pixel-patient{text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 1px;}
.pixel-human{--pc:#7c8494;position:relative;width:40px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--pc);border-radius:8px;background:color-mix(in srgb,var(--pc) 18%,var(--bg-panel));overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.25);}
.pixel-human:before{content:"🧍";font-size:29px;line-height:1;transform:translateY(1px);filter:saturate(.9);}
.pixel-human:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--pc);}
.pixel-human.gray{--pc:#7c8494}.pixel-human.gray:before{filter:grayscale(1);}.pixel-human.RED{--pc:#ef4444}.pixel-human.YELLOW{--pc:#eab308}.pixel-human.GREEN{--pc:#22c55e}.pixel-human.BLACK{--pc:#111827;}
.pixel-label{position:relative;z-index:1;font-family:var(--font-mono);font-size:10px;line-height:1.2;font-weight:800;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:4px;padding:2px 4px;}
.pixel-sub{font-size:9px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.pixel-zone-time{font-family:var(--font-mono);font-size:8px;line-height:1.25;color:var(--accent);white-space:nowrap;text-align:center;margin-top:2px;}
.player-census{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;}
.player-census-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.player-census-title{font-size:12px;font-weight:800;letter-spacing:.035em;text-transform:uppercase;}
.player-census-count{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
.anonymous-people{display:flex;flex-wrap:wrap;gap:9px;min-height:44px;align-items:flex-start;}
.anonymous-person{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-width:44px;}
.patient-census-select{appearance:none;border:1px solid transparent;border-radius:8px;background:transparent;color:inherit;font:inherit;padding:5px 4px;cursor:pointer;transition:background .12s,border-color .12s,transform .12s;}
.patient-census-select:hover{background:rgba(47,211,199,.08);border-color:rgba(47,211,199,.32);transform:translateY(-1px);}
.patient-census-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.patient-census-select.active{background:rgba(47,211,199,.12);border-color:var(--accent);}
.patient-census-select.locked:not(.active){border-color:rgba(234,179,8,.28);}
.anonymous-person .pixel-human{width:34px;height:38px;box-shadow:none;}
.anonymous-person .pixel-human:before{font-size:25px;}
.anonymous-person .pixel-label{font-size:9px;max-width:58px;}
.patient-lock-label{font-size:8px;line-height:1.25;color:var(--yellow);max-width:84px;text-align:center;white-space:normal;}
.patient-lock-label.mine{color:var(--accent);}
.patient-search-card{margin-bottom:14px;}
.patient-search-card .search-hint{font-size:11px;color:var(--ink-faint);margin-top:7px;}
.focused-patient-empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--ink-faint);font-size:12px;}
.transfer-workflow{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(320px,1.25fr);gap:14px;align-items:start;}
.transfer-step{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:13px;}
.transfer-step-title{font-size:12px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.transfer-step-num{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#04211e;font-family:var(--font-mono);font-weight:900;font-size:11px;}
.transfer-vehicle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px 12px;align-items:end;}
.transfer-vehicle-choice{--vc:#7c8494;border:0;border-radius:8px;padding:4px 2px 7px;background:transparent;cursor:pointer;text-align:center;color:var(--ink);transition:transform .12s,filter .12s;min-width:0;}
.transfer-vehicle-choice.ALS{--vc:#ef4444}.transfer-vehicle-choice.BLS{--vc:#eab308}.transfer-vehicle-choice.BUS{--vc:#22c55e}
.transfer-vehicle-choice:hover{transform:translateY(-2px);filter:brightness(1.08);}
.transfer-vehicle-choice:disabled{cursor:not-allowed;opacity:.45;}
.transfer-vehicle-choice .vehicle-visual{margin:2px 0 0;min-height:72px;}
.transfer-vehicle-choice .vehicle-visual.BUS{min-height:110px;}
.transfer-vehicle-choice .vehicle-visual.BUS .vehicle-art{height:110px;}
.parking-vehicle-label{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:900;background:var(--bg-panel);border:1px solid color-mix(in srgb,var(--vc) 55%,var(--line));border-radius:5px;padding:3px 7px;color:var(--vc);}
.transfer-returning{margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);}
.transfer-return-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px;}
.transfer-return-card{--vc:#7c8494;border:1px solid var(--line-soft);border-radius:8px;background:var(--bg-panel);padding:8px;text-align:center;min-width:0;}
.transfer-return-card.ALS{--vc:#ef4444}.transfer-return-card.BLS{--vc:#eab308}.transfer-return-card.BUS{--vc:#22c55e}
.transfer-return-card .vehicle-visual{min-height:58px;margin:3px 0;}
.transfer-return-card .vehicle-visual.BUS{min-height:82px;}
.transfer-return-card .vehicle-visual.BUS .vehicle-art{height:82px;}
.transfer-return-phase{font-size:9px;color:var(--ink-dim);line-height:1.35;overflow-wrap:anywhere;}
.transfer-return-time{margin-top:4px;font-size:10px;font-weight:800;color:var(--accent);}
.transfer-local-note{margin-left:auto;font-size:9px;color:var(--accent);border:1px solid rgba(47,211,199,.35);background:rgba(47,211,199,.08);border-radius:999px;padding:3px 7px;font-weight:700;}
.transfer-staging{margin-top:14px;background:linear-gradient(135deg,rgba(47,211,199,.055),transparent 46%),var(--bg-panel-2);border:1px solid rgba(47,211,199,.38);border-radius:10px;padding:14px;}
.transfer-staging-layout{display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(220px,.8fr);gap:16px;align-items:start;}
.transfer-staging-vehicle{max-width:520px;margin:0 auto;}
.transfer-staging-vehicle .vehicle-name{font-size:13px;}
.transfer-staging-vehicle .vehicle-visual{min-height:126px;}
.transfer-staging-vehicle .vehicle-visual.BUS{min-height:170px;}
.transfer-staging-vehicle .vehicle-visual.BUS .vehicle-art{height:165px;}
.staging-passenger{border:0!important;color:var(--ink);cursor:pointer;font-family:inherit;}
.staging-passenger:hover .pixel-human{filter:brightness(1.12);box-shadow:0 0 0 2px var(--accent);}
.staging-placeholder{min-height:138px;border:1px dashed var(--line);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12px;text-align:center;padding:18px;}
.staging-placeholder .big{font-size:32px;margin-bottom:5px;}
.transfer-patient-row{padding:10px 0;border-top:1px solid var(--line-soft);}
.transfer-patient-row:first-child{border-top:0;padding-top:0;}
.transfer-row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.transfer-patient-grid{display:flex;flex-wrap:wrap;gap:9px;}
.transfer-patient-choice{border:1px solid transparent;border-radius:8px;padding:6px;background:transparent;color:var(--ink);cursor:pointer;min-width:108px;max-width:148px;}
.transfer-patient-choice:hover{border-color:var(--line);background:var(--bg-panel);}
.transfer-patient-choice.selected{border-color:var(--accent);background:rgba(47,211,199,.1);box-shadow:0 0 0 2px rgba(47,211,199,.12);}
.transfer-patient-choice:disabled{cursor:not-allowed;opacity:.4;}
.transfer-patient-choice .pixel-human{margin:0 auto 4px;}
.transfer-patient-choice .vp-no{display:block;font-family:var(--font-mono);font-size:9px;font-weight:800;text-align:center;}
.transfer-patient-choice .mobility{display:block;font-size:9px;color:var(--ink-faint);text-align:center;margin-top:2px;}
.transfer-patient-choice .transfer-clinical{display:block;margin-top:5px;border-top:1px solid var(--line-soft);padding-top:4px;font-size:8px;line-height:1.35;color:var(--ink-dim);text-align:left;overflow-wrap:anywhere;}
.transfer-patient-choice .transfer-lock{display:block;margin-top:4px;font-size:8px;line-height:1.25;color:var(--yellow);text-align:center;}
.transfer-clinical-list{margin-top:10px;display:grid;gap:6px;}
.transfer-clinical-item{border:1px solid var(--line-soft);border-radius:7px;background:var(--bg-panel);padding:7px 8px;font-size:10px;line-height:1.45;color:var(--ink-dim);}
.transfer-clinical-item b{color:var(--ink);font-family:var(--font-mono);}
.tx-countdown,.live-countdown{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);}

.timeline-desc{font-size:13px;margin-top:2px;line-height:1.45;}
.timeline-meta{font-size:10px;color:var(--ink-faint);margin-top:3px;}
.tx-history{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}

/* join screen */

}

  width:100%;max-width:420px;

  overflow:hidden;
}

.dotlive{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}

.hint{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.section-gap{margin-top:24px;}
.flexrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.flex1{flex:1;min-width:120px;}

/* ===================== Scene Setup (embedded map module) ===================== */
:root{

}

#scRoot .sc-body{flex:1;display:flex;min-height:0;position:relative;}
#scRoot .sc-sidebar{width:220px;flex-shrink:0;background:var(--bg-panel-2);border-right:1px solid var(--line);overflow-y:auto;}
#scRoot .sc-map{flex:1;min-width:0;background:#0d0f13;}
#scRoot .sc-footer{padding:6px 12px;background:var(--bg-panel-2);border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);display:flex;justify-content:space-between;}

.sc-tool:hover{border-color:var(--sc-line);}

.sc-search-row{display:flex;gap:8px;max-width:760px;margin:0 auto}.sc-search-row input{margin:0}.sc-search-row .btn{min-width:86px}.sc-search-results{max-height:180px;overflow:auto;margin:6px auto 0;max-width:760px;background:var(--bg-panel);border-radius:7px}.sc-search-results:empty{display:none}.sc-search-item{padding:8px 10px;border-top:1px solid var(--line-soft);font-size:11px;cursor:pointer}.sc-search-item:first-child{border-top:none}.sc-search-item:hover{background:var(--bg-panel-2)}

/* ---------- Read-only Scene Viewer (persistent floating panel) ---------- */
.sv-tent-icon, .sv-vehicle-icon{background:transparent!important;border:none!important;}
#sceneViewerHost{
  position:fixed; left:16px; right:auto; bottom:16px; z-index:1400;
  width:360px; max-width:calc(100vw - 24px);
  background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.45);

  transition:height .15s;

.comm-layout{display:grid;grid-template-columns:190px 1fr;min-height:0;flex:1;}.comm-zone-list{overflow:auto;border-right:1px solid var(--line);background:#0d141c;padding:7px;}.comm-zone-tab{position:relative;width:100%;text-align:left;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink-dim);padding:9px 34px 9px 9px;margin-bottom:4px;cursor:pointer;}.comm-zone-tab:hover,.comm-zone-tab.active{background:rgba(75,228,216,.08);border-color:rgba(75,228,216,.22);color:var(--ink);}.comm-zone-tab b{display:block;font-size:11px}.comm-zone-tab small{display:block;font-size:9px;margin-top:3px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.comm-zone-tab .comm-unread{position:absolute;right:7px;top:8px;}
.comm-thread{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1;}.comm-messages{flex:1;overflow:auto;padding:12px;background:radial-gradient(circle at 70% 0,rgba(47,211,199,.05),transparent 38%);}.comm-empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--ink-faint);font-size:12px;padding:20px;}.comm-message{max-width:86%;margin:0 0 9px;padding:8px 10px;border:1px solid var(--line-soft);border-radius:10px;background:#18222d;color:var(--ink);font-size:12px;line-height:1.45;}.comm-message.mine{margin-left:auto;background:#12312f;border-color:rgba(75,228,216,.28);}.comm-message.request{border-left:3px solid #eab308}.comm-message.urgent{border-left:3px solid #ef4444}.comm-message-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;color:var(--ink-faint);font-size:9px}.comm-kind{font-weight:800;color:#eab308}.comm-message.urgent .comm-kind{color:#f87171}
.comm-message-action{width:100%;margin-top:7px;min-height:34px}.comm-move-done{display:flex;align-items:center;gap:5px;margin-top:7px;padding:6px 8px;border:1px solid rgba(34,197,94,.3);border-radius:7px;background:rgba(34,197,94,.08);color:#86efac;font-size:10px;font-weight:800}
.comm-composer{border-top:1px solid var(--line);padding:9px;background:#121b25;}.comm-quick{display:flex;gap:5px;overflow-x:auto;padding-bottom:7px;scrollbar-width:thin}.comm-chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#17222d;color:var(--ink-dim);padding:5px 8px;font-size:10px;cursor:pointer;white-space:nowrap}.comm-chip:hover{border-color:var(--cyan);color:var(--ink)}.comm-chip.urgent{border-color:rgba(239,68,68,.55);color:#fca5a5}.comm-input-row{display:flex;gap:6px}.comm-input-row input{min-width:0;flex:1}.comm-send{flex:0 0 auto}.comm-locked{padding:10px;border:1px dashed var(--line);border-radius:8px;color:var(--ink-faint);font-size:11px;text-align:center}.comm-structured{padding:8px;margin-bottom:7px;border:1px solid rgba(234,179,8,.28);border-radius:8px;background:rgba(234,179,8,.05)}.comm-structured .grid{gap:6px}.comm-structured label{font-size:9px;color:var(--ink-faint)}.comm-structured input,.comm-structured select{padding:6px;font-size:11px}.comm-notice{padding:5px 9px;background:rgba(75,228,216,.08);color:var(--cyan);font-size:10px;border-bottom:1px solid rgba(75,228,216,.15)}
.head-zone-control{display:flex;justify-content:flex-end;align-items:center;gap:7px;margin:-5px 0 10px;min-height:30px}.head-zone-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid rgba(234,179,8,.35);border-radius:999px;background:rgba(234,179,8,.08);color:#fde68a;font-size:11px;font-weight:700}.head-zone-btn{border:1px solid rgba(234,179,8,.55);border-radius:8px;background:rgba(234,179,8,.12);color:#fde68a;padding:6px 9px;font-size:11px;cursor:pointer}.head-zone-btn:hover{background:rgba(234,179,8,.2)}
.comm-roster-actions{display:flex;align-items:center;gap:5px}.comm-roster-btn{position:relative;width:31px;height:29px;border:1px solid var(--line);border-radius:7px;background:#151f29;color:var(--ink-dim);cursor:pointer}.comm-roster-btn.head{color:#facc15;border-color:rgba(250,204,21,.5);background:rgba(250,204,21,.08)}.comm-roster-btn .comm-unread{position:absolute;right:-7px;top:-7px;min-width:17px;height:17px;font-size:9px;padding:0 4px}
@media (max-width:700px){#communicationHost{right:8px;bottom:8px}.comm-panel,.comm-panel.command-view,.comm-panel.monitor-view{position:fixed;left:8px;right:8px;bottom:62px;width:auto;max-width:none;height:min(620px,calc(100vh - 78px))}.comm-layout{grid-template-columns:120px 1fr}.comm-zone-list{padding:4px}.comm-zone-tab{padding:8px 27px 8px 6px}.comm-zone-tab small{display:none}body.comm-open #sceneViewerHost{display:none}}

/* ---------- Parking fleet status: lightweight labels + live countdown only ---------- */
.fleet-status-card{border-color:rgba(96,165,250,.34)}.fleet-status-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}.fleet-status-head h3{margin:0}.fleet-status-list{display:grid;gap:7px}.fleet-status-row{--fleet-color:#94a3b8;display:grid;grid-template-columns:minmax(92px,.8fr) minmax(190px,1.65fr) minmax(92px,.65fr);align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line-soft);border-left:3px solid var(--fleet-color);border-radius:8px;background:rgba(13,20,28,.66);font-size:11px}.fleet-status-row.ALS{--fleet-color:#ef4444}.fleet-status-row.BLS{--fleet-color:#eab308}.fleet-status-row.BUS{--fleet-color:#22c55e}.fleet-identity{display:flex;align-items:center;gap:7px;min-width:0}.fleet-type-dot{display:inline-grid;place-items:center;width:28px;height:28px;flex:0 0 auto;border-radius:7px;background:color-mix(in srgb,var(--fleet-color) 18%,transparent);color:var(--fleet-color);font-size:15px}.fleet-name{min-width:0;font:800 11px/1.2 var(--font-mono);overflow:hidden;text-overflow:ellipsis}.fleet-stage-label{font-weight:800;color:var(--ink)}.fleet-stage-detail{color:var(--ink-faint);font-size:10px;margin-top:2px}.fleet-stage-eta{justify-self:end;color:var(--cyan);font-weight:800;text-align:right}.fleet-status-row.ready .fleet-stage-eta{color:#86efac}.fleet-status-row.reserve .fleet-stage-eta{color:var(--ink-faint)}
@media (max-width:700px){.fleet-status-row{grid-template-columns:minmax(90px,.8fr) 1.3fr minmax(82px,.6fr)}.fleet-stage-detail{grid-column:2/4}.fleet-status-row>.fleet-stage-copy{display:contents}.fleet-stage-label{align-self:center}.fleet-stage-eta{grid-column:3;grid-row:1}}

/* On/off toggle switch used for game settings (map, distance calc, etc.) */
.toggle-row{display:flex;align-items:center;gap:10px;}
.toggle-switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#4b5160;border-radius:999px;transition:.15s;}
.toggle-slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.toggle-switch input:checked + .toggle-slider{background:#22c55e;}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(18px);}
.toggle-switch input:disabled + .toggle-slider{opacity:.4;cursor:not-allowed;}
.toggle-label{font-size:12.5px;color:var(--ink);}

/* ============================================================
   VISUAL RENOVATION — Emergency Command / Tactical EMS
   Performance policy: vector-only artwork, transform/opacity motion,
   and no full-screen filters or bitmap animation.
============================================================ */
:root{
  --cyan:#4BE4D8;
  --cyan-soft:rgba(75,228,216,.12);
  --cyan-line:rgba(75,228,216,.28);
  --amber:#FFB547;
  --blue:#4DA3FF;
  --panel-glass:rgba(16,23,32,.94);
  --station-accent:var(--accent);
  --station-glow:rgba(47,211,199,.09);
}
body{overflow-x:hidden;background-color:#080C12;}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(rgba(105,137,166,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(105,137,166,.028) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(to bottom,black,transparent 82%);
}
.mission-shell{min-height:100vh;position:relative;isolation:isolate;--station-accent:var(--accent);--station-glow:rgba(47,211,199,.09);}
.mission-shell::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(800px 420px at 52% -10%,var(--station-glow),transparent 68%);
}
.mission-shell.station-GM{--station-accent:#49DDD2;--station-glow:rgba(73,221,210,.10);}
.mission-shell.station-COMMANDER{--station-accent:#A78BFA;--station-glow:rgba(167,139,250,.10);}
.mission-shell.station-PRIMARY{--station-accent:#38BDF8;--station-glow:rgba(56,189,248,.10);}
.mission-shell.station-SECONDARY{--station-accent:#818CF8;--station-glow:rgba(129,140,248,.10);}
.mission-shell.station-TX_RED{--station-accent:#FF5A61;--station-glow:rgba(239,68,68,.12);}
.mission-shell.station-TX_YELLOW{--station-accent:#F6C344;--station-glow:rgba(234,179,8,.11);}
.mission-shell.station-TX_GREEN{--station-accent:#4ADE80;--station-glow:rgba(34,197,94,.10);}
.mission-shell.station-LOADING{--station-accent:#60A5FA;--station-glow:rgba(59,130,246,.11);}
.mission-shell.station-PARKING{--station-accent:#FBBF24;--station-glow:rgba(251,191,36,.10);}
.mission-shell.station-DISCHARGE{--station-accent:#94A3B8;--station-glow:rgba(148,163,184,.08);}

/* Command header */
.topbar{
  min-height:66px;padding:9px 20px;border-bottom-color:rgba(126,151,177,.2);
  background:linear-gradient(180deg,rgba(16,23,32,.98),rgba(11,16,23,.94));
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}
.brand{gap:11px;min-width:max-content;}
.brand .dot{display:none;}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--cyan-line);border-radius:9px;background:var(--cyan-soft);color:var(--station-accent);box-shadow:inset 0 0 16px rgba(255,255,255,.03);}
.brand-mark svg{width:21px;height:21px;display:block;}
.brand-copy{display:flex;flex-direction:column;line-height:1.05;}
.brand-copy strong{font-size:14px;letter-spacing:.08em;}
.brand-copy small{font:500 8px/1.2 var(--font-mono);letter-spacing:.13em;color:var(--ink-faint);margin-top:4px;}
.clockwrap{margin-left:auto;justify-content:center;}
.timerbig{font-size:25px;color:#F5FBFF;text-shadow:0 0 18px var(--station-glow);font-variant-numeric:tabular-nums;}
.pill{background:rgba(22,31,42,.78);}
.mebadge{margin-left:auto;}
.sweepbar{height:1px;background:linear-gradient(90deg,transparent,var(--station-accent),transparent);opacity:.65;}
.main{max-width:1440px;padding-top:24px;}

/* Unified surfaces and hierarchy */
.card,.player-census,.transfer-step,.zone-box,.patient-card{
  border-color:rgba(111,137,163,.22);
  box-shadow:0 12px 30px rgba(0,0,0,.12),inset 0 1px rgba(255,255,255,.018);
}
.card{background:linear-gradient(145deg,rgba(19,27,37,.97),rgba(15,22,30,.96));}
.station-hero{position:relative;padding:2px 0 11px;border-bottom:1px solid rgba(116,143,169,.15);}
.station-hero::after{content:"";position:absolute;left:0;bottom:-1px;width:92px;height:2px;background:var(--station-accent);box-shadow:0 0 16px var(--station-glow);}
.station-hero h1{display:flex;align-items:center;gap:10px;font-size:27px;letter-spacing:-.02em;}
.station-title-icon{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid color-mix(in srgb,var(--station-accent) 40%,var(--line));background:color-mix(in srgb,var(--station-accent) 10%,var(--bg-panel));color:var(--station-accent);}
.station-title-icon svg{width:22px;height:22px;display:block;}
.station-hero .eyebrow{color:var(--station-accent)!important;}
.btn{min-height:38px;border-color:rgba(120,147,174,.26);background:linear-gradient(180deg,#1B2633,#151E29);box-shadow:inset 0 1px rgba(255,255,255,.025);}
.btn:hover{border-color:color-mix(in srgb,var(--station-accent) 55%,var(--line));background:#202D3B;transform:translateY(-1px);}
.btn.primary{background:linear-gradient(180deg,#50E3D8,#2FC6BC);box-shadow:0 7px 18px rgba(47,211,199,.12),inset 0 1px rgba(255,255,255,.25);}
.btn.primary:hover{background:linear-gradient(180deg,#65EFE5,#39D2C7);}
.tab{position:relative;background:rgba(18,26,35,.88);}
.tab.active{box-shadow:0 7px 18px rgba(47,211,199,.11);}
input[type=text],input[type=password],input[type=number],select,textarea{background:#0C1219;border-color:rgba(117,145,172,.28);}

/* Mission entry */
.joinwrap{position:relative;background:
  radial-gradient(ellipse 850px 520px at 12% 0%,rgba(47,211,199,.10),transparent 62%),
  radial-gradient(ellipse 620px 500px at 100% 100%,rgba(229,72,77,.08),transparent 66%);}
.joinwrap::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(rgba(83,126,154,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(83,126,154,.05) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(circle at 50% 50%,black,transparent 78%);}
.joincard.command-entry{width:min(980px,100%);max-width:none;padding:0;display:grid;grid-template-columns:minmax(300px,.92fr) minmax(350px,1.08fr);overflow:hidden;border-radius:18px;background:rgba(13,19,27,.97);box-shadow:0 34px 90px rgba(0,0,0,.46);}
.joincard.command-entry::before{display:none;}
.join-brief{position:relative;min-height:560px;padding:42px 38px;display:flex;flex-direction:column;overflow:hidden;background:
  radial-gradient(circle at 20% 5%,rgba(47,211,199,.17),transparent 44%),
  linear-gradient(145deg,#121E29,#0A1017 75%);border-right:1px solid rgba(109,139,166,.22);}
.join-brief::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 0 100%,transparent 0 62px,rgba(75,228,216,.045) 63px 64px);pointer-events:none;}
.join-brief::after{content:"";position:absolute;width:240px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);left:-35px;bottom:126px;transform:rotate(-27deg);opacity:.55;}
.command-logo{position:relative;z-index:1;width:68px;height:68px;display:grid;place-items:center;color:var(--cyan);border:1px solid var(--cyan-line);border-radius:17px;background:rgba(47,211,199,.08);box-shadow:0 0 36px rgba(47,211,199,.09),inset 0 0 26px rgba(47,211,199,.05);}
.command-logo svg{width:40px;height:40px;}
.join-kicker{position:relative;z-index:1;margin-top:42px;font:600 10px/1 var(--font-mono);letter-spacing:.18em;color:var(--cyan);}
.join-brief h1{position:relative;z-index:1;font-size:38px;line-height:1.02;letter-spacing:-.04em;margin:10px 0 13px;}
.join-brief p{position:relative;z-index:1;max-width:340px;font-size:13px;}
.mission-data{position:relative;z-index:1;margin-top:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.mission-data div{padding:10px 11px;border:1px solid rgba(111,142,169,.18);border-radius:8px;background:rgba(5,10,15,.34);}
.mission-data span{display:block;font:500 8px/1 var(--font-mono);letter-spacing:.11em;color:var(--ink-faint);}
.mission-data b{display:block;margin-top:6px;font:600 11px/1.25 var(--font-mono);color:var(--ink);}
.online-signal{display:inline-flex!important;align-items:center;gap:6px;color:#71E7A0!important;}
.online-signal::before{content:"";width:6px;height:6px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.12);}
.join-form{padding:46px 42px;display:flex;flex-direction:column;justify-content:center;position:relative;}
.join-form .jc-title{font-size:25px;}
.join-form .jc-sub{margin-bottom:28px;}
.role-select{margin-top:10px;padding:12px;border:1px solid rgba(116,143,169,.18);border-radius:9px;background:rgba(8,13,19,.45);}
.join-submit{min-height:48px;font-size:14px;letter-spacing:.02em;}

/* Patient vector system */
.pixel-human{width:43px;height:48px;border-width:1px;border-color:color-mix(in srgb,var(--pc) 58%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 15%,#17202B),#101720);box-shadow:0 6px 12px rgba(0,0,0,.22),inset 0 0 18px color-mix(in srgb,var(--pc) 8%,transparent);}
.pixel-human::before{content:none!important;}
.pixel-human::after{height:4px;opacity:.9;}
.pixel-human svg{width:38px;height:42px;display:block;overflow:visible;}
.pixel-human .patient-skin{fill:#D7B89E;}
.pixel-human .patient-shirt{fill:#DFE8EF;}
.pixel-human .patient-pants{fill:#667789;}
.pixel-human .patient-bed{fill:#9CADBD;}
.pixel-human .patient-wheel{fill:#263340;}
.pixel-human.BLACK svg{filter:grayscale(1) brightness(.68);}
.pixel-patient,.anonymous-person{animation:none;}
@keyframes patientArrive{from{opacity:0;transform:translateY(7px) scale(.97)}to{opacity:1;transform:none}}
.patient-focus-avatar{width:72px;height:72px;display:grid;place-items:center;flex:0 0 auto;border:1px solid color-mix(in srgb,var(--pc) 58%,var(--line));border-radius:14px;background:linear-gradient(145deg,color-mix(in srgb,var(--pc) 15%,var(--bg-panel-2)),var(--bg));box-shadow:inset 0 -4px var(--pc),0 10px 22px rgba(0,0,0,.23);}
.patient-focus-avatar svg{width:57px;height:57px;}
.patient-focus-avatar.gray{--pc:#7C8494}.patient-focus-avatar.RED{--pc:#EF4444}.patient-focus-avatar.YELLOW{--pc:#EAB308}.patient-focus-avatar.GREEN{--pc:#22C55E}.patient-focus-avatar.BLACK{--pc:#6B7280}
.patient-focus-avatar .patient-skin{fill:#D7B89E}.patient-focus-avatar .patient-shirt{fill:#DFE8EF}.patient-focus-avatar .patient-pants{fill:#667789}.patient-focus-avatar .patient-bed{fill:#9CADBD}.patient-focus-avatar .patient-wheel{fill:#263340}
.pixel-human.dead-patient,.patient-focus-avatar.dead-patient{position:relative;filter:grayscale(.88) brightness(.72);border-color:#ef4444;box-shadow:0 0 0 2px rgba(239,68,68,.24),0 8px 18px rgba(0,0,0,.28);}
.death-skull{position:absolute;z-index:3;inset:50% auto auto 50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:rgba(8,12,18,.92);border:1px solid rgba(248,113,113,.8);font-size:20px;line-height:1;filter:none!important;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.patient-focus-avatar .death-skull{width:42px;height:42px;font-size:29px;}
.patient-card{position:relative;overflow:hidden;padding:16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--pc, var(--station-accent)) 7%,#17202B),#111820 62%);border-left:1px solid color-mix(in srgb,var(--pc, var(--station-accent)) 60%,var(--line));}
.patient-card::before{content:"ACTIVE PATIENT";position:absolute;right:15px;top:11px;font:600 8px/1 var(--font-mono);letter-spacing:.14em;color:color-mix(in srgb,var(--pc,var(--station-accent)) 66%,var(--ink-faint));}
.patient-card.stripe-RED{--pc:var(--red);}.patient-card.stripe-YELLOW{--pc:var(--yellow);}.patient-card.stripe-GREEN{--pc:var(--green);}.patient-card.stripe-BLACK{--pc:var(--black-tri);}
.patient-card .pidrow{padding-right:90px;min-height:72px;}
.patient-card .pid{font-size:22px;}
.player-census{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--station-accent) 5%,var(--bg-panel-2)),var(--bg-panel-2));}
.player-census::after{content:"";position:absolute;right:-70px;top:-110px;width:210px;height:210px;border:1px solid color-mix(in srgb,var(--station-accent) 10%,transparent);border-radius:50%;pointer-events:none;}

/* Zone command board */
.zone-flow-board{position:relative;}
.zone-flow-column{position:relative;}
.zone-box{background:linear-gradient(155deg,rgba(27,36,48,.96),rgba(18,25,34,.97));}
.zone-box.red,.zone-box.yellow,.zone-box.green{border-top-width:2px;}
.zone-box-head{position:relative;}
.zone-box-title{color:var(--ink);}
.zone-box-count{padding:3px 7px;border-radius:999px;background:rgba(6,11,16,.38);}
.zone-empty{min-height:72px;display:grid;place-items:center;border:1px dashed rgba(108,137,164,.14);border-radius:8px;margin-top:10px;text-transform:uppercase;letter-spacing:.07em;}

/* Ambulance staging and parking bay */
.transfer-step{position:relative;overflow:hidden;background:linear-gradient(145deg,#182330,#121A23);}
.transfer-step:first-child::after{content:"AMBULANCE STAGING";position:absolute;right:13px;bottom:9px;font:700 8px/1 var(--font-mono);letter-spacing:.15em;color:rgba(128,162,192,.20);pointer-events:none;}
.transfer-vehicle-grid{position:relative;padding:16px 12px 10px;border-radius:9px;background:
  linear-gradient(90deg,transparent 49.5%,rgba(226,232,240,.10) 49.5% 50.5%,transparent 50.5%),
  repeating-linear-gradient(90deg,rgba(148,163,184,.09) 0 1px,transparent 1px 170px),
  linear-gradient(180deg,#121A22,#0F161D);border:1px solid rgba(122,151,178,.15);}
.transfer-vehicle-choice{z-index:1;}
.transfer-staging{position:relative;overflow:hidden;background:
  linear-gradient(135deg,rgba(47,211,199,.055),transparent 46%),
  repeating-linear-gradient(90deg,transparent 0 118px,rgba(127,151,174,.055) 119px 120px),var(--bg-panel-2);}
.transfer-staging::after{content:"DISPATCH LANE  →";position:absolute;right:22px;bottom:10px;font:800 9px/1 var(--font-mono);letter-spacing:.18em;color:rgba(132,170,202,.18);pointer-events:none;}
.vehicle-art{transition:transform .22s ease;}
.vehicle-rulebar{overflow:hidden}.vehicle-rulebar>.flexrow{gap:8px}.vehicle-rule-item{flex:1;min-width:170px;padding:7px 10px!important;border:1px solid var(--line-soft);border-radius:8px;background:rgba(7,12,18,.34)}.vehicle-rule-icon{width:46px;height:26px;display:grid;place-items:center;flex:0 0 46px}.vehicle-rule-icon svg{display:block!important;width:44px!important;height:24px!important;max-width:44px!important;max-height:24px!important}.vehicle-rule-icon.ALS .vehicle-body{fill:#d64b55}.vehicle-rule-icon.BLS .vehicle-body{fill:#e1ae35}.vehicle-rule-icon.BUS .vehicle-body{fill:#36a46a}.vehicle-rule-icon .vehicle-panel{opacity:.85}.vehicle-rule-item .rule-copy{font-size:11px;color:var(--ink-dim);white-space:nowrap}
.transfer-vehicle-choice:hover .vehicle-art{transform:translateY(-2px);}
.vehicle-siren-left,.vehicle-siren-right{opacity:.48;}
.transfer-staging-vehicle .vehicle-siren-left,.vehicle-tile:has(.vehicle-passengers) .vehicle-siren-left{animation:sirenRed 1.05s steps(1,end) infinite;}
.transfer-staging-vehicle .vehicle-siren-right,.vehicle-tile:has(.vehicle-passengers) .vehicle-siren-right{animation:sirenBlue 1.05s steps(1,end) infinite;}
@keyframes sirenRed{0%,49%{opacity:1;filter:drop-shadow(0 0 4px #ff474d)}50%,100%{opacity:.24;filter:none}}
@keyframes sirenBlue{0%,49%{opacity:.24;filter:none}50%,100%{opacity:1;filter:drop-shadow(0 0 4px #54a7ff)}}
.transfer-sendbar{background:rgba(14,21,29,.96);border-color:rgba(75,228,216,.25);}

/* Treatment progress and mission completion */
.tx-countdown{padding:4px 7px;border-radius:6px;background:rgba(243,167,18,.08);border:1px solid rgba(243,167,18,.2);}
.mission-complete{position:relative;overflow:hidden;margin-bottom:18px;padding:21px 22px;border:1px solid rgba(75,228,216,.28);border-radius:12px;background:linear-gradient(110deg,rgba(47,211,199,.13),rgba(17,25,34,.97) 58%);box-shadow:0 14px 35px rgba(0,0,0,.18);}
.mission-complete::after{content:"MISSION COMPLETE";position:absolute;right:-12px;bottom:-6px;font:800 30px/1 var(--font-display);letter-spacing:.02em;color:rgba(75,228,216,.055);}
.mission-complete .mc-kicker{font:700 9px/1 var(--font-mono);letter-spacing:.17em;color:var(--cyan);}
.mission-complete .mc-title{font:700 23px/1.2 var(--font-display);margin-top:7px;}
.mission-complete .mc-meta{font-size:12px;color:var(--ink-dim);margin-top:6px;}
.mission-end-screen{min-height:calc(100vh - 120px);display:grid;place-items:center;padding:30px 14px;}
.mission-end-panel{width:min(680px,100%);text-align:center;padding:38px;border:1px solid rgba(75,228,216,.3);border-radius:18px;background:radial-gradient(circle at 50% 0,rgba(75,228,216,.13),transparent 48%),#101720;box-shadow:0 28px 70px rgba(0,0,0,.34);}
.mission-end-symbol{width:82px;height:82px;margin:0 auto 20px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--cyan-line);background:var(--cyan-soft);color:var(--cyan);}
.mission-end-symbol svg{width:42px;height:42px}.mission-end-panel h1{font-size:30px;margin-bottom:8px}.mission-end-panel p{max-width:500px;margin:0 auto}.mission-end-wait{margin-top:22px;padding:12px;border:1px solid var(--line);border-radius:9px;background:rgba(7,12,18,.45);font:600 11px/1.5 var(--font-mono);color:var(--ink-dim);}
.personal-debrief-head{margin-bottom:18px;padding:22px;border:1px solid rgba(167,139,250,.3);border-radius:13px;background:linear-gradient(120deg,rgba(167,139,250,.13),rgba(17,25,34,.97));}
.personal-score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.personal-score{padding:11px;border:1px solid var(--line-soft);border-radius:8px;background:rgba(7,12,18,.32)}.personal-score b{display:block;font:700 22px/1 var(--font-mono);margin-bottom:5px}.personal-score span{font-size:10px;color:var(--ink-faint)}

/* Treatment workspace */
.treatment-workspace{display:grid;grid-template-columns:minmax(260px,.72fr) minmax(420px,1.28fr);gap:14px;align-items:start;}
.treatment-overview{position:sticky;top:88px;}.treatment-case-id{font:700 30px/1 var(--font-mono);margin:10px 0}.treatment-case-status{display:flex;gap:7px;flex-wrap:wrap}.treatment-section{padding:14px 0;border-top:1px solid var(--line-soft)}.treatment-section:first-child{border-top:0;padding-top:0}.treatment-section-title{font:700 10px/1 var(--font-mono);letter-spacing:.1em;color:var(--station-accent);margin-bottom:10px}.treatment-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.treatment-actions .btn{min-height:46px}.resource-rack{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:7px}.resource-chip{display:flex;justify-content:space-between;gap:7px;padding:8px 9px;border:1px solid var(--line-soft);border-radius:7px;background:#0D141C;font-size:10px}.resource-chip b{font-family:var(--font-mono);color:var(--station-accent)}

/* Real ambulance bay */
.ambulance-bay{position:relative;padding:26px 18px 38px!important;background:linear-gradient(180deg,#303940 0 72%,#262E34 72%)!important;border:1px solid #46535D!important;overflow:hidden;}
.ambulance-bay::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.035) 19px 20px),linear-gradient(180deg,transparent 71%,rgba(255,255,255,.09) 71% 72%,transparent 72%);}
.ambulance-bay::after{content:"KEEP CLEAR  •  AMBULANCE ONLY";position:absolute;left:18px;right:18px;bottom:12px;text-align:center;font:800 9px/1 var(--font-mono);letter-spacing:.18em;color:rgba(245,192,69,.6);}
.ambulance-bay .transfer-vehicle-choice{position:relative;padding:10px 8px 14px;border-left:2px solid rgba(245,192,69,.48);border-right:2px solid rgba(245,192,69,.48);border-radius:0;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(0,0,0,.08));}
.ambulance-bay .transfer-vehicle-choice::after{content:"BAY " attr(data-bay);position:absolute;left:7px;bottom:3px;font:700 8px/1 var(--font-mono);letter-spacing:.1em;color:rgba(255,255,255,.38)}
.dispatching-vehicle{animation:ambulanceExit .72s cubic-bezier(.45,.05,.7,.55) forwards!important;pointer-events:none;z-index:12}.dispatching-vehicle .vehicle-art{filter:drop-shadow(-12px 5px 6px rgba(0,0,0,.28))}.dispatching-vehicle .vehicle-wheel{transform-box:fill-box;transform-origin:center;animation:wheelSpin .22s linear infinite}
@keyframes ambulanceExit{0%{transform:translateX(0);opacity:1}72%{opacity:1}100%{transform:translateX(calc(100vw + 260px));opacity:0}}
@keyframes wheelSpin{to{transform:rotate(360deg)}}
@media(max-width:800px){.treatment-workspace{grid-template-columns:1fr}.treatment-overview{position:static}.personal-score-grid{grid-template-columns:1fr}.treatment-actions{grid-template-columns:1fr}}

/* Lightweight entrance motion */
.card,.transfer-step,.zone-box,.patient-card{animation:none;}
@keyframes surfaceIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .joincard.command-entry{grid-template-columns:1fr;max-width:560px;}
  .join-brief{min-height:300px;padding:30px 28px;}
  .join-kicker{margin-top:24px;}.join-brief h1{font-size:31px;}.mission-data{margin-top:28px;}
  .join-form{padding:34px 28px;}
  .topbar{flex-wrap:wrap;gap:8px;}.clockwrap{order:3;width:100%;justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:7px;}.mebadge{margin-left:auto;}
}
@media (max-width:620px){
  .main{padding:16px 11px 48px;}.topbar{padding:8px 11px;}.brand-copy small{display:none;}.mebadge>span:first-child{display:none;}
  .station-hero h1{font-size:22px;}.station-title-icon{width:34px;height:34px;}.timerbig{font-size:21px;}
  .patient-card .pidrow{padding-right:0;padding-top:16px;}.patient-card::before{left:16px;right:auto;}
  .joinwrap{padding:10px;}.join-brief{padding:26px 22px;}.join-form{padding:28px 22px;}
}

/* ---------- Contextual How to Play / guided spotlight ---------- */
.howto-open-btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 10px;border:1px solid rgba(75,228,216,.42);border-radius:999px;background:rgba(75,228,216,.08);color:#dffffc;font:800 11px/1 var(--font);cursor:pointer;white-space:nowrap}.howto-open-btn:hover{background:rgba(75,228,216,.15);border-color:var(--cyan)}.howto-open-btn .howto-q{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--cyan);color:#071219;font:900 13px/1 var(--font-mono)}
#howToPlayHost{position:fixed;inset:0;z-index:2600;pointer-events:auto;font-family:var(--font)}#howToPlayHost.hidden{display:none}.howto-spotlight{position:fixed;border:2px solid #71fff3;border-radius:12px;box-shadow:0 0 0 9999px rgba(4,8,13,.78),0 0 0 5px rgba(75,228,216,.14),0 0 28px rgba(75,228,216,.42);transition:top .18s ease,left .18s ease,width .18s ease,height .18s ease;pointer-events:none}.howto-spotlight.no-target{inset:0!important;width:auto!important;height:auto!important;border:0;border-radius:0;box-shadow:inset 0 0 0 9999px rgba(4,8,13,.82)}
.howto-card{position:fixed;width:min(390px,calc(100vw - 24px));max-height:min(570px,calc(100vh - 24px));overflow:auto;padding:0;border:1px solid rgba(113,255,243,.45);border-radius:16px;background:linear-gradient(155deg,#17232e,#0e161f 72%);box-shadow:0 22px 70px rgba(0,0,0,.72);pointer-events:auto}.howto-card::before{content:"";position:absolute;width:14px;height:14px;background:#14212b;border-left:1px solid rgba(113,255,243,.45);border-top:1px solid rgba(113,255,243,.45);transform:rotate(45deg)}.howto-card[data-placement="below"]::before{top:-8px;left:var(--arrow-x,32px)}.howto-card[data-placement="above"]::before{bottom:-8px;left:var(--arrow-x,32px);transform:rotate(225deg)}.howto-card[data-placement="left"]::before{right:-8px;top:var(--arrow-y,32px);transform:rotate(135deg)}.howto-card[data-placement="right"]::before{left:-8px;top:var(--arrow-y,32px);transform:rotate(-45deg)}.howto-card[data-placement="center"]::before{display:none}
.howto-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(75,228,216,.055)}.howto-brand{font:800 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--cyan)}.howto-skip{border:0;background:transparent;color:var(--ink-faint);font-size:11px;cursor:pointer}.howto-skip:hover{color:#fff}.howto-content{padding:16px}.howto-visual{display:flex;align-items:center;justify-content:center;gap:7px;min-height:64px;margin-bottom:13px;padding:10px;border:1px solid rgba(111,137,163,.2);border-radius:12px;background:radial-gradient(circle at 50% 20%,rgba(75,228,216,.12),transparent 68%)}.howto-visual-step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px;color:var(--ink-faint);font-size:9px;text-align:center}.howto-visual-step span{display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(75,228,216,.3);border-radius:10px;background:#17242e;font-size:21px}.howto-visual-arrow{color:var(--cyan);font-weight:900}.howto-kicker{margin-bottom:5px;color:var(--station-accent);font:800 9px/1 var(--font-mono);letter-spacing:.12em}.howto-title{margin:0;color:#f5fbff;font-size:19px;line-height:1.25}.howto-body{margin-top:9px;color:var(--ink-dim);font-size:12px;line-height:1.65}.howto-body b{color:#fff}.howto-callout{display:flex;gap:7px;margin-top:10px;padding:8px 9px;border-left:3px solid var(--amber);border-radius:6px;background:rgba(255,181,71,.08);color:#f8d7a3;font-size:10.5px;line-height:1.5}.howto-bottom{padding:12px 14px;border-top:1px solid var(--line);background:rgba(7,12,18,.28)}.howto-progress{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.howto-dots{display:flex;gap:5px}.howto-dot{width:6px;height:6px;border-radius:50%;background:#34404d}.howto-dot.done{background:rgba(75,228,216,.45)}.howto-dot.active{width:18px;border-radius:99px;background:var(--cyan)}.howto-count{color:var(--ink-faint);font:700 9px/1 var(--font-mono)}.howto-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px}.howto-actions .btn{min-height:35px}.howto-next{min-width:105px}.howto-keyhint{margin-right:auto;color:var(--ink-faint);font-size:9px}
@media (max-width:760px){.howto-open-btn{padding:6px 8px}.howto-open-btn .howto-label{display:none}.howto-card{left:8px!important;right:8px!important;bottom:8px!important;top:auto!important;width:auto;max-height:min(52vh,470px)}.howto-card::before{display:none}.howto-spotlight{transition:none}.howto-keyhint{display:none}.howto-visual{min-height:54px}.howto-visual-step span{width:34px;height:34px;font-size:18px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important;}
}
