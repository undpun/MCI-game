  }
  if(act==='combinedMoveLoading'){
    if(!transportCombined()||STATE.me.station!=='LOADING'){toast('ใช้ได้เฉพาะ Loading ในโหมด Extern','err');return;}
    await combinedMoveToLoading(el.dataset.vehicle);return;
  }
  if(act==='commandSendParking'){
    if(['GM','COMMANDER'].indexOf(STATE.me.station)<0){toast('เฉพาะ GM/Commander เท่านั้นที่ส่งรถจากโรงพยาบาลได้','err');return;}
    const key=commandRequestDomKey(el.dataset.request),saved=(STATE.ui.commandRequests&&STATE.ui.commandRequests[el.dataset.request])||{},vehicle=saved.vehicle||val('cmd_req_vehicle_'+key),hospital=saved.hospital||val('cmd_req_hosp_'+key);
    if(!vehicle||!hospital){toast('เลือกรถและโรงพยาบาลต้นทางก่อน','err');return;}
    const sent=await commandSendVehicleToParking(el.dataset.request,vehicle,hospital);if(sent&&STATE.ui.commandRequests)delete STATE.ui.commandRequests[el.dataset.request];saveLocalSession();return;
  }
  if(act==='gmReset'){ if(confirm('ยืนยัน Reset เกม? ข้อมูลผู้ป่วยทั้งหมดจะถูกลบ')) await gmResetGame(); return; }
  if(act==='sceneImport'){ window.SceneApp && window.SceneApp.triggerImport(); return; }
  if(act==='sceneExport'){ window.SceneApp && window.SceneApp.exportFile(); return; }
  if(act==='sceneSkip'){
    if(!confirm('ข้ามขั้นตอน Scene Setup? เกมจะใช้รายชื่อ ความจุ และระยะทางโรงพยาบาลที่กรอกเองในแท็บทรัพยากร')) return;
    const scene = Object.assign({}, DEFAULT_SCENE, {skipped:true});
    await kvSet(KEYS.scene, scene); STATE.scene = scene;
    document.getElementById('statusText') && (document.getElementById('statusText').textContent = 'ข้ามขั้นตอนนี้แล้ว — ผู้เล่นเริ่มเกมได้');
    render(true);
    return;
  }
  if(act==='scenePublish'){
    const data = autoLinkSceneAmbulanceRoutes(window.SceneApp && window.SceneApp.serialize());
    const tents = data && data.tents ? data.tents : [];
    const mapHospitals = tents.filter(function(t){return t.typeId==='hospital' && String(t.name||'').trim();}).map(function(t){
      const name=String(t.name).trim();
      const linked=ambulanceRoutesForHospital(data,name);
      const hub=tents.find(function(x){return x.typeId==='loading';})||tents.find(function(x){return x.typeId==='incident';})||tents.find(function(x){return x.typeId==='command';});
      const fallback=hub ? (haversineKm(hub.lat,hub.lng,t.lat,t.lng)/AMBULANCE_FALLBACK_KMH)*60 : 0;
      function routeBest(direction){
        const vals=linked.filter(function(r){return r.direction===direction||r.direction==='both';}).map(routeMinutes).filter(function(v){return v!=null;});
        return vals.length?Math.min.apply(null,vals):fallback;
      }
      const outboundMin=routeBest('to');
      const returnMin=routeBest('from');
      return {name:name,redCap:Number(t.redCap)||0,yellowCap:Number(t.yellowCap)||0,greenCap:Number(t.greenCap)||0,redUsed:0,yellowUsed:0,greenUsed:0,outboundMin:Number(outboundMin.toFixed(1)),returnMin:Number(returnMin.toFixed(1)),distanceMin:Number(outboundMin.toFixed(1))};
    });
    const scene = {published:true, publishedAt:Date.now(), skipped:false, data: data||null};
    await kvSet(KEYS.scene, scene); await kvSet(KEYS.hospitals,mapHospitals);
    STATE.scene = scene; STATE.hospitals=mapHospitals;
    const st = document.getElementById('statusText');
    if(st) st.textContent = 'เผยแพร่สำเร็จ — ใช้โรงพยาบาลจาก Map '+mapHospitals.length+' แห่ง';
    render(true);
    return;
  }
  if(act==='gmSaveConfig'){
    const ok=await gmUpdateConfig({
      maxGameMin: Number(val('cfgMaxMin'))||60,
      transportMode: val('cfgTransportMode')==='COMBINED'?'COMBINED':'SPLIT',
      transitSpeeds: {
        walkKmh: Number(val('cfgWalkKmh'))||4,
        carryKmh: Number(val('cfgCarryKmh'))||3
      }
    });
    if(ok)toast('บันทึกการตั้งค่าแล้ว','ok');
    return;
  }
  if(act==='gmRemove'){ await gmRemovePlayer(el.dataset.name); return; }
  if(act==='selfCommander'){ await gmAssignStation(STATE.me.name,'COMMANDER'); return; }
  if(act==='gmAddVehicle'){ await gmAddVehicle(val('newVehicleName'),val('newVehicleType')); return; }
  if(act==='gmRemoveVehicle'){ await gmRemoveVehicle(el.dataset.vehicle); return; }
  if(act==='gmDeleteCase'){ if(confirm('ลบเคส #'+el.dataset.id+' ?')) await gmDeleteCase(el.dataset.id); return; }
  if(act==='gmEditCase'){
    const c=findCase(STATE.cases,el.dataset.id);
    if(!c){toast('ไม่พบเคส #'+el.dataset.id+' อาจถูกลบจากหน้าจออื่นแล้ว','err');return;}
    STATE.ui.caseDraft=caseDraftFromCase(c);saveLocalSession();render(true);
    const editor=document.getElementById('caseEditorCard');if(editor)editor.scrollIntoView({behavior:'smooth',block:'start'});
    const first=document.getElementById('ncWalk');if(first)first.focus();
    return;
  }
  if(act==='gmClearCaseDraft'){
    resetCaseDraft();saveLocalSession();render(true);
    const editor=document.getElementById('caseEditorCard');if(editor)editor.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(act==='gmSaveCaseBtn'){
    const draft=syncCaseDraftFromDom();
    const id=(draft.mode==='edit'?draft.originalId:draft.id).trim();
    if(!id){ toast('กรอก Patient ID','err'); return; }
    const limit=Number(draft.timeLimit);
    if(!Number.isFinite(limit)||limit<=0){toast('Time Limit ต้องมากกว่า 0 นาที','err');const input=document.getElementById('ncLimit');if(input)input.focus();return;}
    const reqTx=uniq(draft.reqTx.filter(Boolean));
    const caseObj={id:id,canWalk:draft.canWalk,reqTx:reqTx,timeLimit:limit,primary:draft.primary,secondary:draft.secondary,dispo:draft.dispo,vehicle:draft.vehicle||null};
    el.disabled=true;el.textContent='กำลังบันทึก…';
    const saved=draft.mode==='edit'?await gmUpdateCase(draft.originalId,caseObj):await gmAddCase(caseObj);
    if(saved){resetCaseDraft();saveLocalSession();render(true);}
    else{el.disabled=false;el.textContent=draft.mode==='edit'?'💾 บันทึกการแก้ไข':'+ เพิ่มเคส';}
    return;
  }
  if(act==='gmSaveResource'){
    const item = el.dataset.item;
    await gmUpdateResource(item, {
      stock: Number(val('res_stock_'+item))||0,
      durationSec: Number(val('res_dur_'+item))||5
    });
    return;
  }
  if(act==='gmAddResource'){
    await gmAddResource(val('newResourceName'),val('newResourceStock'),val('newResourceDuration'));
    return;
  }
  if(act==='gmAddHospital'){
    const out=Math.max(0,Number(val('newHospOut'))||0), ret=Math.max(0,Number(val('newHospReturn'))||0);
    await gmAddHospital({name:val('newHospName'),redCap:Math.max(0,Number(val('newHospRed'))||0),yellowCap:Math.max(0,Number(val('newHospYellow'))||0),greenCap:Math.max(0,Number(val('newHospGreen'))||0),redUsed:0,yellowUsed:0,greenUsed:0,outboundMin:out,returnMin:ret,distanceMin:out});
    return;
  }
  if(act==='gmDeleteHospital'){
    const i=Number(el.dataset.index), h=STATE.hospitals[i]; if(!h)return;
    if(confirm('ลบโรงพยาบาล '+h.name+' ?')) await gmDeleteHospital(h.name);
    return;
  }
  if(act==='gmSaveHospital'){
    const i=Number(el.dataset.index), h=STATE.hospitals[i]; if(!h)return;
    await gmRenameHospital(h.name,val('hosp_name_'+i),{
      redCap:Number(val('hosp_red_'+i))||0,
      yellowCap:Number(val('hosp_yellow_'+i))||0,
      greenCap:Number(val('hosp_green_'+i))||0,
      outboundMin:Number(val('hosp_out_'+i))||0,
      returnMin:Number(val('hosp_return_'+i))||0,
      distanceMin:Number(val('hosp_out_'+i))||0
    });
    return;
  }
  if(act==='patientFocus'||act==='patientIconFocus'){
    const key=el.dataset.key,inputId=el.dataset.input;
    const id=normU(act==='patientIconFocus'?el.dataset.pid:val(inputId));
    if(!id){toast('กรอก Patient No. ก่อน','err');return;}
    const activeTx=activeTreatmentPatientForMe(key,elapsedMinutes(STATE.gc));
    if(activeTx&&normU(activeTx.id)!==id){toast('ไม่สามารถเลือกคนไข้ No. '+id+' ได้ เนื่องจากกำลังทำการรักษา No. '+activeTx.id+' อยู่','err');return;}
    const p=visiblePatientsForFocusKey(key).find(function(x){return normU(x.id)===id;});
    if(!p){const elsewhere=STATE.patients.find(function(x){return normU(x.id)===id;});toast(elsewhere?'คนไข้ No. '+id+' อยู่ใน zone '+patientCurrentZoneLabel(elsewhere):'ไม่พบคนไข้ No. '+id+' ในระบบ','err');return;}
    const oldId=STATE.ui.focused[key];
    if(key.indexOf('TX_')===0&&oldId&&normU(oldId)!==id){const oldPatient=STATE.patients.find(function(x){return normU(x.id)===normU(oldId);});if(oldPatient&&hasAnyTxInProgress(oldPatient,elapsedMinutes(STATE.gc))){toast('ไม่สามารถเลือกคนไข้ No. '+id+' ได้ เนื่องจากกำลังทำการรักษา No. '+oldPatient.id+' อยู่','err');return;}}
    if(oldId&&normU(oldId)!==id){await releasePatientLocks([oldId]);setFocusedPatient(key,null);}
    if(!await claimPatientLock(id,key))return;
    setFocusedPatient(key,id);render(true);return;
  }
  if(act==='patientFocusClear'){
    const focusKey=el.dataset.key,oldId=STATE.ui.focused[focusKey];
    if(focusKey&&focusKey.indexOf('TX_')===0&&oldId){const oldPatient=STATE.patients.find(function(x){return normU(x.id)===normU(oldId);});if(oldPatient&&hasAnyTxInProgress(oldPatient,elapsedMinutes(STATE.gc))){toast('ยังปิดเคส No. '+oldPatient.id+' ไม่ได้ เนื่องจากกำลังทำการรักษาอยู่','err');return;}}
    if(oldId)await releasePatientLocks([oldId]);
    setFocusedPatient(focusKey,null);render(true);return;
  }
  if(act==='primaryRegister'){await primaryRegister(val(el.dataset.input||'primaryIdInput'));const inp=document.getElementById(el.dataset.input||'primaryIdInput');if(inp)inp.value='';return;}
  if(act==='secondaryRegister'){await secondaryRegisterOrOpen(val(el.dataset.input||'secondaryIdInput'));const inp=document.getElementById(el.dataset.input||'secondaryIdInput');if(inp)inp.value='';return;}
  if(act==='primarySet'){ await primarySetField(el.dataset.pid, el.dataset.field, el.dataset.value); return; }
  if(act==='primarySend'){ await primarySend(el.dataset.pid, el.dataset.dest); return; }
  if(act==='secondarySet'){ await secondarySetField(el.dataset.pid, el.dataset.field, el.dataset.value); return; }
  if(act==='secondarySend'){ await secondarySend(el.dataset.pid, el.dataset.dest); return; }
  if(act==='txCancel'){ if(confirm('ยกเลิก Treatment นี้และคืนของเข้า stock?')) await txCancelItem(el.dataset.pid,el.dataset.slot); return; }
  if(act==='txDispo'){ await txSetDispo(el.dataset.pid, el.dataset.value); return; }
  if(act==='dispatchSend'){ await dispatchSend(el.dataset.vehicle); return; }
  if(act==='transferVehicleLocal'){
    const nextVehicle=el.dataset.vehicle||null,previousVehicle=STATE.ui.transfer.vehicle;
    if(!nextVehicle||!await claimVehicleLock(nextVehicle))return;
    await releasePatientLocks((STATE.ui.transfer.patientIds||[]).concat(previousVehicle&&previousVehicle!==nextVehicle?[vehicleLockKey(previousVehicle)]:[]));
    STATE.ui.transfer.vehicle=nextVehicle;
    STATE.ui.transfer.patientIds=[];
    saveLocalSession();render(true);return;
  }
  if(act==='transferVehicleClear'){
    await releasePatientLocks((STATE.ui.transfer.patientIds||[]).concat(STATE.ui.transfer.vehicle?[vehicleLockKey(STATE.ui.transfer.vehicle)]:[]));
    STATE.ui.transfer={vehicle:null,patientIds:[],hospital:null};
    saveLocalSession();render(true);return;
  }
  if(act==='transferPatientLocal'){
    if(!STATE.ui.transfer.vehicle){toast('เลือกรถก่อน','err');return;}
    const id=normU(el.dataset.pid),ids=(STATE.ui.transfer.patientIds||[]).slice(),i=ids.indexOf(id);
    if(i>-1){ids.splice(i,1);await releasePatientLocks([id]);}
    else{
      if(!await claimPatientLock(id,'TRANSFER'))return;
      ids.push(id);
    }
    STATE.ui.transfer.patientIds=ids;saveLocalSession();render(true);return;
  }
  if(act==='transferSendBatch'){
    const ui=STATE.ui.transfer;
    const sendButton=el;sendButton.disabled=true;sendButton.textContent='กำลังส่งรถ...';
    const sent=await dispatchSend(ui.vehicle,(ui.patientIds||[]).slice(),ui.hospital,true);
    if(sent){await animateDispatchExit();STATE.ui.transfer={vehicle:null,patientIds:[],hospital:null};saveLocalSession();render(true);}
    else{sendButton.disabled=false;sendButton.textContent='SEND รถพร้อมผู้ป่วย';}
    return;
  }
  if(act==='gmAssign'){ /* handled on change */ return; }
}

async function handleChange(el){
  const act = el.dataset.act;
  if(act==='toggleGMPassword'){
    const wrap = document.getElementById('gmPasswordWrap');
    const passwordInput = document.getElementById('joinGMPassword');
    const commanderCheckbox = document.getElementById('joinAsCommander');
    if(wrap) wrap.style.display = el.checked ? 'block' : 'none';
    if(el.checked){
      if(commanderCheckbox) commanderCheckbox.checked = false;
      if(passwordInput) passwordInput.focus();
    }else if(passwordInput){
      passwordInput.value = '';
    }
    return;
  }
  if(act==='toggleCommanderRole'){
    if(el.checked){
      const gmCheckbox = document.getElementById('joinAsGM');
      const wrap = document.getElementById('gmPasswordWrap');
      const passwordInput = document.getElementById('joinGMPassword');
      if(gmCheckbox) gmCheckbox.checked = false;
      if(wrap) wrap.style.display = 'none';
      if(passwordInput) passwordInput.value = '';
    }
    return;
  }
  if(act==='transportModeChange'){
    const ok=await gmUpdateConfig({transportMode:el.value==='COMBINED'?'COMBINED':'SPLIT'});
    if(ok)toast(el.value==='COMBINED'?'เปลี่ยนเป็น Extern Mode · Loading + Parking แล้ว':'เปลี่ยนเป็น Resident Mode · แยก Loading / Parking แล้ว','ok');return;
  }
  if(act==='gmAssign'){ await gmAssignStation(el.dataset.name, el.value); return; }
  if(act==='commandRequestSelection'){
    if(!STATE.ui.commandRequests)STATE.ui.commandRequests={};
    const current=Object.assign({},STATE.ui.commandRequests[el.dataset.request]||{});current[el.dataset.field]=el.value||'';STATE.ui.commandRequests[el.dataset.request]=current;saveLocalSession();return;
  }
  if(act==='gmTriageResourceToggle'){ await gmUpdateResource(el.dataset.item,{triageAllowed:el.checked}); return; }
  if(act==='fastTreatmentToggle'){ await gmSetFastTreatment(el.checked); return; }
  if(act==='hospitalTreatmentToggle'){ await gmSetHospitalTreatment(el.checked); return; }
  if(act==='externVehiclesReadyToggle'){ await gmSetExternVehiclesReady(el.checked); return; }
  if(act==='transferHospitalLocal'){STATE.ui.transfer.hospital=el.value||null;saveLocalSession();render(true);return;}
  if(act==='transferSet'){ await transferAssign(el.dataset.pid, el.dataset.field, el.value); return; }
  if(act==='txNote'){ await txSetNote(el.dataset.pid,el.value); return; }
  if(act==='txDx'){ await txSetDx(el.dataset.pid,el.value); return; }
  if(act==='txSelect'){
    if(!el.value) return;
    await txStartItem(el.dataset.pid, Number(el.dataset.slot), el.value, 'TX');
    return;
  }
  if(act==='triageTxSelect'){
    if(!el.value) return;
    await txStartItem(el.dataset.pid, Number(el.dataset.slot), el.value, el.dataset.stage);
    return;
  }
  if(act==='mapSettingToggle'){
    const keyByCheckboxId={cfgUseMap:'useMap', cfgDistSecondary:'distSecondary', cfgDistTreatment:'distTreatment', cfgDistTransfer:'distTransfer'};
    const key=keyByCheckboxId[el.dataset.key];
    if(!key) return;
    await gmSetMapSetting(key, el.checked);
    return;
  }
}

function boot(){
  fbInit();
  window.addEventListener('pointerdown',function(){ensureCommunicationAudio();},{once:true,capture:true});
  const svToggle = document.getElementById('sceneViewerToggle');
  if(svToggle){
    svToggle.addEventListener('click', function(){
      const host = document.getElementById('sceneViewerHost');
      if(host) host.classList.toggle('collapsed');
    });
  }
  const app = document.getElementById('app');
  app.addEventListener('click', function(e){
    const el = e.target.closest('[data-act]');
    if(!el || el.disabled) return;
    handleClick(el);
  });
  app.addEventListener('input',function(e){
    const el=e.target.closest('[data-case-field]');
    if(el)captureCaseDraftValue(el);
  });
  app.addEventListener('change', function(e){
    const caseField=e.target.closest('[data-case-field]');
    if(caseField)captureCaseDraftValue(caseField);
    const el = e.target.closest('[data-act]');
    if(!el) return;
    handleChange(el);
  });
  app.addEventListener('focusout',function(){
    if(backgroundRenderPending)scheduleBackgroundRender();
  });
  app.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    const el = e.target.closest('[data-enter-act]');
    if(!el) return;
    e.preventDefault();
    const act = el.dataset.enterAct;
    if(act==='join') handleClick({dataset:{act:'join'}});
    else if(act==='primaryRegister') handleClick({dataset:{act:'primaryRegister',input:el.id}});
    else if(act==='secondaryRegister') handleClick({dataset:{act:'secondaryRegister',input:el.id}});
    else if(act==='patientFocus')handleClick({dataset:{act:'patientFocus',key:el.dataset.focusKey,input:el.id}});
  });
  document.addEventListener('click',function(e){
    const el=e.target.closest('[data-comm-act]');
    if(!el||el.disabled)return;
    handleCommunicationAction(el);
  });
  document.addEventListener('click',function(e){
    const el=e.target.closest('[data-howto-act]');if(!el||el.disabled)return;
    const act=el.dataset.howtoAct;
    if(act==='open')openHowTo();
    else if(act==='skip')closeHowTo();
    else if(act==='prev')moveHowTo(-1);
    else if(act==='next')moveHowTo(1);
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'||!e.target.closest('#communicationHost'))return;
    if(e.target.id==='commTextInput'){
      e.preventDefault();
      const button=document.querySelector('#communicationHost [data-comm-act="sendText"]');
      if(button)handleCommunicationAction(button);
    }
  });
  document.addEventListener('keydown',function(e){
    if(!HOWTO_STATE.open)return;
    if(e.key==='Escape'){e.preventDefault();closeHowTo();}
    else if(e.key==='ArrowRight'){e.preventDefault();moveHowTo(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();moveHowTo(-1);}
  });
  window.addEventListener('resize',scheduleHowToPosition,{passive:true});
  window.addEventListener('scroll',scheduleHowToPosition,{passive:true,capture:true});
  const restored=restoreLocalSession();
  render(true);
  if(fbReady){
    fbSelfTest();
    if(restored&&STATE.me.name){identitySession+=1;startPolling();}
  }
}

boot();
})();

</script>
